<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>索证索票工具 · jianyu</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231a365d'/><text x='32' y='40' font-family='Arial,sans-serif' font-size='18' font-weight='600' fill='white' text-anchor='middle'>索证</text></svg>">
<meta name="theme-color" content="#1a365d">
<style>
:root {
  --c-bg: #f6f8fb;
  --c-surface: #ffffff;
  --c-border: #e6ebf1;
  --c-border-strong: #d0d7e0;
  --c-text-1: #1a2332;
  --c-text-2: #5d6d7e;
  --c-text-3: #95a5a6;
  --c-primary: #1a365d;
  --c-primary-2: #2c5282;
  --c-primary-soft: #ebf2fa;
  --c-accent: #8e44ad;
  --c-accent-soft: #f5edf7;
  --c-high: #c62828;
  --c-high-soft: #ffebee;
  --c-mid: #e65100;
  --c-mid-soft: #fff3e0;
  --c-warn: #f57f17;
  --c-warn-soft: #fffde7;
  --c-ok: #2e7d32;
  --c-ok-soft: #e8f5e9;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --shadow-soft: 0 1px 2px rgba(20, 30, 50, 0.04), 0 0 1px rgba(20, 30, 50, 0.06);
  --shadow-mid: 0 4px 12px rgba(20, 30, 50, 0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--c-bg); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  color: var(--c-text-1); padding: 24px 16px; line-height: 1.6;
  font-size: 14px; -webkit-font-smoothing: antialiased;
}
.container { max-width: 1320px; margin: 0 auto; padding: 0 16px 44px; }

header.brand {
  display: flex; align-items: center; gap: 14px;
  padding: 6px 4px 20px; border-bottom: 1px solid var(--c-border); margin-bottom: 18px;
}
header.brand .logo {
  width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(135deg, var(--c-primary-2), var(--c-primary));
  display: flex; align-items: center; justify-content: center;
  color: white; font-weight: 600; font-size: 14px; letter-spacing: -0.5px;
  box-shadow: var(--shadow-soft); flex-shrink: 0;
}
header.brand .brand-text { flex: 1; min-width: 0; }
header.brand .brand-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
header.brand .brand-title .zh { font-size: 18px; font-weight: 600; color: var(--c-text-1); letter-spacing: 0.3px; }
header.brand .brand-title .en { font-size: 13px; color: var(--c-text-3); font-weight: 500; }
header.brand .subtitle { font-size: 12px; color: var(--c-text-2); margin-top: 6px; }
header.brand .ver {
  font-size: 11px; color: var(--c-primary); padding: 5px 12px;
  background: var(--c-primary-soft); border-radius: 14px;
  font-weight: 500; letter-spacing: 0.3px; flex-shrink: 0;
}

/* ── 工具栏 ── */
.toolbar {
  display: flex; gap: 10px; flex-wrap: wrap;
  padding: 14px 16px; background: var(--c-surface);
  border: 1px solid var(--c-border); border-radius: var(--r-md);
  margin-bottom: 16px; box-shadow: var(--shadow-soft);
  align-items: center;
}
.toolbar input[type=search], .toolbar select {
  font-family: inherit; font-size: 14px;
  border: 1px solid var(--c-border-strong); border-radius: var(--r-sm);
  padding: 8px 12px; background: var(--c-surface);
  color: var(--c-text-1); outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.toolbar input[type=search] { flex: 1; min-width: 220px; }
.toolbar input[type=search]:focus, .toolbar select:focus {
  border-color: var(--c-primary-2);
  box-shadow: 0 0 0 3px var(--c-primary-soft);
}
.toolbar .btn {
  font-family: inherit; font-size: 13px; font-weight: 500;
  border: 1px solid var(--c-border-strong); border-radius: var(--r-sm);
  padding: 8px 14px; background: var(--c-surface); color: var(--c-text-1);
  cursor: pointer; transition: all 0.15s;
}
.toolbar .btn:hover { background: var(--c-primary-soft); border-color: var(--c-primary-2); color: var(--c-primary); }
.toolbar .btn.primary {
  background: var(--c-primary); color: white; border-color: var(--c-primary);
}
.toolbar .btn.primary:hover { background: var(--c-primary-2); }
.toolbar .btn-count {
  margin-left: auto; font-size: 12px; color: var(--c-text-3);
  padding-left: 12px; border-left: 1px dashed var(--c-border);
}

/* ── Tab ── */
.tabs {
  display: flex; gap: 4px; padding: 4px;
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: var(--r-md); margin-bottom: 16px; box-shadow: var(--shadow-soft);
  overflow-x: auto;
}
.tab {
  font-family: inherit; font-size: 13px; font-weight: 500;
  border: none; background: transparent; color: var(--c-text-2);
  padding: 9px 16px; border-radius: var(--r-sm);
  cursor: pointer; transition: all 0.15s; white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
.tab:hover { background: var(--c-primary-soft); color: var(--c-primary); }
.tab.active {
  background: var(--c-primary); color: white;
}
.tab .badge {
  font-size: 11px; padding: 1px 6px; border-radius: 8px;
  background: rgba(255,255,255,0.25); font-weight: 500;
}
.tab:not(.active) .badge {
  background: var(--c-primary-soft); color: var(--c-primary);
}

/* ── 表格 ── */
.section {
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: var(--r-md); box-shadow: var(--shadow-soft);
  overflow: hidden; margin-bottom: 16px;
}
.section-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: 14px 18px; border-bottom: 1px solid var(--c-border);
  background: linear-gradient(180deg, var(--c-surface), #fafbfc);
}
.section-title {
  font-size: 14px; font-weight: 600; color: var(--c-text-1);
  display: flex; align-items: center; gap: 8px;
}
.section-title .ico { font-size: 16px; }
.section-meta { font-size: 12px; color: var(--c-text-3); }

.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.data-table thead th {
  background: var(--c-primary-soft); color: var(--c-primary);
  font-weight: 600; text-align: left;
  padding: 10px 14px; border-bottom: 1px solid var(--c-border-strong);
  white-space: nowrap; position: sticky; top: 0; z-index: 1;
}
.data-table tbody td {
  padding: 10px 14px; border-bottom: 1px solid var(--c-border);
  vertical-align: top; word-break: break-word;
}
.data-table tbody tr:hover { background: #fafbfc; }
.data-table tbody tr.expanded { background: var(--c-primary-soft); }
.data-table .col-name { font-weight: 500; color: var(--c-text-1); }
.data-table .col-scope { color: var(--c-text-2); }
.data-table .col-channel {
  display: inline-block; font-size: 11px; font-weight: 500;
  padding: 2px 8px; border-radius: 10px;
  background: var(--c-primary-soft); color: var(--c-primary);
}
.data-table .col-limit {
  font-family: "SF Mono", Consolas, monospace; font-size: 12px;
  color: var(--c-high); font-weight: 500;
}
.data-table .col-seq {
  color: var(--c-text-3); font-family: "SF Mono", Consolas, monospace;
  font-size: 12px; text-align: right;
}
.data-table .expand-btn {
  background: none; border: 1px solid var(--c-border-strong);
  border-radius: var(--r-sm); padding: 2px 10px; cursor: pointer;
  font-size: 12px; color: var(--c-text-2);
}
.data-table .expand-btn:hover { background: var(--c-primary-soft); color: var(--c-primary); border-color: var(--c-primary-2); }

/* ── 空态 ── */
.empty {
  padding: 60px 20px; text-align: center; color: var(--c-text-3); font-size: 13px;
}

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--c-text-1); color: white; padding: 10px 18px;
  border-radius: var(--r-sm); font-size: 13px;
  box-shadow: var(--shadow-mid); opacity: 0; pointer-events: none;
  transition: all 0.25s; z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 页脚 ── */
footer {
  margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--c-border);
  font-size: 12px; color: var(--c-text-3); text-align: center;
}

@media (max-width: 720px) {
  .toolbar { flex-direction: column; align-items: stretch; }
  .toolbar input[type=search] { width: 100%; }
  .toolbar .btn-count { margin-left: 0; padding-left: 0; border-left: none; padding-top: 4px; border-top: 1px dashed var(--c-border); }
  .data-table thead th, .data-table tbody td { padding: 8px 10px; }
}

/* ── v2.0 UI 覆盖层 ── */
/* ============================================================
   索证索票工具 v2.0 · UI 覆盖层
   设计语言对齐 GB2760 v5.0（深靛蓝 #1d3557 + 琥珀 #c8811f + 青瓷 #1c7a6b）
   ⚠ 纯增量样式，不改任何数据逻辑
   ============================================================ */

:root {
  --v2-primary: #1d3557;
  --v2-primary-2: #2c5282;
  --v2-primary-soft: #eaf0f8;
  --v2-accent: #c8811f;
  --v2-accent-soft: #fdf3e3;
  --v2-teal: #1c7a6b;
  --v2-teal-soft: #e5f2ef;
  --v2-ink: #16202e;
  --v2-ink-2: #556577;
  --v2-ink-3: #8b9aab;
  --v2-line: #e4eaf1;
  --v2-line-2: #cfd8e3;
  --v2-card: #ffffff;
  --v2-bg: #f4f7fa;
  --v2-r-sm: 8px;
  --v2-r-md: 12px;
  --v2-r-lg: 16px;
  --v2-sh-1: 0 1px 2px rgba(22, 32, 46, .05), 0 0 1px rgba(22, 32, 46, .05);
  --v2-sh-2: 0 6px 22px rgba(22, 32, 46, .10);
  --v2-sh-3: 0 14px 40px rgba(22, 32, 46, .16);
}

html, body { background: var(--v2-bg); }
body { padding: 0; color: var(--v2-ink); }

/* ── 页头：渐变卡片 ── */
header.brand {
  position: relative;
  display: flex; align-items: center; gap: 18px;
  padding: 26px 28px; border: none; margin: 0 0 20px;
  border-radius: 0 0 var(--v2-r-lg) var(--v2-r-lg);
  background:
    radial-gradient(900px 240px at 88% -40%, rgba(200, 129, 31, .20), transparent 62%),
    radial-gradient(700px 300px at 8% 130%, rgba(28, 122, 107, .18), transparent 60%),
    linear-gradient(135deg, #16273f 0%, var(--v2-primary) 48%, #24486f 100%);
  box-shadow: var(--v2-sh-2);
  overflow: hidden;
}
header.brand::after {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
  background: linear-gradient(180deg, var(--v2-accent), var(--v2-teal));
}
header.brand .logo {
  width: 54px; height: 54px; border-radius: 14px;
  background: rgba(255, 255, 255, .14);
  border: 1px solid rgba(255, 255, 255, .22);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 15px; letter-spacing: 1px;
  flex-shrink: 0; backdrop-filter: blur(3px);
}
header.brand .brand-text { flex: 1; min-width: 0; }
header.brand .brand-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
header.brand .brand-title .zh {
  font-size: 21px; font-weight: 700; color: #fff; letter-spacing: .4px;
}
header.brand .brand-title .en { font-size: 12.5px; color: rgba(255, 255, 255, .62); font-weight: 500; }
header.brand .subtitle {
  font-size: 12.5px; color: rgba(255, 255, 255, .72); margin-top: 7px; line-height: 1.6;
}
header.brand .ver {
  font-size: 11px; color: #fff; padding: 5px 13px;
  background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .20);
  border-radius: 14px; font-weight: 600; letter-spacing: .3px; flex-shrink: 0;
}

/* ── 工具栏 ── */
.toolbar {
  gap: 10px; flex-wrap: wrap;
  padding: 14px 16px; background: var(--v2-card);
  border: 1px solid var(--v2-line); border-radius: var(--v2-r-md);
  margin-bottom: 14px; box-shadow: var(--v2-sh-1);
  align-items: center;
  position: relative;
}
.toolbar input[type=search], .toolbar select {
  font-family: inherit; font-size: 13.5px;
  border: 1px solid var(--v2-line-2); border-radius: var(--v2-r-sm);
  padding: 9px 13px; background: var(--v2-card);
  color: var(--v2-ink); outline: none;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.toolbar input[type=search] { flex: 1 1 320px; min-width: 260px; }
.toolbar input[type=search]::placeholder { color: var(--v2-ink-3); }
.toolbar input[type=search]:focus, .toolbar select:focus {
  border-color: var(--v2-primary-2);
  box-shadow: 0 0 0 3px var(--v2-primary-soft);
}
.toolbar select { cursor: pointer; max-width: 190px; }
.toolbar select:disabled { background: #f4f6f9; cursor: not-allowed; }
/* 工具栏控件前置图标（用 CSS 画，不引入字体依赖） */
.toolbar .ico-inline {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--v2-ink-3); white-space: nowrap;
  flex-shrink: 0;
}
.toolbar .ico-inline svg { width: 15px; height: 15px; flex-shrink: 0; }
.toolbar .btn { display: inline-flex; align-items: center; gap: 6px; }
.toolbar .btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.toolbar .btn {
  font-family: inherit; font-size: 13px; font-weight: 600;
  border: 1px solid var(--v2-line-2); border-radius: var(--v2-r-sm);
  padding: 9px 15px; background: var(--v2-card); color: var(--v2-ink);
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.toolbar .btn:hover {
  background: var(--v2-primary-soft); border-color: var(--v2-primary-2); color: var(--v2-primary);
  transform: translateY(-1px);
}
.toolbar .btn.primary {
  background: var(--v2-primary); color: #fff; border-color: var(--v2-primary);
  box-shadow: 0 2px 8px rgba(29, 53, 87, .22);
}
.toolbar .btn.primary:hover {
  background: var(--v2-primary-2); border-color: var(--v2-primary-2);
  box-shadow: 0 4px 14px rgba(29, 53, 87, .28);
}
.toolbar .btn-count {
  margin-left: auto; font-size: 12px; color: var(--v2-ink-3);
  padding-left: 14px; border-left: 1px dashed var(--v2-line-2);
  white-space: nowrap;
}

/* ── Tab：分段控件 ── */
.tabs {
  display: flex; gap: 6px; padding: 6px;
  background: var(--v2-card); border: 1px solid var(--v2-line);
  border-radius: var(--v2-r-md); margin-bottom: 14px; box-shadow: var(--v2-sh-1);
  overflow-x: auto; scrollbar-width: thin;
}
.tab {
  font-family: inherit; font-size: 13px; font-weight: 600;
  border: none; background: transparent; color: var(--v2-ink-2);
  padding: 9px 17px; border-radius: var(--v2-r-sm);
  cursor: pointer; transition: all .18s; white-space: nowrap;
  display: flex; align-items: center; gap: 7px;
}
.tab:hover { background: var(--v2-primary-soft); color: var(--v2-primary); }
.tab.active {
  background: linear-gradient(135deg, var(--v2-primary), #2b5488);
  color: #fff; box-shadow: 0 2px 8px rgba(29, 53, 87, .24);
}
.tab .badge {
  font-size: 11px; padding: 1px 7px; border-radius: 8px;
  background: rgba(255, 255, 255, .24); font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.tab:not(.active) .badge {
  background: var(--v2-primary-soft); color: var(--v2-primary);
}

/* ── 区块 ── */
.section {
  background: var(--v2-card); border: 1px solid var(--v2-line);
  border-radius: var(--v2-r-md); box-shadow: var(--v2-sh-1);
  overflow: hidden; margin-bottom: 16px;
}
.section-head {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  padding: 15px 20px; border-bottom: 1px solid var(--v2-line);
  background: linear-gradient(180deg, #fff, #fafcfe);
  position: relative;
}
.section-head::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
  background: linear-gradient(180deg, var(--v2-accent), var(--v2-teal));
}
.section-title {
  font-size: 15px; font-weight: 700; color: var(--v2-ink);
  display: flex; align-items: center; gap: 9px;
}
.section-title .ico { font-size: 17px; }
.section-meta {
  font-size: 12px; color: var(--v2-ink-3); font-variant-numeric: tabular-nums;
  background: var(--v2-bg); padding: 3px 11px; border-radius: 12px; white-space: nowrap;
}

/* ── 表格 ── */
.table-scroll { overflow-x: auto; max-height: 68vh; overflow-y: auto; }
.data-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.data-table thead th {
  background: #f0f4f9; color: var(--v2-primary);
  font-weight: 700; text-align: left;
  padding: 11px 14px; border-bottom: 1px solid var(--v2-line-2);
  white-space: nowrap; position: sticky; top: 0; z-index: 2;
  box-shadow: inset 0 -1px 0 var(--v2-line-2);
}
.data-table tbody td {
  padding: 11px 14px; border-bottom: 1px solid var(--v2-line);
  vertical-align: top; word-break: break-word; line-height: 1.65;
}
.data-table tbody tr:nth-child(even) { background: #fbfcfe; }
.data-table tbody tr:hover { background: var(--v2-primary-soft); }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table .col-name { font-weight: 600; color: var(--v2-ink); }
.data-table .col-scope { color: var(--v2-ink-2); font-size: 12.5px; }
.data-table .col-channel {
  display: inline-block; font-size: 11px; font-weight: 700;
  padding: 2px 9px; border-radius: 10px; white-space: nowrap;
  background: var(--v2-teal-soft); color: var(--v2-teal);
  border: 1px solid rgba(28, 122, 107, .18);
}
.data-table .col-limit {
  font-family: "SF Mono", Consolas, monospace; font-size: 12px;
  color: #c62828; font-weight: 700; white-space: nowrap;
}
.data-table .col-seq {
  color: var(--v2-ink-3); font-family: "SF Mono", Consolas, monospace;
  font-size: 12px; text-align: right; font-variant-numeric: tabular-nums;
}
.data-table mark {
  background: #fff2b8; color: inherit; border-radius: 2px; padding: 0 2px;
  font-weight: 600;
}

/* ── 空态 ── */
.empty {
  padding: 46px 20px; text-align: center; color: var(--v2-ink-3); font-size: 13px;
}

/* ── Toast ── */
.toast {
  position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--v2-ink); color: #fff; padding: 11px 20px;
  border-radius: 999px; font-size: 13px; font-weight: 500;
  box-shadow: var(--v2-sh-3); opacity: 0; pointer-events: none;
  transition: opacity .22s, transform .22s; z-index: 100;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── 页脚 ── */
footer {
  margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--v2-line);
  font-size: 11.5px; color: var(--v2-ink-3); text-align: center;
}

/* ── 响应式 ── */
@media (max-width: 1180px) {
  .container { padding: 0 20px 40px; }
  header.brand { padding: 22px 24px; }
}
@media (max-width: 900px) {
  body { padding: 0; }
  .container { padding: 0 16px 40px; }
  header.brand {
    padding: 18px 20px; border-radius: 0 0 14px 14px;
    flex-wrap: wrap; gap: 12px;
  }

  header.brand .brand-title .zh { font-size: 18px; }
  header.brand .brand-text { flex: 1 1 100%; order: 3; }
  header.brand .ver { margin-left: auto; }
  .toolbar { flex-direction: column; align-items: stretch; }
  .toolbar input[type=search] { width: 100%; min-width: 0; }
  .toolbar .btn { flex: 1; text-align: center; }
  .toolbar .btn-count {
    margin-left: 0; padding-left: 0; border-left: none;
    padding-top: 6px; border-top: 1px dashed var(--v2-line-2); text-align: center;
  }
  .section-head { padding: 13px 16px; }
  .data-table thead th, .data-table tbody td { padding: 9px 11px; font-size: 12.5px; }
  .table-scroll { max-height: none; }
}
@media (max-width: 560px) {
  .container { padding: 0 12px 32px; }
  header.brand { padding: 16px 16px; }
  header.brand .brand-title .zh { font-size: 16.5px; }
  header.brand .brand-title .en { font-size: 11.5px; }
  header.brand .subtitle { font-size: 11.5px; }
  .tabs { gap: 4px; padding: 5px; }

<!-- 塑化剂 -->

  <div class="section-head">
    <div class="section-title"><span class="ico">🧪</span><span id="title-plasticizer">塑化剂（索证明细）</span></div>
    <div class="section-meta" id="meta-plasticizer"></div>

    <thead>

        <th style="width:60px">序号</th>

        <th style="width:60px">序号</th>
        <th>类别</th>

        <th>索要明细</th>

  数据来源：各类产品索证索票汇总.xlsx · 共 4 类 28 个项目 · jianyu 工具箱
</footer>

</div>

<div class="toast" id="toast">已复制</div>

<script>

// ── 状态 ──
let DATA = null;
let currentTab = "food";
let expanded = new Set();  // 展开的项目 key (catid + "/" + seq)

const DATA_URLS = [
  './data/suozhengsuopiao/suozhengsuopiao.json',
  './data/suozhengsuopiao/suozhengsuopiao.json?v=' + Date.now(),
];

// ── 工具函数 ──
function escapeHTML(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function highlight(s, q) {
  const safe = escapeHTML(s);
  if (!q) return safe;
  // 不区分大小写、整词匹配可能漏字，所以做"包含"匹配并加高亮
  const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
  return safe.replace(re, '<mark style="background:#fff59d;color:inherit;border-radius:2px;padding:0 2px">$1</mark>');
}
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 1500);
}

async function loadData() {
  for (const url of DATA_URLS) {
    try {
      const res = await fetch(url);
      if (res.ok) {
        DATA = await res.json();
        return true;
      }
    } catch (e) {
      console.warn("加载失败", url, e);
    }
  }
  return false;
}

// ── 渲染 ──
function renderFoodOrContact(catId) {
  const cat = DATA.categories.find(c => c.id === catId);
  if (!cat) return;
  const tbody = document.getElementById("tbl-" + catId);
  const meta = document.getElementById("meta-" + catId);
  const empty = document.getElementById("empty-" + catId);
  const q = document.getElementById("search").value.trim();
  const catFilter = document.getElementById("catFilter").value;
  const scopeFilter = document.getElementById("scopeFilter").value;

  // 展开所有明细行
  const rows = [];
  for (const it of cat.items) {
    if (scopeFilter && it.scope !== scopeFilter) continue;
    let anyMatch = false;
    let itemMatches = [];
    for (const req of it.requirements) {
      if (catFilter && req.channel !== catFilter) continue;
      const haystack = `${it.name} ${it.scope} ${req.channel} ${req.detail} ${req.remark}`;
      const match = !q || haystack.toLowerCase().includes(q.toLowerCase());
      if (match) {
        itemMatches.push(req);
        anyMatch = true;
      }
    }
    // 当未输入关键字时全部显示；输入时只显示匹配行
    if (!q && !catFilter && !scopeFilter) {
      itemMatches = it.requirements;
      anyMatch = true;
    }
    if (anyMatch && itemMatches.length > 0) {
      rows.push({item: it, reqs: itemMatches});
    }
  }

  meta.textContent = `${rows.length} / ${cat.items.length} 个项目`;
  document.getElementById("cnt-" + catId).textContent = rows.length;
  document.getElementById("counter").textContent = `${rows.length} 项匹配`;

  if (rows.length === 0) {
    tbody.innerHTML = "";
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  tbody.innerHTML = rows.map(({item, reqs}) => reqs.map((req, i) => `
    <tr>
      <td class="col-seq">${i === 0 ? item.seq : ""}</td>
      <td class="col-name">${i === 0 ? highlight(item.name, q) : ""}</td>
      <td class="col-scope">${i === 0 ? highlight(item.scope, q) : ""}</td>
      <td><span class="col-channel">${highlight(req.channel, q)}</span></td>
      <td>${highlight(req.detail, q)}</td>
      <td style="color:var(--c-text-2);font-size:12px">${highlight(req.remark, q)}</td>
    </tr>
  `).join("")).join("");
}

function renderPlasticizer() {
  const cat = DATA.categories.find(c => c.id === "plasticizer");
  const tbody = document.getElementById("tbl-plasticizer");
  const meta = document.getElementById("meta-plasticizer");
  const empty = document.getElementById("empty-plasticizer");
  const q = document.getElementById("search").value.trim();

  const rows = [];
  for (const it of cat.items) {
    const triples = q
      ? it.triples.filter(t => {
          const hay = `${it.category} ${t.product} ${t.item} ${t.limit} ${t.remark}`;
          return hay.toLowerCase().includes(q.toLowerCase());
        })
      : it.triples;
    if (triples.length > 0) rows.push({item: it, triples});
  }

  meta.textContent = `${rows.length} / ${cat.items.length} 个类别`;
  document.getElementById("cnt-plasticizer").textContent = rows.length;

  if (rows.length === 0) {
    tbody.innerHTML = "";
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  tbody.innerHTML = rows.map(({item, triples}) => triples.map((t, i) => `
    <tr>
      <td class="col-seq">${i === 0 ? item.seq : ""}</td>
      <td class="col-name">${i === 0 ? highlight(item.category, q) : ""}</td>
      <td style="color:var(--c-text-2);font-size:12px">${highlight(t.product, q)}</td>
      <td><span class="col-channel">${highlight(t.item || "—", q)}</span></td>
      <td class="col-limit">${highlight(t.limit || "—", q)}</td>
      <td style="color:var(--c-text-2);font-size:12px">${highlight(t.remark, q)}</td>
  </tr>
  `).join("")).join("");
}

function renderNonGMO() {
  const cat = DATA.categories.find(c => c.id === "non_gmo");
  const tbody = document.getElementById("tbl-non_gmo");
  const meta = document.getElementById("meta-non_gmo");
  const empty = document.getElementById("empty-non_gmo");
  const q = document.getElementById("search").value.trim();

  const rows = [];
  for (const it of cat.items) {
    const products = q
      ? it.products.filter(p => {
          const hay = `${it.category} ${p.product} ${p.detail}`;
          return hay.toLowerCase().includes(q.toLowerCase());
        })
      : it.products;
    if (products.length > 0) rows.push({item: it, products});
  }

  meta.textContent = `${rows.length} / ${cat.items.length} 个类别`;
  document.getElementById("cnt-non_gmo").textContent = rows.length;

  if (rows.length === 0) {
    tbody.innerHTML = "";
    empty.hidden = false;
    return;
  }
  empty.hidden = true;

  tbody.innerHTML = rows.map(({item, products}) => products.map((p, i) => `
    <tr>
      <td class="col-seq">${i === 0 ? item.seq : ""}</td>
      <td class="col-name">${i === 0 ? highlight(item.category, q) : ""}</td>
      <td>${highlight(p.product, q)}</td>
      <td>${highlight(p.detail || "/", q)}</td>
    </tr>
  `).join("")).join("");
}

function render() {
  document.getElementById("sec-food").hidden = currentTab !== "food";
  document.getElementById("sec-contact").hidden = currentTab !== "contact";
  document.getElementById("sec-plasticizer").hidden = currentTab !== "plasticizer";
  document.getElementById("sec-non_gmo").hidden = currentTab !== "non_gmo";
  for (const t of document.querySelectorAll(".tab")) {
    t.classList.toggle("active", t.dataset.tab === currentTab);
  }
  if (currentTab === "food" || currentTab === "contact") {
    renderFoodOrContact(currentTab);
  } else if (currentTab === "plasticizer") {
    renderPlasticizer();
  } else if (currentTab === "non_gmo") {
    renderNonGMO();
  }
  updateFilters();
  updateAllBadges();
}

// 仅更新 Tab 徽章（不切换 section），让所有 Tab 都显示正确计数
function updateAllBadges() {
  const q = document.getElementById("search").value.trim();
  const catFilter = document.getElementById("catFilter").value;
  const scopeFilter = document.getElementById("scopeFilter").value;

  for (const cat of DATA.categories) {
    let count = 0;
    if (cat.id === "food" || cat.id === "contact") {
      for (const it of cat.items) {
        if (scopeFilter && it.scope !== scopeFilter) continue;
        let hasMatch = false;
        for (const req of it.requirements) {
          if (catFilter && req.channel !== catFilter) continue;
          const hay = `${it.name} ${it.scope} ${req.channel} ${req.detail} ${req.remark}`;
          if (!q || hay.toLowerCase().includes(q.toLowerCase())) { hasMatch = true; break; }
        }
        if (hasMatch) count++;
      }
    } else if (cat.id === "plasticizer") {
      for (const it of cat.items) {
        const triples = q
          ? it.triples.filter(t => `${it.category} ${t.product} ${t.item} ${t.limit} ${t.remark}`.toLowerCase().includes(q.toLowerCase()))
          : it.triples;
        if (triples.length > 0) count++;
      }
    } else if (cat.id === "non_gmo") {
      for (const it of cat.items) {
        const products = q
          ? it.products.filter(p => `${it.category} ${p.product} ${p.detail}`.toLowerCase().includes(q.toLowerCase()))
          : it.products;
        if (products.length > 0) count++;
      }
    }
    document.getElementById("cnt-" + cat.id).textContent = count;
  }
}

function updateFilters() {
  // 填充采购途径和范围筛选
  const catFilter = document.getElementById("catFilter");
  const scopeFilter = document.getElementById("scopeFilter");
  const curCat = catFilter.value;
  const curScope = scopeFilter.value;

  // 收集当前 Tab 的全部渠道和范围
  const channels = new Set();
  const scopes = new Set();
  const cat = DATA.categories.find(c => c.id === currentTab);
  if (cat && (cat.id === "food" || cat.id === "contact")) {
    for (const it of cat.items) {
      if (it.scope) scopes.add(it.scope);
      for (const req of it.requirements) channels.add(req.channel);
    }
  } else if (cat) {
    for (const it of cat.items) {
      if (it.scope) scopes.add(it.scope);
      if (it.category) scopes.add(it.category);
    }
  }

  catFilter.innerHTML = '<option value="">全部采购途径</option>' +
    Array.from(channels).sort().map(c => `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join("");
  scopeFilter.innerHTML = '<option value="">全部范围</option>' +
    Array.from(scopes).sort().map(s => `<option value="${escapeHTML(s)}">${escapeHTML(s)}</option>`).join("");

  if (Array.from(catFilter.options).some(o => o.value === curCat)) catFilter.value = curCat;
  if (Array.from(scopeFilter.options).some(o => o.value === curScope)) scopeFilter.value = curScope;

  // 对塑化剂/非转基因，禁用采购途径筛选
  const disable = (currentTab === "plasticizer" || currentTab === "non_gmo");
  catFilter.disabled = disable;
  catFilter.style.opacity = disable ? 0.5 : 1;
}

function getCurrentRows() {
  // 返回当前可见行的扁平数据，用于复制 / 导出
  const cat = DATA.categories.find(c => c.id === currentTab);
  if (!cat) return {headers: [], rows: []};
  if (cat.id === "food" || cat.id === "contact") {
    const headers = ["序号", "项目", "范围", "采购途径", "索证明细", "备注"];
    const rows = [];
    for (const it of cat.items) {
      for (const req of it.requirements) {
        rows.push([it.seq, it.name, it.scope, req.channel, req.detail, req.remark]);
      }
    }
    return {headers, rows};
  } else if (cat.id === "plasticizer") {
    const headers = ["序号", "食品类别", "产品明细", "塑化剂项目", "限值", "备注"];
    const rows = [];
    for (const it of cat.items) {
      for (const t of it.triples) {
        rows.push([it.seq, it.category, t.product, t.item, t.limit, t.remark]);
      }
    }
    return {headers, rows};
  } else if (cat.id === "non_gmo") {
    const headers = ["序号", "类别", "产品明细", "索要明细"];
    const rows = [];
    for (const it of cat.items) {
      for (const p of it.products) {
        rows.push([it.seq, it.category, p.product, p.detail]);
      }
    }
    return {headers, rows};
  }
}

function exportCSV() {
  const {headers, rows} = getCurrentRows();
  const esc = v => `"${String(v ?? "").replace(/"/g, '""').replace(/\r?\n/g, " ")}"`;
  const csv = "\uFEFF" + headers.map(esc).join(",") + "\n" +
    rows.map(r => r.map(esc).join(",")).join("\n");
  const blob = new Blob([csv], {type: "text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `索证索票_${currentTab}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast("已导出 CSV（可用 Excel 打开）");
}

function copyRows() {
  const {headers, rows} = getCurrentRows();
  const text = headers.join("\t") + "\n" +
    rows.map(r => r.map(v => String(v ?? "").replace(/\t/g, " ").replace(/\r?\n/g, " ")).join("\t")).join("\n");
  navigator.clipboard.writeText(text).then(() => showToast(`已复制 ${rows.length} 行（Excel 粘贴格式）`));
}

// ── 事件 ──
document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    currentTab = t.dataset.tab;
    render();
  });
});
document.getElementById("search").addEventListener("input", render);
document.getElementById("catFilter").addEventListener("change", render);
document.getElementById("scopeFilter").addEventListener("change", render);
document.getElementById("btnExport").addEventListener("click", exportCSV);
document.getElementById("btnCopy").addEventListener("click", copyRows);

// 初始化 — 加载数据后渲染
(async () => {
  document.body.insertAdjacentHTML("afterbegin",
    `<div id="loading" style="position:fixed;inset:0;background:rgba(255,255,255,0.9);display:flex;align-items:center;justify-content:center;z-index:99;font-size:14px;color:var(--c-text-2)">加载数据中...</div>`
  );
  const ok = await loadData();
  document.getElementById("loading")?.remove();
  if (!ok) {
    document.body.insertAdjacentHTML("afterbegin",
      `<div style="padding:24px;background:#ffebee;border:1px solid #ef9a9a;color:#c62828;margin:20px;border-radius:8px">⚠ 无法加载数据（请通过 HTTP server 访问，例如 http://127.0.0.1:8765/suozhengsuopiao.html）</div>`
    );
    return;
  }
  render();
})();
</script>

<!-- v2.0 UI 增量脚本（不改业务逻辑） -->
<script>
/* ============================================================
   索证索票工具 v2.0 · UI 增量脚本
   ⚠ 原则：只增强交互，绝不改动 render* / getCurrentRows / exportCSV / copyRows
            任何一行业务逻辑；不新增、不删除、不修改任何数据条目
   ============================================================ */
(function () {
  'use strict';

  /* ── ① 表格加横向滚动容器（保证窄屏表头 sticky 仍生效） ── */
  function wrapTables() {
    document.querySelectorAll('.section table.data-table').forEach(function (tbl) {
      if (tbl.parentElement && tbl.parentElement.classList.contains('table-scroll')) return;
      var wrap = document.createElement('div');
      wrap.className = 'table-scroll';
      tbl.parentNode.insertBefore(wrap, tbl);
      wrap.appendChild(tbl);
    });
  }

  /* ── ② 快捷键：/ 聚焦搜索、Esc 清空、Ctrl/Cmd+Enter 导出 ── */
  function bindKeys() {
    document.addEventListener('keydown', function (e) {
      var tag = (e.target && e.target.tagName) || '';
      var typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';

      if (e.key === '/' && !typing) {
        e.preventDefault();
        var s = document.getElementById('search');
        if (s) { s.focus(); s.select(); }
        return;
      }
      if (e.key === 'Escape') {
        var s2 = document.getElementById('search');
        if (s2 && s2.value) {
          s2.value = '';
          s2.dispatchEvent(new Event('input', { bubbles: true }));
        }
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        var btn = document.getElementById('btnExport');
        if (btn) btn.click();
      }
    });
  }

  /* ── ③ 搜索框提示气泡（不改 placeholder 文案，只加 title） ── */
  function decorateSearch() {
    var s = document.getElementById('search');
    if (s) s.title = '按 / 聚焦 · Esc 清空 · Ctrl+Enter 导出';
    ['catFilter', 'scopeFilter'].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.title = '按当前 Tab 的数据动态生成选项';
    });
  }

  /* ── ④ 命中态：搜索框有内容时加一个"过滤中"标记条 ── */
  function markFiltering() {
    var s = document.getElementById('search');
    var counter = document.getElementById('counter');
    if (!s || !counter) return;
    var hasFilter = !!(s.value && s.value.trim());
    var bar = document.getElementById('v2FilterBar');
    if (hasFilter && !bar) {
      bar = document.createElement('div');
      bar.id = 'v2FilterBar';
      bar.className = 'v2-filter-bar';
      var tb = document.querySelector('.toolbar');
      if (tb && tb.parentNode) tb.parentNode.insertBefore(bar, tb.nextSibling);
    }
    if (bar) {
      bar.style.display = hasFilter ? 'flex' : 'none';
      if (hasFilter) {
        var q = s.value.trim();
        bar.innerHTML =
          '<span class="v2-fb-dot"></span>' +
          '<span>正在按 <b>' + escapeHTML(q) + '</b> 过滤</span>' +
          '<span class="v2-fb-count">' + counter.textContent + '</span>' +
          '<button class="v2-fb-clear" type="button">清除</button>';
        var btn = bar.querySelector('.v2-fb-clear');
        if (btn) btn.addEventListener('click', function () {
          s.value = '';
          s.dispatchEvent(new Event('input', { bubbles: true }));
          s.focus();
        });
      }
    }
  }

  function escapeHTML(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* ── ⑤ 版本号 ── */
  function bumpVer() {
    var v = document.querySelector('header.brand .ver');
    if (v) v.textContent = 'jianyu · v2.0';
  }

  /* ── ⑥ 工具栏图标（内联 SVG，纯装饰；不改按钮文字 / id / 事件） ── */
  var ICO = {
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>',
    copy:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
    excel:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13l6 5M15 13l-6 5"/></svg>'
  };

  function addToolbarIcons() {
    var tb = document.querySelector('.toolbar');
    if (!tb || tb.getAttribute('data-v2-ico')) return;
    tb.setAttribute('data-v2-ico', '1');

    var s = document.getElementById('search');
    if (s && s.parentNode === tb) {
      var holder = document.createElement('span');
      holder.className = 'ico-inline';
      holder.innerHTML = ICO.search;
      tb.insertBefore(holder, s);
    }

    var bCopy = document.getElementById('btnCopy');
    if (bCopy) bCopy.insertAdjacentHTML('afterbegin', ICO.copy);
    var bExp = document.getElementById('btnExport');
    if (bExp) bExp.insertAdjacentHTML('afterbegin', ICO.excel);
  }

  /* ── 启动 ── */
  function init() {
    wrapTables();
    bindKeys();
    decorateSearch();
    bumpVer();
    addToolbarIcons();
    markFiltering();

    // 监听既有事件流，只做 UI 反馈，不改逻辑
    var s = document.getElementById('search');
    if (s) s.addEventListener('input', markFiltering);
    var tabs = document.getElementById('tabs');
    if (tabs) tabs.addEventListener('click', function () { setTimeout(markFiltering, 0); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // 数据是异步加载的，表格渲染后才需要再包一次
  window.addEventListener('load', function () { setTimeout(wrapTables, 60); });
})();

</script>
</body>
