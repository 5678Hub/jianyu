<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>药食同源及食品原料查询工具</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231f8a4c'/><text x='32' y='44' font-family='Arial,sans-serif' font-size='26' font-weight='600' fill='white' text-anchor='middle'>药</text></svg>">
<meta name="theme-color" content="#1f8a4c">
<style>
:root{
  --c-bg:#f4f7f5; --c-surface:#fff; --c-border:#e3ebe5; --c-border-s:#d3ddd5;
  --c-t1:#18281f; --c-t2:#54685d; --c-t3:#93a49a;
  --c-pri:#1f8a4c; --c-pri2:#2aa55d; --c-pri3:#16703d; --c-pri-soft:#e6f4ec;
  --c-warn:#f57f17; --c-warn-soft:#fff8e1;
  --c-danger:#d93025; --c-danger-soft:#fdecea;
  --c-info:#1a73e8; --c-info-soft:#e8f0fe;
  --r-s:8px; --r-m:12px; --r-l:16px;
  --sh:0 1px 2px rgba(20,40,30,.04),0 2px 8px rgba(20,40,30,.05);
  --sh-h:0 6px 20px rgba(31,138,76,.14),0 0 1px rgba(20,40,30,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{background:var(--c-bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:var(--c-t1);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:#bfe6cf;color:#123c26}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#c9d6cd;border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#a8bcB0;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;font-size:14px}

.layout{display:flex;min-height:100vh}

/* 侧栏 */
aside{width:240px;flex-shrink:0;background:var(--c-surface);border-right:1px solid var(--c-border);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--c-border);margin-bottom:14px}
.brand-logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--c-pri2),var(--c-pri3));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:650;font-size:18px;box-shadow:0 3px 10px rgba(31,138,76,.3);flex-shrink:0}
.brand-title{font-size:15px;font-weight:650;line-height:1.25;letter-spacing:.2px}
.brand-sub{font-size:11px;color:var(--c-t3);margin-top:2px}
.back{display:flex;gap:6px;align-items:center;padding:7px 10px;margin-bottom:12px;font-size:12px;color:var(--c-t2);background:var(--c-bg);border:1px solid var(--c-border);border-radius:var(--r-s);transition:.15s}
.back:hover{background:var(--c-pri-soft);border-color:var(--c-pri2);color:var(--c-pri)}
.ctitle{font-size:10.5px;color:var(--c-t3);text-transform:uppercase;letter-spacing:.8px;margin:14px 4px 7px;font-weight:650}
.nav{display:flex;flex-direction:column;gap:1px}
.nav-i{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:var(--r-s);font-size:13px;color:var(--c-t2);cursor:pointer;transition:.15s;border:1px solid transparent;user-select:none}
.nav-i:hover{background:var(--c-bg);color:var(--c-t1)}
.nav-i.on{background:var(--c-pri-soft);color:var(--c-pri3);border-color:#bfe3cd;font-weight:550}
.nav-i .ic{font-size:13px;width:15px;text-align:center;flex-shrink:0}
.nav-i .ct{margin-left:auto;font-size:11px;color:var(--c-t3);font-variant-numeric:tabular-nums;background:var(--c-bg);border-radius:9px;padding:0 7px;line-height:17px}
.nav-i.on .ct{color:var(--c-pri3);background:#d6f0e2}
.nav-lk{font-size:11px;text-decoration:none;opacity:.55;padding:0 2px;flex-shrink:0}
.nav-lk:hover{opacity:1}
.nav-sub{padding-left:22px;font-size:12.5px}
.nav-sub .nav-i{padding:5px 9px}

/* 主区 */
main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{background:linear-gradient(120deg,#177243 0%,var(--c-pri) 55%,#2fae63 100%);color:#fff;padding:20px 24px 18px;box-shadow:0 2px 12px rgba(23,114,67,.18);position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;right:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),rgba(255,255,255,0) 70%);pointer-events:none}
header.top h1{font-size:19px;font-weight:650;display:flex;align-items:center;gap:9px;letter-spacing:.2px}
header.top .sub{font-size:12px;opacity:.88;margin-top:5px}
.hstats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hstat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:10px;padding:6px 13px;font-size:11.5px;backdrop-filter:blur(2px);display:flex;align-items:baseline;gap:6px}
.hstat b{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.2px}

.wrap{padding:14px 20px 40px;max-width:1500px;width:100%}

/* 搜索区 */
.filters{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-m);padding:14px 14px 12px;margin-bottom:12px;box-shadow:var(--sh)}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.searchbox{position:relative;flex:1;min-width:240px}
.searchbox input{width:100%;padding:9px 34px 9px 34px;border:1px solid var(--c-border-s);border-radius:10px;font-size:14px;background:var(--c-bg);outline:none;transition:.15s}
.searchbox input:focus{border-color:var(--c-pri2);background:#fff;box-shadow:0 0 0 3px var(--c-pri-soft)}
.searchbox .si{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--c-t3);font-size:14px;pointer-events:none}
.searchbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--c-t3);cursor:pointer;font-size:15px;padding:2px 5px;border-radius:4px;display:none}
.searchbox .clr:hover{background:var(--c-border);color:var(--c-t1)}
select.sel{padding:9px 26px 9px 10px;border:1px solid var(--c-border-s);border-radius:10px;background:var(--c-bg);color:var(--c-t1);cursor:pointer;outline:none;max-width:230px;transition:.15s}
select.sel:hover{border-color:var(--c-pri2)}
select.sel:focus{border-color:var(--c-pri2);box-shadow:0 0 0 3px var(--c-pri-soft)}
.btn{padding:9px 14px;border:1px solid var(--c-border-s);border-radius:10px;background:#fff;color:var(--c-t2);font-size:13px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--c-pri2);color:var(--c-pri);background:var(--c-pri-soft)}
.btn.pri{background:var(--c-pri);border-color:var(--c-pri);color:#fff}
.btn.pri:hover{background:var(--c-pri2);border-color:var(--c-pri2);color:#fff}
.hint{font-size:12px;color:var(--c-t3);margin-top:9px;line-height:1.7}
.hint code{background:var(--c-bg);border:1px solid var(--c-border);border-radius:4px;padding:1px 5px;font-size:11.5px;font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--c-t2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--c-pri-soft);border:1px solid var(--c-pri2);color:var(--c-pri);border-radius:20px;font-size:12px;cursor:pointer;transition:.15s}
.chip:hover{background:var(--c-pri2);color:#fff}
.chip .x{font-size:13px;opacity:.65}
.chip .x:hover{opacity:1}
.chip.warn{background:var(--c-warn-soft);border-color:var(--c-warn);color:var(--c-warn)}

/* 状态筛选条 */
.statbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px;padding-top:11px;border-top:1px dashed var(--c-border)}
.st{padding:4px 11px;border:1px solid var(--c-border-s);border-radius:20px;font-size:12px;color:var(--c-t2);cursor:pointer;transition:.15s;background:#fff;display:inline-flex;align-items:center;gap:6px;user-select:none}
.st:hover{border-color:var(--c-pri2);color:var(--c-pri);box-shadow:0 1px 4px rgba(31,138,76,.12)}
.st.on{background:var(--c-pri);border-color:var(--c-pri);color:#fff;box-shadow:0 2px 6px rgba(31,138,76,.25)}
.st.on .dot{box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.st .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.st .n{font-variant-numeric:tabular-nums;opacity:.7;font-size:11px}

/* 结果区 */
.resultbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 10px;font-size:13px;color:var(--c-t2)}
.resultbar b{color:var(--c-pri);font-variant-numeric:tabular-nums;font-size:16px;font-weight:650}
.res-actions{margin-left:auto;display:flex;gap:6px}

/* 表格 */
.tw{background:var(--c-surface);border:1px solid var(--c-border);border-radius:var(--r-m);overflow:hidden;box-shadow:var(--sh)}
.tscroll{overflow:auto;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 250px)}
table{width:100%;border-collapse:collapse}
th{background:#f7faf8;font-weight:600;font-size:12px;color:var(--c-t2);text-align:left;padding:10px 12px;border-bottom:1px solid var(--c-border);white-space:nowrap;position:sticky;top:0;z-index:5;cursor:pointer;user-select:none;letter-spacing:.3px;box-shadow:0 1px 0 var(--c-border)}
th:hover{color:var(--c-pri)}
th .ar{opacity:.35;margin-left:3px;font-size:10px}
th.sorted{color:var(--c-pri)}
th.sorted .ar{opacity:1}
td{padding:9px 12px;border-bottom:1px solid #eef3ef;font-size:13px;vertical-align:top}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:nth-child(even){background:#fafcfa}
tbody tr:hover{background:var(--c-pri-soft)}
tbody tr.open{background:#dcf1e5;box-shadow:inset 3px 0 0 var(--c-pri)}
.c-name{font-weight:600;color:var(--c-t1);font-size:13.5px;line-height:1.45}
.c-note{font-size:11.5px;color:var(--c-t3);margin-top:3px;line-height:1.5}
.alias{font-size:10.5px;font-weight:400;color:#a05a00;background:var(--c-warn-soft);border:1px solid #f2d9a6;border-radius:5px;padding:1px 6px;margin-left:7px;white-space:nowrap;vertical-align:1px}
/* 链接入口 */
.lk{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:var(--c-pri);background:var(--c-pri-soft);border:1px solid #b8e0c8;border-radius:6px;padding:1px 7px;margin-left:7px;cursor:pointer;text-decoration:none;white-space:nowrap;vertical-align:1px;transition:.15s}
.lk:hover{background:var(--c-pri);border-color:var(--c-pri);color:#fff;text-decoration:none}
.lk .lk-ico{font-size:10px}
.lks{margin:2px 0 0}
.lks-item{border:1px solid var(--c-border);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fafcfa;transition:.15s}
.lks-item:hover{border-color:var(--c-border-s);box-shadow:var(--sh)}
.lks-t{font-size:12.5px;font-weight:600;color:var(--c-t1);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.lks-src{font-size:10.5px;font-weight:400;color:var(--c-t3);background:var(--c-surface);border:1px solid var(--c-border);border-radius:4px;padding:1px 6px}
.lks-src.s-A{color:var(--c-pri);border-color:#b8e0c8;background:var(--c-pri-soft)}
.lks-src.s-B{color:var(--c-info);border-color:#c3d9fd;background:var(--c-info-soft)}
.lks-src.s-C{color:var(--c-warn);border-color:#f7d9a0;background:var(--c-warn-soft)}
.lks-u{font-size:11.5px;color:var(--c-info);word-break:break-all;line-height:1.6;text-decoration:none;display:block;padding:2px 0}
.lks-u:hover{text-decoration:underline}
.lks-none{font-size:12.5px;color:var(--c-t3);padding:8px 2px}
.c-basis{color:var(--c-t2);font-size:12px;max-width:280px;line-height:1.5}
.c-date{font-variant-numeric:tabular-nums;color:var(--c-t2);font-size:12px;white-space:nowrap}
.c-tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:10.5px;padding:1.5px 8px;border-radius:10px;background:var(--c-bg);border:1px solid var(--c-border);color:var(--c-t2);white-space:nowrap}
.tag.t-pri{background:var(--c-pri-soft);border-color:#b8e0c8;color:var(--c-pri)}
.tag.t-info{background:var(--c-info-soft);border-color:#c3d9fd;color:var(--c-info)}
.tag.t-warn{background:var(--c-warn-soft);border-color:#f7d9a0;color:var(--c-warn)}
.tag.t-dan{background:var(--c-danger-soft);border-color:#f5c6c2;color:var(--c-danger)}
.pill{font-size:11px;font-weight:500;padding:2.5px 9px;border-radius:10px;white-space:nowrap;display:inline-block}
.p-ok{background:var(--c-pri-soft);color:var(--c-pri3)}
.p-warn{background:var(--c-warn-soft);color:#b35c00}
.p-dan{background:var(--c-danger-soft);color:var(--c-danger)}
.p-info{background:var(--c-info-soft);color:var(--c-info)}
.p-gray{background:var(--c-bg);color:var(--c-t2);border:1px solid var(--c-border)}
.p-mid{background:#fff4e5;color:#b35c00}

mark{background:#ffe98a;color:inherit;padding:0 2px;border-radius:3px;box-shadow:0 0 0 1px #f5d95c inset}
.empty{padding:64px 20px;text-align:center;color:var(--c-t3)}
.empty .em{font-size:42px;margin-bottom:12px;opacity:.45}

/* 详情抽屉 */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--c-surface);box-shadow:-8px 0 32px rgba(15,35,25,.16);transform:translateX(100%);transition:transform .24s cubic-bezier(.32,.72,.35,1);z-index:50;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.dr-head{padding:16px 18px 14px;border-bottom:1px solid var(--c-border);display:flex;align-items:flex-start;gap:10px;background:linear-gradient(180deg,#f6faf7,#fff)}
.dr-head h3{font-size:16.5px;font-weight:650;line-height:1.4;flex:1;letter-spacing:.2px}
.dr-close{font-size:19px;color:var(--c-t3);line-height:1;padding:3px 8px;border-radius:7px;transition:.15s}
.dr-close:hover{background:var(--c-bg);color:var(--c-t1)}
.dr-body{padding:16px 18px 20px;overflow-y:auto;flex:1}
.dr-foot{padding:11px 18px;border-top:1px solid var(--c-border);font-size:11.5px;color:var(--c-t3);display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#fafcfa}
.kv{display:grid;grid-template-columns:112px 1fr;gap:9px 12px;font-size:13px;margin-bottom:14px}
.kv dt{color:var(--c-t3);font-size:12px;padding-top:1.5px}
.kv dd{color:var(--c-t1);word-break:break-word;white-space:pre-wrap;line-height:1.6}
.sec-t{font-size:12px;font-weight:650;color:var(--c-pri3);letter-spacing:.4px;margin:18px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--c-border);display:flex;align-items:center;gap:6px}
.sec-t::before{content:"";width:3px;height:12px;border-radius:2px;background:var(--c-pri)}
.note-b{background:var(--c-warn-soft);border-left:3px solid var(--c-warn);border-radius:0 var(--r-s) var(--r-s) 0;padding:9px 12px;font-size:12.5px;color:#7a4a00;white-space:pre-wrap;margin-bottom:12px;line-height:1.65}
.overlay{position:fixed;inset:0;background:rgba(15,35,25,.32);opacity:0;pointer-events:none;transition:.22s;z-index:49;backdrop-filter:blur(1.5px)}
.overlay.open{opacity:1;pointer-events:auto}
#ovSide{z-index:64}

/* 模态 */
.modal{position:fixed;inset:0;background:rgba(15,35,25,.4);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;backdrop-filter:blur(2px)}
.modal.open{display:flex}
.mbox{background:#fff;border-radius:var(--r-l);max-width:780px;width:100%;max-height:84vh;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(10,30,20,.28)}
.mhead{padding:15px 18px;border-bottom:1px solid var(--c-border);display:flex;align-items:center;justify-content:space-between}
.mhead h3{font-size:15px;font-weight:650}
.mbody{padding:16px 20px;overflow-y:auto;font-size:13px}
.mbody h4{font-size:13px;font-weight:650;color:var(--c-pri3);margin:16px 0 6px}
.mbody h4:first-child{margin-top:0}
.mbody ul{margin:0 0 8px 18px}
.mbody li{margin-bottom:5px;line-height:1.65}
.mbody p{margin-bottom:8px;color:var(--c-t2);line-height:1.7}
.mfoot{padding:12px 18px;border-top:1px solid var(--c-border);display:flex;gap:8px;justify-content:flex-end}

.pager{display:flex;gap:6px;justify-content:center;align-items:center;margin-top:16px;font-size:13px;color:var(--c-t2)}
.pg{padding:6px 12px;border:1px solid var(--c-border-s);border-radius:8px;background:#fff;font-size:13px;transition:.15s}
.pg:hover{border-color:var(--c-pri2);color:var(--c-pri);box-shadow:0 1px 4px rgba(31,138,76,.12)}
.pg.on{background:var(--c-pri);border-color:var(--c-pri);color:#fff;box-shadow:0 2px 6px rgba(31,138,76,.25)}
.pg[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.pg-info{font-variant-numeric:tabular-nums;color:var(--c-t3)}

/* 移动端菜单开关 */
.mtoggle{display:none;position:fixed;left:12px;bottom:16px;z-index:70;width:48px;height:48px;border-radius:50%;
  background:linear-gradient(135deg,var(--c-pri2),var(--c-pri));color:#fff;box-shadow:0 6px 18px rgba(31,138,76,.42);font-size:20px;align-items:center;justify-content:center}
.mtoggle:active{transform:scale(.94)}
body.dr-open .mtoggle{display:none!important}
.mclose{display:none}

@media(max-width:900px){
  .layout{flex-direction:column}
  aside{width:100%;height:auto;position:fixed;left:0;top:0;bottom:0;z-index:65;overflow-y:auto;
    transform:translateX(-100%);transition:transform .24s ease;box-shadow:4px 0 20px rgba(0,0,0,.14)}
  aside.open{transform:translateX(0)}
  .mtoggle{display:flex}
  .mclose{display:block;position:absolute;right:10px;top:14px;font-size:18px;color:var(--c-t3);padding:3px 8px;border-radius:6px}
  .mclose:hover{background:var(--c-bg);color:var(--c-t1)}
  .nav-sub{padding-left:14px}
  .wrap{padding:12px 12px 70px}
  header.top{padding:14px 12px 14px 70px}
  .c-basis{max-width:150px}
  th,td{padding:7px 8px;font-size:12.5px}
  .kv{grid-template-columns:90px 1fr}
  .drawer{width:100%}
  .frow{gap:7px}
  .searchbox{min-width:100%}
  select.sel{flex:1;min-width:44%;max-width:none}
  .statbar{gap:6px}
  .res-actions{margin-left:0;width:100%}
  .tw{border-radius:var(--r-s)}
  .tscroll{max-height:none;overflow-x:auto}
  table{min-width:640px}
}
</style>
</head>
<body>
<div class="layout">
  <aside id="side">
    <button class="mclose" id="mCloseSide">✕</button>
    <div class="brand">
      <div class="brand-logo">药</div>
      <div>
        <div class="brand-title">药食同源查询</div>
        <div class="brand-sub">原料合规判定工具</div>
      </div>
    </div>
    <a class="back" href="./toolbox.html">← 返回工具箱</a>
    <div class="ctitle">板块</div>
    <div class="nav" id="grpNav"></div>
    <div class="ctitle">当前板块内的表</div>
    <div class="nav" id="subNav"></div>
  </aside>

  <main>
    <header class="top">
      <h1>药食同源及食品原料完整清单查询</h1>
      <div class="sub">数据源：药食同源及食品原料完整清单（2026-11-16 回源补漏版）· 全部结论均可回溯原表行</div>
      <div class="hstats" id="hstats"></div>
    </header>

    <div class="wrap">
      <div class="filters">
        <div class="frow">
          <div class="searchbox">
            <span class="si">🔍</span>
            <input id="q" type="search" placeholder="搜索名称 / 依据 / 限定说明…" autocomplete="off">

号","DBS32/ 009-2016 食品安全地方标准耳叶牛皮消制品"],["内容摘要","Cynanchum auriculatum royle ex wight 1、耳叶牛皮消：系萝藦科鹅绒藤属植物耳叶牛皮消的根块。 2、滨海白首乌：系原产于滨海的萝藦科鹅绒藤属植物耳叶牛皮消的根块，其产地范围应符合DB32/T 2032《地理标志产品滨海白首乌》的要求。 3、耳叶牛皮消片（粒）：以耳叶牛皮消为原料，经清洗、挑选、去皮、切片、烘干、粉碎或不粉碎等工艺而制成的作为代用茶饮用的食品。 4、耳叶牛皮消粉：以耳叶牛皮消为原料，经清洗、去皮、磨碎、除渣、沉淀、过滤、干燥、包装等工艺，但不经过任何化学方法处理，也不改变其淀粉内在的物理和化学特性，而制成的食品。 5、原料产地范围符合上述定义要求的产品及其制品，可以称为“滨海白首乌”、“滨海白首乌片（粒）”、“滨海白首乌粉”，其配料表的原料名称可以为“耳叶牛皮消”或“滨海白首乌（耳叶牛皮消）”"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","滨海白首乌","DB32/T 2032-2012 地理标志产品滨海白首乌","原文基线记录","","现行",["地方标准","江苏省"],"原文基线记录","'17地方标准'!A59",59,[["物质大类","滨海白首乌"],["地区","江苏省"],["依据/标准号","DB32/T 2032-2012 地理标志产品滨海白首乌"],["内容摘要","cynanchum auriculatum royle ex wight 1、滨海白首乌：以原产于滨海白首乌地理标志产品保护产地范围内的鲜白首乌块根（原植物为萝藦科耳叶牛皮消种）为原料，经清洗、挑选、去皮、切片（粉碎）、烘干等工艺加工而制成的滨海白首乌，包括滨海白首乌片、滨海白首乌粉和滨海白首乌干条。 2、滨海白首乌块根：原产于滨海白首乌地理标志产品保护产地范围内的鲜白首乌（原植物为萝藦科耳叶牛皮消种）。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","甜茶","DBS45/ 060-2019 食品安全地方标准甜茶","原文基线记录","","现行",["地方标准","广西壮族自治区"],"原文基线记录","'17地方标准'!A60",60,[["物质大类","甜茶"],["地区","广西壮族自治区"],["依据/标准号","DBS45/ 060-2019 食品安全地方标准甜茶"],["内容摘要","Rubus chingii var.Suavissimus (S.Lee)L.T.Lu 1、甜茶：蔷薇科植物甜叶悬钩子的干燥叶。 2、标签应标注“每日推荐食用量为5g甜茶干品。婴幼儿、孕妇、乳母不宜食用”。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","珠兰","DB34/T 1355-2018 珠兰花茶","原文基线记录","","现行",["地方标准","安徽省"],"原文基线记录","'17地方标准'!A61",61,[["物质大类","珠兰"],["地区","安徽省"],["依据/标准号","DB34/T 1355-2018 珠兰花茶"],["内容摘要","Chloranthus spicatus (Thunb.) Makino 1、珠兰：又称金粟兰、珍珠兰、鸡爪兰、鱼子兰及茶兰。属金粟兰科金粟兰属。 2、珠兰花茶：将适宜窨制花茶的毛茶加工制成茶坯，配以珠兰鲜花，通过特定窨花工艺精制而成的，具有“兰香幽雅，浓而不烈，清而不淡”香气特点的花茶。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","金花茶花","DBS45/ 069-2020 食品安全地方标准金花茶花","原文基线记录","","现行",["地方标准","广西壮族自治区"],"原文基线记录","'17地方标准'!A62",62,[["物质大类","金花茶花"],["地区","广西壮族自治区"],["依据/标准号","DBS45/ 069-2020 食品安全地方标准金花茶花"],["内容摘要","Camelliachrysantha(Hu)Tuyama 1、以人工种植的山茶科、山茶属植物金花茶[Camelliachrysantha(Hu)Tuyama）]的新鲜花朵为原料，经清洗或不清洗、拣选、分切或不分切、杀青或不杀青、干燥等工艺加工制成的金花茶花产品。 2、应标注“婴幼儿、孕妇、乳母不宜食用”"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","亚麻籽","DBS15/ 014-20 "],["依据/标准号","DBS14/ 003-2025 食品安全地方标准毛建草"],["内容摘要","1、毛建草：唇形科青兰属毛建草(别名: 毛尖、岩青兰)，拉丁学名: Dracocephalum rupestre Hance。 2、鲜毛建草：从毛建草植株上采收毛建草叶(可带茎)，经挑选、去杂后的鲜毛建草。 3、每日推荐食用量：鲜毛建草推荐食用量≤20克/天。 4、不适宜人群：婴幼儿、孕妇及哺乳期妇女不宜食用。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","毛建草代用茶","DBS14/ 004-2025 食品安全地方标准毛建草代用茶","原文基线记录","","现行",["地方标准","山西省"],"原文基线记录","'17地方标准'!A100",100,[["物质大类","毛建草"],["具体名称","毛建草代用茶"],["地区","山西省"],["依据/标准号","DBS14/ 004-2025 食品安全地方标准毛建草代用茶"],["内容摘要","1、毛建草代用茶：以鲜毛建草为原料，经加工制作、采用类似茶叶冲泡(浸泡或煮)的方式， 供人们饮用的产品。 2、每日推荐食用量：毛建草代用茶推荐食用量≤5克/天。 3、不适宜人群：婴幼儿、孕妇及哺乳期妇女不宜食用。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","杜仲叶","DBS61/ 0024-2022 食品安全地方标准略阳杜仲叶","原文基线记录","","现行",["地方标准","陕西省"],"原文基线记录","'17地方标准'!A101",101,[["物质大类","杜仲叶"],["地区","陕西省"],["依据/标准号","DBS61/ 0024-2022 食品安全地方标准略阳杜仲叶"],["内容摘要","1、略阳杜仲叶：陕西省略阳县行政区域及其周边相邻地区杜仲科杜仲属杜仲（Eucommia ulmoides Oliv.）的叶，在采收期适时采收的鲜叶，经过挑选、清洗、杀青、揉捻或不揉捻、 干燥等工艺而制成的食品原料。 2、每日最大食用量不超过 4.2 克，孕妇、哺乳期妇女及婴幼儿不宜食用。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","葛粉","DBS42/ 006-2022 食品安全地方标准葛粉","原文基线记录","","现行",["地方标准","湖北省"],"原文基线记录","'17地方标准'!A102",102,[["物质大类","葛粉"],["地区","湖北省"],["依据/标准号","DBS42/ 006-2022 食品安全地方标准葛粉"],["内容摘要","1、本标准适用于以粉葛或葛根（或称野葛）（属种）为原料，采用清洗、粉碎、过滤、除杂、沉淀、干燥等食品加工工艺制成，需经过沸水熟化之后食用的葛粉。 2、粉葛：为豆科植物甘葛藤Pueraria thomsonii Benth.的根部。 3、葛根：为豆科植物野葛Pueraria lobata (Willd.) Ohwi的根部，习称野葛。 4、葛粉：以鲜或干的粉葛或葛根（或称野葛）为原料，采用清洗、粉碎、过滤、除杂、沉淀、干燥等食品加工工艺，不添加任何其他食品原料和食品添加剂等包装而成的食品，且需经沸水熟化之后食用。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","鸡蛋花","DBS44/ 018-2022 食品安全地方标准鸡蛋花","原文基线记录","","现行",["地方标准","广东省"],"原文基线记录","'17地方标准'!A103",103,[["物质大类","鸡蛋花"],["地区","广东省"],["依据/标准号","DBS44/ 018-2022 食品安全地方标准鸡蛋花"],["内容摘要","1、本标准适用于作为凉茶饮料原料使用的鸡蛋花。 2、鸡蛋花：夹竹桃科植物鸡蛋花（Plumeria rubra L.cv.Acutifolia）的干燥花朵。花盛开时采收，净选，干燥。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","广山楂叶","DBS45/ 073-2021 食品安全地方标准广山楂叶","原文基线记录","","现行",["地方标准","广西壮族自治区"],"原文基线记录","'17地方标准'!A104",104,[["物质大类","广山楂叶"],["地区","广西壮族自治区"],["依据/标准号","DBS45/ 073-2021 食品安全地方标准广山楂叶"],["内容摘要","1、广山楂：蔷薇科(Rosaceae)苹果属( 025 食品安全地方标准栀子花"],["内容摘要","区域联合标准 1、栀子花鲜品：去除花柱的茜草科栀子属栀子（Gardenia jasminoides Ellis）开放的鲜花。 2、栀子花干品：以栀子花鲜品为原料，经挑选、去杂、干燥、去花柱等工艺制成的产品。 3、食用前应去除花柱。婴幼儿、孕妇、哺乳期妇女及对花粉等有过敏史者不宜食用。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","栀子花","DBS35/ 011-2025 食品安全地方标准栀子花","原文基线记录","","现行",["地方标准","福建省"],"原文基线记录","'17地方标准'!A133",133,[["物质大类","栀子花"],["地区","福建省"],["依据/标准号","DBS35/ 011-2025 食品安全地方标准栀子花"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","化橘红胎","DBS44/ 021-2023 食品安全地方标准化橘红胎","原文基线记录","","现行",["地方标准","广东省"],"原文基线记录","'17地方标准'!A134",134,[["物质大类","化橘红胎"],["地区","广东省"],["依据/标准号","DBS44/ 021-2023 食品安全地方标准化橘红胎"],["内容摘要","1、化橘红胎：为芸香科植物化州柚 Citrus grandis‘Tomentosa’的干燥幼果，将果径为 4~8 cm 的化州柚鲜果，经清洗、杀青、烘干、成型或不成型、切片或不切片、包装、贮存等步骤加工而成的产品。 2、标签中应标示“孕妇、哺乳期妇女及婴幼儿等特殊人群请在医生指导下食用”。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","偃松籽","DBS23/ 024-2023 食品安全地方标准偃松籽","原文基线记录","","现行",["地方标准","黑龙江省"],"原文基线记录","'17地方标准'!A135",135,[["物质大类","偃松籽"],["地区","黑龙江省"],["依据/标准号","DBS23/ 024-2023 食品安全地方标准偃松籽"],["内容摘要","1、偃松籽：为松科 Pinaceae 松属 Pinus 偃松 Pinus pumila (Pall.)Regel 的生干种子。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","亮叶杨桐","DBS45/ 082-2024 食品安全地方标准石崖茶","原文基线记录","","现行",["地方标准","广西壮族自治区"],"原文基线记录","'17地方标准'!A136",136,[["物质大类","亮叶杨桐"],["地区","广西壮族自治区"],["依据/标准号","DBS45/ 082-2024 食品安全地方标准石崖茶"],["内容摘要","1、石崖茶：以新鲜的亮叶杨桐Adinandra nitida Merr. ex H.L.Li嫩叶为原料，参考绿茶加工方式，经分拣、去杂质、萎凋、杀青、干燥等工艺制成的供直接饮用或食用，及作食品加工原料的产品。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","蓝靛果","DBS22/ 038-2024 食品安全地方标准蓝靛果","原文基线记录","","现行",["地方标准","吉林省"],"原文基线记录","'17地方标准'!A137",137,[["物质大类","蓝靛果"],["地区","吉林省"],["依据/标准号","DBS22/ 038-2024 食品安全地方标准蓝靛果"],["内容摘要","蓝靛果 haskap berries 别名黑瞎子果、山茄子果，为忍冬科（Caprifoliaceae），忍冬属（Lonicera），蓝果忍冬 （Lonicera caerulea）及其变种和栽培品种的浆果果实。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","金线莲","DBS53/ 038-2024 食品安全地方标准金线莲","原文基线记录","","现行",["地方标准","云南省"],"原文基线记录","'17地方标准'!A138",138,[["物质大类","金线莲"],["地区","云南省"],["依据/标准号","DBS53/ 038-2024 食品安全地方标准金线莲"],["内容摘要","金线莲 1、兰科开唇兰属花叶开唇兰﹝Anoectochilus roxburghii (Wall.) Lindl﹞植物的全株，也称金线兰，包括金线莲鲜品和金线莲干品。 2、每日推荐食用量1.5 g（以金线莲干品计），婴幼儿、孕妇及乳母不宜食用。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","毛豹皮樟红果黄肉楠","DBS50/ 033-2024 食品安全地方标准老鹰茶","原文基线记录","","现行",["地方标准","重庆市"],"原文基线记录","'17地方标准'!A139",139,[["物质大类","毛豹皮樟红果黄肉楠"],["地区","重庆市"],["依据/标准号","DBS50/ 033-2024 食品安全地方标准老鹰茶"],["内容摘要","老鹰茶以毛豹皮樟Litsea coreana Levl. var. lanuginosa (Migo) Yang et P. H. Huang和（或）红果黄肉楠Actinodaphne cupularis (Hemsl.) Gamble的叶、芽、茎、梗为原料，经分级去杂、萎凋或摊晾、杀青、常温发酵或不发酵、揉捻、干燥等加工而成的预包装老鹰茶。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","花椒叶","DBS61/ 0035-2024 食品安全地方标准韩城花椒叶","原文基线记录","","现行",["地方标准","陕西省"],"原文基线记录","'17地方标准'!A140",140,[["物质大类","花椒叶"],["地区","陕西省"],["依据/标准号","DBS61/ 0035-2024 食品安全地方标准韩城花椒叶"],["内容摘要","1、花椒叶为芸香科植物花椒（Zanthoxylum bungeanum Maxim.）的叶片。 2、韩城花椒叶为韩城市及周边地区种植花椒的鲜叶，经适时采收、挑选、清洗、干燥制成。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","神秘果","DBS44/ 022-2024 食品安全地方标准神秘果","原文基线记录","","现行",["地方标准","广东省"],"原文基线记录","'17地方标准'!A141",141,[["物质大类","神秘果"],["地区","广东省"],["依据/标准号","DBS44/ 022-2024 食品安全地方标准神秘果"],["内容摘要","Synsepalum dulcificum (Schumach.& Thonn.) Daniell 1、神秘果为山榄科神秘果属，浆果果实。 2、神秘果用于调整食品的滋味，每日食用量不超过 30 克（以鲜果计）；18 岁以下人群、 孕妇、乳母不宜食用。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","酸枣叶","DBS13/ 020-2024 食品安全地方标准干制酸枣叶","原文基线记录","","现行",["地方标准","河北省"],"原文基线记录","'17地方标准'!A142",142,[["物质大类","酸枣叶"],["地区","河北省"],["依据/标准号","DBS13/ 020-2024 食品安全地方标准干制酸枣叶"],["内容摘要","1、酸枣叶为鼠李科植物酸枣 Ziziphus jujuba Mill. var. spinosa (Bunge) Hu ex H. F. Chou 的新鲜叶。 2、本标准适用于以酸枣的叶为原料，经干燥而制成的干制酸枣叶，仅适用于食品加工原料，可做饮料、代用茶。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","老山芹","DBS23/ 026-2024 食品安全地方标准老山芹","原文基线记录","","现行",["地方标准","黑龙江省"],"原文基线记录","'17地方标准'!A143",143,[["物质大类","老山芹"],["地区","黑龙江省"],["依据/标准号","DBS23/ 026-2024 食品安全地方标准老山芹"],["内容摘要","Heracleum dissectum Ledeb. 1、老山芹：学名兴安独活，伞形科 Apiaceae、独活属 Heracleum 多年生草本植物。 2、不适宜人群：婴幼儿、孕妇及哺乳期妇女不宜食用"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","桦褐孔菌","DBS23/ 027-2024 食品安全地方标准桦褐孔菌","原文基线记录","","现行",["地方标准","黑龙江省"],"原文基线记录","'17地方标准'!A144",144,[["物质大类","桦褐孔菌"],["地区","黑龙江省"],["依据/标准号","DBS23/ 027-2024 食品安全地方标准桦褐孔菌"],["内容摘要","Inonotus obliquus (Ach.ex Pers.) Pilát 1、桦褐孔菌：为锈革孔菌科褐卧孔菌属桦褐孔菌的干燥菌核。别名斜生纤孔菌、白桦茸、 桦树茸。 2、推荐食用量≤6 克/天。 3、不适宜人群：孕妇、哺乳期妇女、婴幼儿及有过敏体质者等特殊人群不宜食用。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","人参","DBS22/ 024-2024 食品安全地方标准食品原料用人参","原文基线记录","","现行",["地方标准","吉林省"],"原文基线记录","'17地方标准'!A145",145,[["物质大类","人参"],["地区","吉林省"],["依据/标准号","DBS22/ 024-2024 食品安全地方标准食品原料用人参"],["内容摘要","Panax ginseng C.A.Meyer 1、食品原料用人参：人工种植 5 年及 5 年以下、五加科人参属植物人参的根及根茎。 2、鲜园参：从土壤中采挖出来，未经加工的食品原料用人参。 3、生晒参：以鲜园参为原料，经刷洗、晒干或烘干制成的食品原料用人参。 4、红参：以鲜园参为原料，经过刷洗、蒸制、干燥制成的食品原料用人参。 5、每日限制食用量和不适宜人群：应符合卫生部公告 2012 年第 17 号的规定。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","桑黄","DBS22/039-2024 食品安全地方标准 桑黄（含2026年修改单）","现行；优先使用含修改单文本","2026-07-20","现行",["地方标准","吉林省"],"现行；优先使用含修改单文本","'17地方标准'!A146",146,[["物质大类","桑黄"],["地区","吉林省"],["依据/标准号","DBS22/039-2024 食品安全地方标准 桑黄（含2026年修改单）"],["内容摘要","适用于吉林省相应桑黄产品；2026-07-20已发布修改单，种属、食用量及限制以原标准结合修改单为准。"],["发布日期","2026-07-20"],["状态","现行；优先使用含修改单文本"],["来源URL","待补官方原文"]],"none",[],false,[]],["17地方标准","桑黄","DBS37/ 005-2026 食品安全地方标准桑黄","现行；已核对官方标准解读","2026-05-06","现行",["地方标准","山东省"],"现行；已核对官方标准解读","'17地方标准'!A147",147,[["物质大类","桑黄"],["地区","山东省"],["依据/标准号","DBS37/ 005-2026 食品安全地方标准桑黄"],["内容摘要","1、桑黄：为担子菌门（Basidiomycota）、蘑菇纲（Agaricomycetes）、锈革菌目 （Hymenochaetales）、锈革菌科（Hymenochaetaceae）、纤孔菌属（lnonotus）、粗毛纤孔菌（Inonotus hispidus）的子实体。 2、桑黄干制品：由粗毛纤孔菌的子实体经除杂、切片（或整体）、干制（阴干、晾干、晒干或烘干、低温干燥）、和（或）粉碎等加工方式制成的干制品。 3、推荐食用量≤5克/天。 4、以桑黄做食品原料，成品折算日摄入总量不应超过“推荐食用量”。 5、含桑黄原料的预包装食品产品标签应标示“婴幼儿、孕妇及乳母不宜食用”“桑黄推荐食用量≤5克/天”等警示语。"],["发布日期","2026-05-06"],["实施日期","2026-06-06"],["状态","现行；已核对官方标准解读"],["来源URL","待补官方原文"]],"none",[],false,[]],["17地方标准","西归","DBS53/ 040-2025 食品安全地方标准西归","原文基线记录","","现行",["地方标准","云南省"],"原文基线记录","'17地方标准'!A148",148,[["物质大类","西归"],["地区","云南省"],["依据/标准号","DBS53/ 040-2025 食品安全地方标准西归"],["内容摘要","1、西归：伞形科植物西藏凹乳芹（Vicatia thibetica de Boiss.）的根。 2、西归每日推荐食用量为2 g（以干品计），婴幼儿、孕妇、乳母不宜食用。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","金花茶叶","DBS45/ 033-2025 食品安全地方标准金花茶叶茶","原文基线记录","","现行",["地方标准","广西壮族自治区"],"原文基线记录","'17地方标准'!A149",149,[["物质大类","金花茶叶"],["地区","广西壮族自治区"],["依据/标准号","DBS45/ 033-2025 食品安全地方标准金花茶叶茶"],["内容摘要","1、金花茶：山茶科山茶属植物，中文名金花茶，拉丁名：Camellia chrysantha(Hu) Tuyama。 2、金花茶叶茶：以人工种植的山茶科山茶属植物金花茶[Camellia chrysantha(Hu) Tuyama）]的新鲜叶为主要原料，经清洗或不清洗、拣选、分切或不分切、杀青或不杀青、 干燥、添加（或不添加）金花茶花等其他原辅料加工制成的金花茶产品。 3、推荐食用量建议每日食用量≤20 g。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","五月艾","DBS44/ 025-2025 食品安全地方标准五月艾","原文基线记录","","现行",["地方标准","广东省"],"原文基线记录","'17地方标准'!A150",150,[["物质大类","五月艾"],["地区","广东省"],["依据/标准号","DBS44/ 025-2025 食品安全地方标准五月艾"],["内容摘要","1、五月艾（Artemisia indica Willd.），为被子植物门、双子叶植物纲、合瓣花亚纲、桔梗目、菊科、蒿属、艾系植物。 2、五月艾干制品：新鲜五月艾经采摘后，去主茎，剪取嫩茎叶，经清洗、干燥、粉碎或不粉碎、包装等步骤生产加工制成的产品。 3、食用建议：成人五月艾食用量不超过14g/d（以鲜品计），孕妇、哺乳期妇女及婴幼儿适量少食。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","竹叶粉","DBS51/ 010-2025 食品安全地方标准竹叶粉","原文基线记录","","现行",["地方标准","四川省"],"原文基线记录","'17地方标准'!A151",151,[["物质大类","竹叶粉"],["地区","四川省"],["依据/标准号","DBS51/ 010-2025 食品安全地方标准竹叶粉"],["内容摘要","1、竹叶粉：以禾本科竹亚科植物牡竹属（Dendrocalamus Nees）的梁山慈竹 （Dendroclamus farinosus）和箭竹属（Fargesia Franch. emend. Yi）的箭竹 （Fargesia）叶片为原料，经过清洗、烫漂、护色、干燥、杀菌、超微粉碎等工艺加工制成的粉末制品。 2、标签应标明：推荐摄入量不超过 6 g/天。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","芭蕉根","DBS45/ 084-2026 食品安全地方标准芭蕉根","原文基线记录","","现行",["地方标准","广西壮族自治区"],"原文基线记录","'17地方标准'!A152",152,[["物质大类","芭蕉根"],["地区","广西壮族自治区"],["依据/标准号","DBS45/ 084-2026 食品安全地方标准芭蕉根"],["内容摘要","1、芭蕉根：芭蕉科芭蕉属芭蕉（Musa basjoo Siebold & Zucc.）的新鲜根部，作为食品加工原料的部位。 2、推荐食用量：推荐每日食用量 24g（标准人体重 60kg)。 3、不适用人群：孕妇、哺乳期妇女及婴幼儿不宜直接食用。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","罗汉参","DBS37/ 006-2026 食品安全地方标准罗汉参","原文基线记录","","现行",["地方标准","山东省"],"原文基线记录","'17地方标准'!A153",153,[["物质大类","罗汉参"],["地区","山东省"],["依据/标准号","DBS37/ 006-2026 食品安全地方标准罗汉参"],["内容摘要","1、罗汉参：又称土圞儿、土芋、地栗子、土子、土蛋、野凉薯、九连珠、土凉薯、黄皮狗圞、九牛子等，为豆科（Leguminosae）、土圞属 (Apios)、土圞儿（Apios fortunei Maxim）的块根。 2、罗汉参干制品：由土圞儿的块根经采挖、洗净、分切（或不分切）、蒸制（或不蒸制）、晒干或低温干燥、粉碎（或不粉碎）等加工方式制成的干制品。 3、罗汉参应熟制后食用。即食食品中添加的罗汉参原料应已熟制。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","黄精","DBS37/ 007-2026 食品安全地方标准黄精生产卫生规范","原文基线记录","","现行",["地方标准","山东省"],"原文基线记录","'17地方标准'!A154",154,[["物质大类","黄精"],["地区","山东省"],["依据/标准号","DBS37/ 007-2026 食品安全地方标准黄精生产卫生规范"],["内容摘要","1、黄精：百合科植物滇黄精（Polygonatum kingianum Coll.et Hemsl.）、黄精 （Polygonatum sibiricum Red.）或多花黄精（Polygonatum cyrtonema Hua）的根茎。 2、黄精制品：以黄精为主要原料，添加或不添加其他辅料，经过预处理、蒸煮、干制、整型等加工工艺制成的产品，包括黄精茶、即食黄精、酒黄精、黄精膏等。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","黄精","DBS52/ 053-2021 食品安全地方标准黄精（干制品）","原文基线记录","","现行",["地方标准","西藏自治区"],"原文基线记录","'17地方标准'!A155",155,[["物质大类","黄精"],["地区","西藏自治区"],["依据/标准号","DBS52/ 053-2021 食品安全地方标准黄精（干制品）"],["内容摘要","Polygonatum cyrtonema Hua 1、黄精（干制品）：以人工种植百合科黄精属多花黄精的根茎为原料，经去杂、净选、蒸制、分切、干燥等工艺制成，作食品或食品加工原料使用的产品。 2、黄精直接预包装销售，产品标签应标示“推荐食用量≤15克/天。 3、 预包装销售黄精及含黄精的食品产品标签应标识“婴幼儿、儿童、孕妇、乳母不宜食用” 等警示语。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","滇皂荚米","DBS53/ 041-2026 食品安全地方标准滇皂荚米","原文基线记录","","现行",["地方标准","云南省"],"原文基线记录","'17地方标准'!A156",156,[["物质大类","滇皂荚米"],["地区","云南省"],["依据/标准号","DBS53/ 041-2026 食品安全地方标准滇皂荚米"],["内容摘要","1、滇皂荚米：以人工种植滇皂荚（Gleditsia japonica var. delavayi (Franch.) L.C.Li）成熟果实为原料，去荚取种子，去除种皮、子叶，取外胚乳，经干燥等工艺制成的产品。俗称 “滇皂角米”“白籽仁”。 2、滇皂荚米每日推荐食用量为 5 g（以干品计），婴幼儿、孕妇及乳母不宜食用。"],["状态","原文基线记录"]],"none",[],false,[]],["17地方标准","蕲艾","DBS42/ 021-2026 食品安全地方标准蕲艾嫩叶食用加工卫生规范","现行","2026-02-02","现行",["地方标准","湖北省"],"现行","'17地方标准'!A157",157,[["物质大类","蕲艾"],["地区","湖北省"],["依据/标准号","DBS42/ 021-2026 食品安全地方标准蕲艾嫩叶食用加工卫生规范"],["内容摘要","1、蕲艾：产于湖北省辖区内菊科蒿属植物艾（Artemisia argyi H. Lév. & Vaniot或 Artemisia argyi Lévl. et Vant.）的栽培品种cv. qiai。 2、蕲艾嫩叶：蕲艾的嫩茎芽叶（植株顶端向下5 cm～10 cm），幼苗期或春季生长期采摘。"],["发布日期","2026-02-02"],["实施日期","2026-08-02"],["状态","现行"],["来源URL","待补官方原文"]],"none",[],false,[]],["17地方标准","灵芝","DBS52/057-2026","即将实施；新版优先","2026-06-22","未生效",["地方标准","贵州"],"即将实施；新版优先","'17地方标准'!A158",158,[["物质大类","灵芝"],["地区","贵州"],["依据/标准号","DBS52/057-2026"],["内容摘要","即将实施；替代DBS52/057-2022；2026-12-21实施，实施前仍按现行规定。"],["发布日期","2026-06-22"],["实施日期","2026-12-21"],["状态","即将实施；新版优先"],["来源URL","待补官方原文"]],"m 7号公告批准人参（5年及5年以下人工种植）为新资源食品（现称新食品原料），并对其拉丁名称、基本信息、食用量及不适宜人群等进行了明确说明。根据《中华人民共和国药典》（2020版），红参是以人参为原料，经蒸制干燥后的同源加工品。以符合上述公告要求的人参为原料加工制成的红参，可以作为食品原料使用，其食用量和不适宜人群等要求，亦应参照人参的公告执行。 来函咨询黑参能否作为普通食品原料使用，但未就黑参的原料、工艺进行说明，故无法就其可食用性做出进一步判断。 截至2025年12月5日，国家卫生健康委员会发布的新食品原料清单、按照传统既是食品又是中药材的物品清单、既是食品又是药品的物品名单中无黑参，我委未就黑参制定食品安全地方标准，亦无黑参食用安全性问题的相关文件、信息或资料。"]],"none",[],false,[["https://wsjkw.gd.gov.cn/zwgk_gsgg/content/post_4961527.html","官方来源","索引表"]]],["18地方在线答复","黑参","","","2026-02-06","答复线索",["地方在线答复","安徽卫健委"],"经检索，国务院卫生行政部门公布的新食品原料、食品添加剂新品种、食品相关产品新品种目录名单以及所适用的食品安全国家标准和既是食品又是药品的物品名单、按照传统既是食品又是中药材的物质目录名单中均未查见“黑参”。我委亦未制定“黑参”相关食品安全地","'18地方在线答复'!A10",10,[["区域","安徽卫健委"],["留言涉及物质","黑参"],["答复时间","2026.02.06"],["答复内容","经检索，国务院卫生行政部门公布的新食品原料、食品添加剂新品种、食品相关产品新品种目录名单以及所适用的食品安全国家标准和既是食品又是药品的物品名单、按照传统既是食品又是中药材的物质目录名单中均未查见“黑参”。我委亦未制定“黑参”相关食品安全地方标准。 根据《关于批准人参（人工种植）为新资源食品的公告》（卫生部公告2012年第17号）,“ 人参（人工种植）”为新食品原料。新食品原料的生产和使用应与公告内容一致。经切片、 干燥、粉碎等简单物理加工的同源加工品，未改变物质基础，安全性可以保证，也认为属于公告范畴。"]],"none",[],false,[["https://wsjkw.gd.gov.cn/zwgk_gsgg/content/post_4961527.html","官方来源","索引表"]]],["18地方在线答复","黑参","","","2026-02-06","答复线索",["地方在线答复","广东卫健委"],"国家卫生健康委2012年第17号公告批准人参（5年及5年以下人工种植）为新资源食品（现称新食品原料），并对其拉丁名称、基本信息、食用量及不适宜人群等进行了明确说明。 以符合上述公告要求的人参为原料加工制成的同源加工品，可以作为食品原料使用，","'18地方在线答复'!A11",11,[["区域","广东卫健委"],["留言涉及物质","黑参"],["答复时间","2026.02.06"],["答复内容","国家卫生健康委2012年第17号公告批准人参（5年及5年以下人工种植）为新资源食品（现称新食品原料），并对其拉丁名称、基本信息、食用量及不适宜人群等进行了明确说明。 以符合上述公告要求的人参为原料加工制成的同源加工品，可以作为食品原料使用，其食用量和不适宜人群等要求，亦应参照人参的公告执行。食品生产经营应严格按照相关法律、法规、标准及公告执行。"]],"none",[],false,[["https://wsjkw.gd.gov.cn/zwgk_gsgg/content/post_4961527.html","官方来源","索引表"]]],["18地方在线答复","黑参","","","2025-03-18","答复线索",["地方在线答复","福建卫健委"],"问：以人工种植五年及五年以下人参为原料，经多次蒸晒至黑色或深棕色所制成黑参，是否是普通食品原料呢？能否根据三新食品解读公告中对于红参属于食品原料判定依据，以此为参考判定黑参（源自五年及五年以下人工种植人参）同样是属于普通食品原料。 答：您好","'18地方在线答复'!A12",12,[["区域","福建卫健委"],["留言涉及物质","黑参"],["答复时间","2025.03.18"],["答复内容","问：以人工种植五年及五年以下人参为原料，经多次蒸晒至黑色或深棕色所制成黑参，是否是普通食品原料呢？能否根据三新食品解读公告中对于红参属于食品原料判定依据，以此为参考判定黑参（源自五年及五年以下人工种植人参）同样是属于普通食品原料。 答：您好，《新食品原料安全性审查 死亡。因此，对于这类植物，必须严格限制其除药用以外的商业用途。同时， 在日常生活中，人们也应当格外留意，避免误食，以确保自身安全。"]],"none",[],false,[]],["18地方在线答复","蟠桃籽","","","2025-04-28","答复线索",["地方在线答复","湖南卫健委"],"问：网上流传一张国家卫生计生委司（局）便函既“国卫食品评便函（2014）148号”“国家卫生计生委食品司关于蔬菜、水果种子有关问题的复函”该函内容主要包括：“蔬菜，水果种子为传统可食用部分，且未经提统、浓缩的，可以作为普通食品。除此之外的，","'18地方在线答复'!A53",53,[["区域","湖南卫健委"],["留言涉及物质","蟠桃籽"],["答复时间","2025.04.28"],["答复内容","问：网上流传一张国家卫生计生委司（局）便函既“国卫食品评便函（2014）148号”“国家卫生计生委食品司关于蔬菜、水果种子有关问题的复函”该函内容主要包括：“蔬菜，水果种子为传统可食用部分，且未经提统、浓缩的，可以作为普通食品。除此之外的，如需开发用于普通食品，应当按照《新食品原料安全性审查管理办法》相关规定进行安全评估并申报。”现信访人提出信访咨询，该函说水果种子，其中蟠桃籽是蟠桃的种子，另外药食同源目录中的桃仁跟蟠桃籽是否一样？请求蟠桃籽是否可依据该文件添加到食品中。蟠桃籽是不是药食同源？请贵委公开该函关于蟠桃籽是否可以添加到食品中的部门内容。 答：您好您的咨询，经研究，现回复如下： 一、关于“药食同源目录中的桃仁跟蟠桃籽是否一样”的咨询。 《中华人民共和国药典》规定“桃仁为蔷薇科植物桃Prunus persica（L.）Batsch或山桃 Prunus davidiana（Carr.）Franch.的干燥成熟种子。果实成熟后采收，除去果肉和核壳， 取出种子，晒干”。《中华人民共和国药典》由国家药典委员会编，桃仁跟蟠桃籽是否一样，请咨询国家药典委员会。 二、关于“蟠桃籽是否可依据该文件添加到食品中”的咨询。 经检索，目前未查询到国家卫生健康委关于“蟠桃籽”可作为食品原料使用的相关文件。《国家卫生计生委政务公开办关于新食品原料、普通食品和保健食品有关问题的说明》对新食品原料、普通食品和保健食品问题已有较详细说明，该说明已在国家卫生健康委网站 （http://www.nhc.gov.cn/sps/s3586/201404/32830cde058b413e87b82119caf89c3f.s html）公布。 三、关于“蟠桃籽是不是药食同源” 的咨询。 经检索，目前未查询到国家卫生健康委将“蟠桃籽”纳入按照传统既是食品又是中药材的物质目录。 四、关于“请贵委公开该函关于蟠桃籽是否可以添加到食品中的部门内容”的咨询。 目前，我委无蟠桃籽可以添加到食品中的相关文件。"]],"none",[],false,[]],["18地方在线答复","酒黄精","","","2025-04-30","答复线索",["地方在线答复","广东卫健委"],"根据《卫生部关于进一步规范保健食品原料管理的通知》（卫法监发[2002]51号），黄精已纳入《既是食品又是药品的物品名单》，《中国药典》（2020版）收录的“黄精”项下包括了酒黄精，可作为普通食品原料。","'18地方在线答复'!A54",54,[["区域","广东卫健委"],["留言涉及物质","酒黄精"],["答复时间","2025.04.30"],["答复内容","根据《卫生部关于进一步规范保健食品原料管理的通知》（卫法监发[2002]51号），黄精已纳入《既是食品又是药品的物品名单》，《中国药典》（2020版）收录的“黄精”项下包括了酒黄精，可作为普通食品原料。"]],"none",[],false,[]],["18地方在线答复","桃金娘","","","2025-04-29","答复线索",["地方在线答复","福建卫健委"],"经查询，福建省食品安全地方标准中没有“桃金娘”相关标准。《新食品原料安全性审查管理办法》第五条规定，国家卫生计生委负责新食品原料安全性评估材料的审查和许可工作。 有关桃金娘果如何申请为普通食品原料问题，建议咨询国家卫生健康委员会，确保相关答","'18地方在线答复'!A55",55,[["区域","福建卫健委"],["留言涉及物质","桃金娘"],["答复时间","2025.04.29"],["答复内容","经查询，福建省食品安全地方标准中没有“桃金娘”相关标准。《新食品原料安全性审查管理办法》第五条规定，国家卫生计生委负责新食品原料安全性评估材料的审查和许可工作。 有关桃金娘果如何申请为普通食品原料问题，建议咨询国家卫生健康委员会，确保相关答复的政策性、专 ","行内链接"]]],["26旧版记录","天麻","DBS52/ 060-2022 食品安全地方标准天麻","","","已替代",["溯源与维护"],"贵州天麻2026版优先","'26旧版记录'!A24",24,[["原工作表","17地方标准"],["原行号","96"],["名称","天麻"],["原依据","DBS52/ 060-2022 食品安全地方标准天麻"],["合并/替换原因","贵州天麻2026版优先"],["原记录内容","92；\n天麻；\n贵州省；\nDBS52/ 060-2022 食品安全地方标准天麻；\nGastrodia elata B1. 1、人工种植兰科植物天麻的新鲜块茎。经除杂、清洁、蒸制、分切（或不分切）、干制 （晒干、烘干等）等工序制成的干燥块茎或切片。 2、天麻推荐食用量≤10 克/天。 3、以天麻做食品原料，按成品折算日摄入总量不应超过“推荐食用量”。 4、含天麻的食品产品标签应标示“婴幼儿、孕妇及乳母不宜食用”警示语。 5、天麻做食品原料仅适用按传统生产工艺或食用习惯生产加工，不应使用炮制、浓缩、分离、纯化、萃取等强调产品药品属性的工艺。 6、天麻做原料生产相关食品，其标签、说明书、广告、宣传信息等不应含有虚假内容，不应涉及疾病预防、治疗和保健功能。；\n原文基线记录；\n67"],["关联来源","待补官方原文"]],"none",[],false,[]],["26旧版记录","竹叶粉","DBS51/ 010-2022 食品安全地方标准竹叶粉","","","已替代",["溯源与维护"],"竹叶粉2025版优先","'26旧版记录'!A25",25,[["原工作表","17地方标准"],["原行号","103"],["名称","竹叶粉"],["原依据","DBS51/ 010-2022 食品安全地方标准竹叶粉"],["合并/替换原因","竹叶粉2025版优先"],["原记录内容","99；\n竹叶粉；\n四川省；\nDBS51/ 010-2022 食品安全地方标准竹叶粉；\n1、竹叶粉：以禾本科竹亚科植物牡竹属（Dendrocalamus Nees）的梁山慈竹 （Dendroclamus farinosus）和箭竹属（Fαrgesiα Franch. emend. Yi）的箭竹（Fαrgesiα） 叶片为原料，经过清洗、烫漂、护色、干燥、杀菌、超微粉碎等工艺加工制成的粉末制品。 2、标签应标明：推荐摄入量不超过 6 g/天。婴幼儿、孕妇及乳母不建议食用。；\n原文基线记录；\n68"],["关联来源","102"]],"none",[],false,[]],["26旧版记录","桂花","DBS42/ 014-2021 食品安全地方标准糖桂花","","","已替代",["溯源与维护"],"糖桂花调味品2022版优先","'26旧版记录'!A26",26,[["原工作表","17地方标准"],["原行号","71"],["名称","桂花"],["原依据","DBS42/ 014-2021 食品安全地方标准糖桂花"],["合并/替换原因","糖桂花调味品2022版优先"],["原记录内容","67；\n桂花；\n糖桂花；\n湖北省；\nDBS42/ 014-2021 食品安全地方标准糖桂花；\n定义中：糖桂花是指鲜桂花（Osmanthus fragrans）经筛选、盐(糖)渍等工艺处理后与食糖和（或）蜂蜜、糖浆混合或熬制，添加或不添加其他辅料，制成的食品。；\n原文基线记录；\n65"],["关联来源","102"]],"none",[],false,[]],["26旧版记录","星油藤茎叶","DBS45/ 083-2024 食品安全地方标准星油藤茎叶","","","已替代",["溯源与维护"],"完全重复记录合并","'26旧版记录'!A27",27,[["原工作表","17地方标准"],["原行号","146"],["名称","星油藤茎叶"],["原依据","DBS45/ 083-2024 食品安全地方标准星油藤茎叶"],["合并/替换原因","完全重复记录合并"],["原记录内容","142；\n星油藤茎叶；\n广西壮族自治区；\nDBS45/ 083-2024 食品安全地方标准星油藤茎叶；\n1、星油藤为大戟科（Euphorbiaceae）星油藤属（Plukenetia L.)植物星油藤（Plukenetia volubilis L.），又名美藤果、南美油藤、印加花生、印加果、星油果。 2、推荐食用量：建议每日食用量≤10g（以干基计） 3、不适用人群：孕妇、哺乳期妇女及婴幼儿不宜直接食用，直接食用的产品标签、说明书中应当标注不适用人群。；\n原文基线记录；\n <script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('DATA').textContent);
const M = DATA.meta, ROWS = DATA.rows;

// 列索引
const K={SHEET:0,NAME:1,BASIS:2,CAT:3,DATE:4,STATUS:5,TAGS:6,NOTE:7,LOC:8,ROW:9,FIELDS:10,RISK:11,ALIAS:12,BATCH:13,LINKS:14};

const S = {q:'', tag:'', region:'', sheet:'', group:'', statuses:new Set(), sort:'default', page:1, per:60, openIdx:-1};

// ---------- 索引预处理 ----------
// 检索文本只含【字段值】，不含字段名——否则搜"依据""备注"会全表命中
// 批次共通注记已在数据层剥离（fields 已裁剪），此处直接用
const ITEMS = ROWS.map((r,i)=>({
  i, sheet:r[K.SHEET], name:r[K.NAME], basis:r[K.BASIS], date:r[K.DATE],
  status:r[K.STATUS], tags:r[K.TAGS], note:r[K.NOTE], loc:r[K.LOC], row:r[K.ROW],
  fields:r[K.FIELDS], risk:r[K.RISK], aliases:r[K.ALIAS]||[], links:r[K.LINKS]||[],
  hay: (r[K.NAME]+' '+r[K.BASIS]+' '+r[K.CAT]+' '+r[K.DATE]+' '+r[K.TAGS].join(' ')+' '+r[K.NOTE]+' '+
        r[K.FIELDS].map(f=>f[1]).join(' ')+' '+(r[K.ALIAS]||[]).join(' ')).toLowerCase()
}));

// 通配符 -> 正则（Excel 语义）
function wild2re(q){
  let re='', i=0;
  while(i<q.length){
    const c=q[i];
    if(c==='~' && i+1<q.length && (q[i+1]==='*'||q[i+1]==='?'||q[i+1]==='~')){ re+=q[i+1].replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); i+=2; continue; }
    if(c==='*'){ re+='.*'; i++; continue; }
    if(c==='?'){ re+='.'; i++; continue; }
    re+=c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); i++;
  }
  return re;
}
function buildMatcher(q){
  const toks = q.trim().split(/\s+/).filter(Boolean);
  if(!toks.length) return null;
  const regs = toks.map(t=>{
    if(/[*?]/.test(t)) return new RegExp(wild2re(t.toLowerCase()));
    return null;
  });
  return (hay)=>{
    for(let i=0;i<toks.length;i++){
      const t=toks[i].toLowerCase();
      if(regs[i]){ if(!regs[i].test(hay)) return false; }
      else { if(hay.indexOf(t)<0) return false; }
    }
    return true;
  };
}

// ---------- 筛选 ----------
function filtered(){
  const m = buildMatcher(S.q);
  let out = ITEMS.filter(it=>{
    if(S.group && M.groups[S.group] && M.groups[S.group].indexOf(it.sheet)<0) return false;
    if(S.sheet && it.sheet!==S.sheet) return false;
    if(S.tag && it.tags.indexOf(S.tag)<0) return false;
    if(S.region && it.tags.indexOf(S.region)<0) return false;
    if(S.statuses.size && !S.statuses.has(it.status)) return false;
    if(m && !m(it.hay)) return false;
    return true;
  });
  if(S.sort==='name') out.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));
  else if(S.sort==='date_desc') out.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  else if(S.sort==='date_asc') out.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  else if(S.sort==='sheet') out.sort((a,b)=>a.sheet.localeCompare(b.sheet,'zh-CN')||a.name.localeCompare(b.name,'zh-CN'));
  return out;
}

// ---------- 渲染 ----------
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function hl(text, toks){
  let t=esc(text);
  if(!t) return '';
  const list = toks.map(x=>x.toLowerCase()).filter(x=>x && !/[*?]/.test(x)).sort((a,b)=>b.length-a.length);
  if(!list.length) return t;
  const pat = list.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
  try{ t=t.replace(new RegExp('('+pat+')','gi'),'<mark>$1</mark>'); }catch(e){}
  return t;
}

function renderTable(rows){
  const toks=S.q.trim().split(/\s+/).filter(Boolean);
  const tb=$('tbody'); tb.innerHTML='';
  const start=(S.page-1)*S.per;
  const page=rows.slice(start,start+S.per);
  for(const it of page){
    const tr=document.createElement('tr');
    tr.dataset.idx=it.i;
    const stc=STATUS_CLS[it.status]||'p-gray';
    tr.innerHTML=
      '<td><div class="c-name">'+hl(it.name,toks)+
        (it.aliases&&it.aliases.length?'<span class="alias" title="原表别名">='+hl(it.aliases.join('、'),toks)+'</span>':'')+
        (it.links&&it.links.length?'<a class="lk" href="'+esc(it.links[0][0])+'" target="_blank" rel="noopener noreferrer" title="'+
          esc(it.links[0][1]+'（'+it.links[0][2]+'）')+'" onclick="event.stopPropagation()"><span class="lk-ico">🔗</span>官方原文'+
          (it.links.length>1?' +'+(it.links.length-1):'')+'</a>':'')+'</div>'+
        (it.note?'<div class="c-note">'+hl(it.note.slice(0,60),toks)+'</div>':'')+'</td>'+
      '<td style="font-size:12px;color:var(--c-t2)">'+esc(it.sheet)+'</td>'+
      '<td class="c-basis">'+hl(it.basis||'—',toks)+'</td>'+
      '<td><div class="c-tags">'+it.tags.slice(0,4).map(tagChip).join('')+(it.tags.length>4?'<span class="tag">+'+(it.tags.length-4)+'</span>':'')+'</div></td>'+
      '<td><span class="pill '+stc+'">'+esc(it.status)+'</span></td>'+
      '<td class="c-date">'+esc(it.date||'—')+'</td>';
    tr.onclick=()=>openDetail(it.i);
    tb.appendChild(tr);
  }
  $('empty').style.display = rows.length?'none':'block';
  $('cnt').textContent = rows.length.toLocaleString();
  const sc=[];
  if(S.group) sc.push('板块「'+S.group+'」');
  if(S.sheet) sc.push('表「'+S.sheet+'」');
  if(S.tag) sc.push('标签「'+S.tag+'」');
  $('scopeTxt').textContent = sc.length? sc.join(' · '):'';
}

function renderPager(rows){
  const tp=Math.max(1,Math.ceil(rows.length/S.per));
  if(S.page>tp) S.page=tp;
  const el=$('pager'); el.innerHTML='';
  if(tp<=1){ return; }
  const mk=(label,page,dis,on)=>{const b=document.createElement('button');b.className='pg'+(on?' on':'');b.textContent=label;if(dis)b.disabled=true;else b.onclick=()=>{S.page=page;renderTable(filtered());renderPager(rows);window.scrollTo({top:0,behavior:'smooth'});};el.appendChild(b);};
  mk('« 上一页',S.page-1,S.page<=1);
  const win=[]; let st=Math.max(1,S.page-2), en=Math.min(tp,st+4); st=Math.max(1,en-4);
  for(let p=st;p<=en;p++) win.push(p);
  if(st>1){ mk('1',1,false,S.page===1); if(st>2) el.appendChild(Object.assign(document.createElement('span'),{textContent:'…',className:'pg-info'})); }
  for(const p of win) mk(String(p),p,false,p===S.page);
  if(en<tp){ if(en<tp-1) el.appendChild(Object.assign(document.createElement('span'),{textContent:'…',className:'pg-info'})); mk(String(tp),tp,false,S.page===tp); }
  mk('下一页 »',S.page+1,S.page>=tp);
  const info=document.createElement('span');
  info.className='pg-info';
  info.textContent=' 第 '+S.page+' / '+tp+' 页';
  el.appendChild(info);
}

let CUR=[];
function render(){
  CUR=filtered();
  renderChips();
  renderTable(CUR);
  renderPager(CUR);
}

    <li>本工具是<b>检索与线索定位</b>工具，不构成合规结论。原料能否用于你的产品，必须回到原表对应行及其依据公告原文核对。</li>

    <li>原表含少量待核实事项与历史版本记录，本工具已单独标注，请优先看「可用性」列。</li>
    <li>若某条目的关键信息只存在于被剥离的表级共通注记中，请点击该行看「全部字段」，或回到原表核对。</li>
  </ul>
  <h4>快捷操作</h4>
  <ul>
    <li>空格分隔多个关键词 = 同时包含；支持 <code>*</code>、<code>?</code> 通配符（与 Excel 一致）。</li>
    <li>点击表头排序，点击任意行查看完整字段与原表定位。</li>
    <li>左侧板块树可逐层收窄范围；状态条可多选叠加筛选。</li>
  </ul>`;
  $('modal').classList.add('open');
};
$('mClose').onclick=()=>$('modal').classList.remove('open');
$('mOk').onclick=()=>$('modal').classList.remove('open');
$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open');};

// ---------- 头部统计 ----------
(function(){
  const h=$('hstats'); h.innerHTML='';
  const mains=['01食药物质','07新食品原料基线','12普通食品线索','13香辛料调味品','17地方标准','20辽宁地方目录'];
  const nMain=mains.reduce((a,s)=>a+(M.sheets[s]?M.sheets[s].n:0),0);
  const nLink=ROWS.filter(r=>(r[K.LINKS]||[]).length).length;
  [['总记录',M.total],['工作表',Object.keys(M.sheets).length],['分类标签',M.tags.length],['主体清单',nMain],['可跳转链接',nLink]].forEach(x=>{
    const d=document.createElement('div'); d.className='hstat';
    d.innerHTML=esc(x[0])+' <b>'+x[1].toLocaleString()+'</b>';
    h.appendChild(d);
  });
})();

fillSelects(); renderNav(); renderSub(); renderStats(); render();
})();
