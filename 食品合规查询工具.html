<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>合规查询 · 食品禁用词检索</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231f8a4c'/><text x='32' y='44' font-family='Arial,sans-serif' font-size='26' font-weight='600' fill='white' text-anchor='middle'>食</text></svg>">
<meta name="theme-color" content="#1f8a4c">
<style>
:root{
  --c-bg:#f3f6f4; --c-surface:#fff; --c-border:#e3ebe5; --c-border-strong:#d3ddd5;
  --c-text-1:#1a2e25; --c-text-2:#5a6e64; --c-text-3:#9aa9a1;
  --c-primary:#1f8a4c; --c-primary-2:#2aa55d; --c-primary-soft:#e6f4ec;
  --c-warn:#f57f17; --c-warn-soft:#fff8e1;
  --c-bad:#d4380d; --c-bad-soft:#fff1f0;
  --r-sm:8px; --r-md:12px; --r-lg:16px;
  --shadow-soft:0 1px 3px rgba(20,40,30,.05),0 0 1px rgba(20,40,30,.06);
  --shadow-hover:0 4px 14px rgba(31,138,76,.12),0 0 1px rgba(20,40,30,.08);
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ background:var(--c-bg); }
body{ font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--c-text-1); font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased; }
a{ color:inherit; text-decoration:none; }
.layout{ display:flex; min-height:100vh; }

/* ===== 侧栏 ===== */
aside.sidebar{ width:220px; flex-shrink:0; background:var(--c-surface); border-right:1px solid var(--c-border);
  padding:22px 16px; position:sticky; top:0; height:100vh; overflow-y:auto; }
.brand{ display:flex; align-items:center; gap:10px; padding:4px 0 18px; border-bottom:1px solid var(--c-border); margin-bottom:16px; }
.brand-logo{ width:40px; height:40px; border-radius:10px; background:linear-gradient(135deg,var(--c-primary-2),var(--c-primary));
  display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:18px; box-shadow:var(--shadow-soft); flex-shrink:0; }
.brand-title{ font-size:17px; font-weight:700; color:var(--c-text-1); line-height:1.2; }
.brand-subtitle{ font-size:11px; color:var(--c-text-3); margin-top:2px; }
.back-link{ display:flex; align-items:center; gap:6px; padding:8px 12px; margin-bottom:16px; font-size:12px;
  color:var(--c-text-2); background:var(--c-bg); border-radius:var(--r-sm); border:1px solid var(--c-border); transition:all .15s; }
.back-link:hover{ background:var(--c-primary-soft); border-color:var(--c-primary-2); color:var(--c-primary); }
.cat-title{ font-size:11px; color:var(--c-text-3); text-transform:uppercase; letter-spacing:.5px; margin:6px 4px 8px; font-weight:600; }
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav-item{ display:flex; align-items:center; gap:8px; padding:9px 10px; border-radius:var(--r-sm); font-size:13px;
  color:var(--c-text-2); cursor:pointer; transition:all .15s; border:1px solid transparent; }
.nav-item .icon{ font-size:15px; }
.nav-item .count{ margin-left:auto; font-size:11px; background:var(--c-bg); color:var(--c-text-3);
  padding:1px 8px; border-radius:10px; font-weight:600; }
.nav-item:hover{ background:var(--c-bg); }
.nav-item.active{ background:var(--c-primary-soft); color:var(--c-primary); font-weight:600; border-color:var(--c-primary-soft); }
.nav-item.active .count{ background:#fff; color:var(--c-primary); }
.side-foot{ margin-top:22px; padding-top:14px; border-top:1px solid var(--c-border); font-size:11px; color:var(--c-text-3); line-height:1.7; }

/* ===== 主区 ===== */
main.content{ flex:1; padding:26px 30px 60px; min-width:0; }
.page-header{ display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; margin-bottom:20px; }
.page-header h1{ font-size:21px; font-weight:700; color:var(--c-text-1); margin:0 0 5px; }
.page-header .desc{ font-size:13px; color:var(--c-text-2); }
.hero{ width:200px; height:96px; flex-shrink:0; align-self:center; }
.nav-ico{ width:18px; height:18px; flex-shrink:0; }
.nav-item .icon{ display:none; }
.hint-illu{ width:92px; height:92px; margin:0 auto 4px; }
.steps{ display:flex; align-items:center; justify-content:center; gap:4px; margin:18px auto 6px; flex-wrap:wrap; }
.step{ display:flex; flex-direction:column; align-items:center; gap:6px; width:148px; text-align:center; }
.step-ico{ width:44px; height:44px; }
.step-t{ font-size:13px; font-weight:700; color:var(--c-text-1); }
.step-s{ font-size:11px; color:var(--c-text-3); line-height:1.5; }
.step-arrow{ color:var(--c-text-3); font-size:18px; font-weight:700; }
.bico{ width:13px; height:13px; vertical-align:-2px; margin-right:3px; }
.explainer{ background:linear-gradient(180deg,#fff 0%,#f9fbf9 100%); border:1.5px solid var(--c-border); border-radius:14px; padding:16px 18px; margin-bottom:14px; box-shadow:0 2px 8px rgba(20,40,30,.05); }
.ex-title{ display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; color:var(--c-text-1); margin-bottom:12px; }
.ex-title svg{ width:20px; height:20px; flex-shrink:0; }
.ex-grid{ display:grid; grid-template-columns:1fr 48px 1fr; gap:8px; align-items:stretch; }
.ex-bad, .ex-good{ border-radius:11px; padding:11px 12px; }
.ex-bad{ background:linear-gradient(180deg,#fff1f0,#ffe8e5); border:1.5px solid #f3bfb9; }
.ex-good{ background:linear-gradient(180deg,#e6f4ec,#d4ebe0); border:1.5px solid #aed4bd; }
.ex-h{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:700; margin-bottom:8px; }
.ex-bad .ex-h{ color:var(--c-bad); }
.ex-good .ex-h{ color:var(--c-primary); }
.ex-h svg{ width:16px; height:16px; }
.bad-list{ display:flex; flex-direction:column; gap:4px; }
.bad-item{ padding:4px 9px; background:#fff; border:1px solid #f3bfb9; border-radius:6px; font-size:12.5px; color:var(--c-text-1); display:flex; align-items:center; gap:5px; }
.bad-item::before{ content:"×"; color:var(--c-bad); font-weight:700; font-size:13px; }
.good-list{ display:flex; flex-direction:column; gap:5px; }
.good-item{ padding:6px 10px; background:#fff; border:1px solid #aed4bd; border-radius:7px; font-size:12.5px; line-height:1.6; color:var(--c-text-1); }
.ex-arrow{ display:flex; align-items:center; justify-content:center; }
.ex-arrow svg{ width:34px; height:34px; }
.ex-law{ margin-top:12px; padding:9px 11px; background:var(--c-primary-soft); border-radius:7px; font-size:12.5px; line-height:1.7; color:var(--c-text-1); }
.ex-law .k{ color:var(--c-primary); font-weight:700; margin-right:5px; }
.ex-remark{ margin-top:7px; font-size:12px; color:var(--c-text-2); line-height:1.65; padding:2px 4px; }
.ex-remark .k{ color:var(--c-warn); font-weight:700; margin-right:4px; }

.search{ margin-bottom:6px; }
.box{ position:relative; }
.box input{ width:100%; padding:15px 44px 15px 16px; font-size:16px; border:1.5px solid var(--c-border);
  border-radius:var(--r-md); background:#fff; outline:none; color:var(--c-text-1); transition:all .15s; }
.box input::placeholder{ color:var(--c-text-3); }
.box input:focus{ border-color:var(--c-primary); box-shadow:0 0 0 3px var(--c-primary-soft); }
.clear{ position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--c-text-3); font-size:22px;
  cursor:pointer; display:none; padding:2px 4px; line-height:1; }
.clear:hover{ color:var(--c-text-1); }
.cnt{ font-size:12.5px; color:var(--c-text-2); margin:12px 2px 14px; }
.cnt b{ color:var(--c-text-1); }

/* ===== 卡片 ===== */
.card{ background:var(--c-surface); border:1px solid var(--c-border); border-left:4px solid var(--c-border-strong);
  border-radius:var(--r-md); padding:13px 15px; margin-bottom:10px; box-shadow:var(--shadow-soft); transition:box-shadow .15s; }
.card:hover{ box-shadow:var(--shadow-hover); }
.card.bad{ border-left-color:var(--c-bad); }
.card.warn{ border-left-color:var(--c-warn); }
.card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:7px; }
.badge{ font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px; }
.b-bad{ background:var(--c-bad); color:#fff; }
.b-warn{ background:var(--c-warn); color:#fff; }
.b-brow{ background:var(--c-bg); color:var(--c-text-3); }
.seq{ font-size:11px; color:var(--c-text-3); }
.term{ font-size:15.5px; font-weight:700; color:var(--c-text-1); margin-bottom:7px; line-height:1.45; }
.tags{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:9px; }
.tag{ font-size:11px; padding:2px 9px; border-radius:20px; background:var(--c-primary-soft); color:var(--c-primary); font-weight:500; }
.law{ font-size:13px; line-height:1.65; color:var(--c-text-1); background:var(--c-primary-soft);
  border-radius:var(--r-sm); padding:9px 11px; margin-bottom:9px; }
.law .k{ color:var(--c-primary); font-weight:700; margin-right:6px; }
.note{ font-size:12.5px; line-height:1.7; color:var(--c-text-2); background:var(--c-bg);
  border-left:3px solid var(--c-border-strong); border-radius:4px; padding:8px 11px; white-space:pre-wrap; }
mark{ background:#fff1b8; color:inherit; padding:0 1px; border-radius:2px; }
.hint{ text-align:center; color:var(--c-text-3); padding:52px 16px; }
.hint .big{ font-size:15px; color:var(--c-text-2); margin-bottom:7px; font-weight:600; }
.hint .sub{ font-size:13px; }
.browse-btn{ display:inline-block; margin-top:16px; font-size:13px; color:#fff; background:var(--c-primary);
  padding:9px 20px; border-radius:22px; cursor:pointer; transition:all .15s; }
.browse-btn:hover{ background:var(--c-primary-2); }
footer{ margin-top:28px; font-size:11px; color:var(--c-text-3); text-align:center; line-height:1.7; }

@media (max-width:900px){
  .layout{ flex-direction:column; }
  aside.sidebar{ width:100%; height:auto; position:static; padding:14px 16px; border-right:none; border-bottom:1px solid var(--c-border); }
  .brand{ border-bottom:none; margin-bottom:10px; padding-bottom:10px; }
  .back-link{ margin-bottom:10px; }
  .cat-title{ display:none; }
  .nav{ flex-direction:row; flex-wrap:wrap; gap:6px; }
  .nav-item{ flex:1; min-width:140px; justify-content:center; }
  .nav-item .count{ margin-left:6px; }
  .side-foot{ display:none; }
  main.content{ padding:18px 16px 40px; }
  .hero{ display:none; }
  .steps{ flex-direction:column; gap:10px; }
  .step{ flex-direction:row; width:100%; max-width:300px; text-align:left; gap:12px; }
  .step-arrow{ transform:rotate(90deg); }
  .ex-grid{ grid-template-columns:1fr; }
  .ex-arrow{ transform:rotate(90deg); padding:2px 0; }
}
</style>
</head>

</div>

合量化条件并附检测报告；功能声称仅可使用标准附录D用语。", "note": "GB 28050-2025 附录C 表C.1：“低脂肪”：脂肪≤3 g/100 g（固体）；≤1.5 g/100 mL（液体）。", "kw": ["低脂"], "laws": ["《营养标签通则》", "GB 28050"]}, {"seq": 42, "row": 43, "category": "条件限制类", "sub": "营养含量声称", "term": "高蛋白 / 富含蛋白质", "desc": "固体≥20% NRV；液体≥10% NRV；须区分固/液态分别达标", "law": "GB 28050《营养标签通则》：营养声称须符合量化条件并附检测报告；功能声称仅可使用标准附录D用语。", "note": "GB 28050-2025 附录C 表C.1：“高”或“富含”蛋白质：蛋白质含量≥20% NRV（固体）；≥10% NRV（液体）。", "kw": ["高蛋白", "富含蛋白质"], "laws": ["《营养标签通则》", "GB 28050"]}, {"seq": 43, "row": 44, "category": "条件限制类", "sub": "营养含量声称", "term": "高钙 / 富含钙", "desc": "固体≥30% NRV；液体≥15% NRV；须区分固/液态分别达标", "law": "GB 28050《营养标签通则》：营养声称须符合量化条件并附检测报告；功能声称仅可使用标准附录D用语。", "note": "GB 28050-2025 附录C 表C.1：“高”或“富含”钙：钙含量≥30% NRV（固体）；≥15% NRV（液体）。", "kw": ["高钙", "富含钙"], "laws": ["《营养标签通则》", "GB 28050"]}, {"seq": 44, "row": 45, "category": "条件限制类", "sub": "营养含量声称", "term": "减少脂肪 / 减少糖", "desc": "与参考食品相比减少 ≥ 25%；须明确参考食品，附数据支撑", "law": "GB 28050《营养标签通则》：营养声称须符合量化条件并附检测报告；功能声称仅可使用标准附录D用语。", "note": "GB 28050-2025 附录C 表C.2 比较声称条件：“减少”能量、脂肪、糖或钠含量，与参考食品比较，差异≥25%。", "kw": ["减少脂肪", "减少糖"], "laws": ["《营养标签通则》", "GB 28050"]}, {"seq": 45, "row": 46, "category": "条件限制类", "sub": "营养含量声称", "term": "低钠", "desc": "钠 ≤ 120mg/100g(mL)；需检测报告验证", "law": "GB 28050《营养标签通则》：营养声称须符合量化条件并附检测报告；功能声称仅可使用标准附录D用语。", "note": "GB 28050-2025 附录C 表C.1：“低钠”：钠≤120 mg/100 g（液体）。", "kw": ["低钠"], "laws": ["《营养标签通则》", "GB 28050"]}, {"seq": 46, "row": 47, "category": "条件限制类", "sub": "\"零添加\"类声称（2027.3.16起全面禁止）", "term": "零添加、0添加", "desc": "不科学概念，误导消费者忽略真实属性", "law": "GB 7718-2025 4.4.2.2：预包装食品不得使用「不添加」「不使用」及其同义语等词汇对食品配料进行特别强调；2027.3.16 强制实施。", "note": "《食品安全国家标准 预包装食品标签通则》（GB 7718-2025，2027.3.16施行）4.4.2.2：不得使用“不添加”“不使用”及其同义语等词汇；其他法律、法规或者食品安全国家标准中另有规定的从其规定。", "kw": ["零添加", "0添加"], "laws": ["GB 7718-2025"]}, {"seq": 47, "row": 48, "category": "条件限制类", "sub": "\"零添加\"类声称（2027.3.16起全面禁止）", "term": "不添加、未添加", "desc": "仅描述生产过程，与终产品含量不完全等同", "law": "GB 7718-2025 4.4.2.2：「不添加」「未添加」类用语仅描述生产过程，与终产品含量不完全等同；与零添加同属禁止类。", "note": "《食品安全国家标准 预包装食品标签通则》（GB 7718-2025，2027.3.16施行）4.4.2.2：不得使用“不添加”“不使用”及其同义语等词汇；其他法律、法规或者食品安全国家标准中另有规定的从其规定。", "kw": ["不添加", "未添加"], "laws": ["GB 7718-2025"]}, {"seq": 48, "row": 49, "category": "条件限制类", "sub": "\"零添加\"类声称（2027.3.16起全面禁止）", "term": "无防腐剂、不含色素（对添加剂）", "desc": "食品添加剂不得用\"无\"\"不含\"声称", "law": "GB 7718-2025 4.4.2.1：食品添加剂、污染物，以及法律、法规和标准中规定的不允许添加到食品中或不应存在于食品中的物质，不得使用「无」「不含」等词汇及其同义语进行声称；2027.3.16 强制实施。", "note": "GB 7718-2025 4.4.2.1：使用“无”“不含”等词汇时，其相应配料或者成分含量应当为“0”。食品添加剂、污染物，以及法律、法规和标准中规定的不允许添加到食品中或者不应存在于食品中的物质，不得使用“无”“不含”等词汇及其同义语进行声称。", "kw": ["无防腐剂", "不含色素（对添加剂）"], "laws": ["GB 7718-2025"]}, {"seq": 49, "row": 50, "category": "条件限制类", "sub": "\"零添加\"类声称（2027.3.16起全面禁止）", "term": "0蔗糖、不添加蔗糖", "desc": "果汁本身含大量糖分，声称\"不添加蔗糖\"具误导性", "law": "GB 7718-2025 4.4.2.2：果汁等本身含大量糖分的产品标「不添加蔗糖」仍属误导；属于 4.4.2.2 全面禁止类。", "note": "《食品安全国家标准 预包装食品标签通则》（GB 7718-2025，2027.3.16施行）4.4.2.2：不得使用“不添加”“不使用”及其同义语等词汇；其他法律、法规或者食品安全国家标准中另有规定的从其规定。", "kw": ["0蔗糖", "不添加蔗糖"], "laws": ["GB 7718-2025"]}, {"seq": 50, "row": 51, "category": "条件限制类", "sub": "\"零添加\"类声称（2027.3.16起全面禁止）", "term": "不添加甜味剂", "desc": "造成\"无食品添加剂\"的误解", "law": "GB 7718-2025 4.4.2.2：「不添加甜味剂」会造成「无食品添加剂」的误解，属禁止类用语。", "note": "《食品安全国家标准 预包装食品标签通则》（GB 7718-2025，2027.3.16施行）4.4.2.2：不得使用“不添加”“不使用”及其同义语等词汇；其他法律、法规或者食品安全国家标准中另有规定的从其规定。", "kw": ["不添加甜味剂"], "laws": ["GB 7718-2025"]}, {"seq": 51, "row": 52, "category": "条件限制类", "sub": "\"零添加\"类声称（2027.3.16起全面禁止）", "term": "无色素、无增稠剂", "desc": "同属对食品添加剂的\"无\"\"不含\"声称", "law": "GB 7718-2025 4.4.2.1：食品添加剂、污染物，以及法律、法规和标准中规定的不允许添加到食品中或不应存在于食品中的物质，不得使用「无」「不含」等词汇及其同义语进行声称；2027.3.16 强制实施。", "note": "GB 7718-2025 4.4.2.1：使用“无”“不含”等词汇时，其相应配料或者成分含量应当为“0”。食品添加剂、污染物，以及法律、法规和标准中规定的不允许添加到食品中或者不应存在于食品中的物质，不得使用“无”“不含”等词汇及其同义语进行声称。", "kw": ["无色素", "无增稠剂"], "laws": ["GB 7718-2025"]}, {"seq": 52, "row": 53, "category": "条件限制类", "sub": "特定概念与认证声称", "term": "有机 / 绿色 / 无公害", "desc": "获得国家法定认证，标注认证标志+机构+编号；无认证擅自标注直接违规", "law": "相关认证法规及国标定义：须取得法定认证或严格符合国标定义，未达标即违规。", "note": "《有机产品认证管理办法》（市场监管总局令）第三十四条：未获得有机产品认证的，任何单位和个人不得在产品、产品最小销售包装及其标签上标注含有“有机”“ORGANIC”等字样且可能误导公众认为该产品为有机产品的文字表述和图案（第四十八条：责令改正，处3万元以下罚款）；第十五条：有机配料含量≥95%的加工产品，方可在产品或者包装及标签上标注“有机”字样。\n《绿色食品标志管理办法》（农业部令2012年第6号）第二十一条：未经中国绿色食品发展中心许可，任何单位和个人不得使用绿色食品标志；禁止将绿色食品标志用于非许可产品及其经营性活动。\n（注：“无公害”农产品认证已自2018年起停止，不得再标注“无公害”字样。）", "kw": ["有机", "绿色", "无公害"], "laws": []}, {"seq": 53, "row": 54, "category": "条件限制类", "sub": "特定概念与认证声称", "term": "非转基因", "desc": "仅对国家批准商业化种植的作物；花生等无转基因版本作物标注即误导", "law": "相关认证法规及国标定义：须取得法定认证或严格符合国标定义，未达标即违规。", "note": "中国对“非转基因”标识无国家强制认证；对不存在转基因品种的作物标注“非转基因”易误导消费者认为市场存在转基因竞品。依据：《反不正当竞争法》（2025修订）第九条（虚假/引人误解宣传）+《食品安全法》第七十一条（标签不得含虚假内容）+《食品标识监督管理办法》第七条（二）（虚假描述）。农业转基因生物标识按《农业转基因生物安全管理条例》《食品安全法》第六十九条执行。", "kw": ["非转基因"], "laws": []}, {"seq": 54, "row": 55, "category": "条件限制类", "sub": "特定概念与认证声称", "term": "纯牛奶 / 纯果汁", "desc": "符合国标定义（如纯牛奶=100%生牛乳）；配料表需完全匹配\"纯度\"声称", "law": "相关认证法规及国标定义：须取得法定认证或严格符合国标定义，未达标即违规。", "note": "《食品安全国家标准 预包装食品标签通则》（GB 7718-2025）4.4.1.1：食品中的配料或者成分若在食品名称中提及，应当标示其相关配料或者成分的添加量或者在成品中的含量。《食品标识监督管理办法》第十六条：应当标注反映食品真实属性的名称；仅使用香精调配出某种配料风味的，应当冠以“某味”“某风味”。“纯”属真实属性声称，须符合相应产品标准（如纯牛奶以生乳为原料、纯果汁为100%果汁）。", "kw": ["纯牛奶", "纯果汁"], "laws": []}, {"seq": 55, "row": 56, "category": "条件限制类", "sub": "特定概念与认证声称", "term": "手工 / 传统 / 古法", "desc": "核心制作工艺确为手工/传统并有充分证据；工业化生产不得谎称\"纯手工\"", "law": "相关认证法规及国标定义：须取得法定认证或严格符合国标定义，未达标即违规。", "note": "《食品标识监督管理办法》第七条（二）：食品标识不得标注欺骗、误导消费者或者夸大、虚假描述的内容。《反不正当竞争法》（2025修订）第九条：经营者不得作虚假或者引人误解的商业宣传。工业化产品冒充“手工”“古法”属虚假描述。", "kw": ["手工", "传统", "古法"], "laws": []}, {"seq": 56, "row": 57, "category": "条件限制类", "sub": "特定概念与认证声称", "term": "清真", "desc": "通过当地民族宗教事务部门认证；无认证随意标注涉嫌违规", "law": "相关认证法规及国标定义：须取得法定认证或严格符合国标定义，未达标即违规。", "note": "我国无全国统一“清真食品”强制国标，“清真”认证依地方条例/团体标准（如《清真食品认证》团体标准）。未经认证不得擅自标注“清真”字样，否则构成虚假/误导，依据《反不正当竞争法》第九条 +《食品标识监督管理办法》第七条（二）；并须尊重民族政策，不得违背公序良俗。", "kw": ["清真"], "laws": []}, {"seq": 57, "row": 58, "category": "条件限制类", "sub": "特定概念与认证声称", "term": "原产地 / 进口", "desc": "产地与原料主要来源地一致并附报关单；虚构产地、夸大来源构成误导", "law": "相关认证法规及国标定义：须取得法定认证或严格符合国标定义，未达标即违规。", "note": "《地理标志产品保护办法》（国家知识产权局令第80号，2024.2.1施行）第二十三条：其他单位或者个人不得擅自使用受保护的地理标志产品名称或者专用标志；第三十条：在产地范围外使用受保护地理标志产品名称、冒用专用标志等，依据相关法律法规处理。进口食品应按《食品安全法》第九十七条加贴中文标签并附报关凭证，虚假标注原产地依《反不正当竞争法》第九条处罚。", "kw": ["原产地", "进口"], "laws": []}, {"seq": 58, "row": 59, "category": "商标法", "sub": "不得作为商标使用的标志", "term": "国家名称、国旗、国徽、国歌、军旗、军徽", "desc": "商标法（2026 修订版）第十五条第（一）项", "law": "《商标法》（2026修订版，2027.1.1施行）第十五条第（二）项（国名、国旗、国徽、国歌、军旗、军徽、军歌、勋章等；同中央和国家机关的名称、标志、所在地特定地点不得作为商标注册和使用）。", "note": "《商标法》（2026修订版，2027.1.1施行）第十五条　下列标志不得作为商标注册和使用：（二）同中华人民共和国的国家名称、国旗、国徽、国歌、军旗、军徽、军歌、勋章等相同或者近似的，以及同中央和国家机关的名称、标志、所在地特定地点的名称或者标志性建筑物的名称、图形相同的；", "kw": ["国家名称", "国旗", "国徽", "国歌", "军旗", "军徽"], "laws": ["《商标法》"]}, {"seq": 59, "row": 60, "category": "商标法", "sub": "不得作为商标使用的标志", "term": "中央国家机关名称、标志、所在地特定地点", "desc": "如\"中南海\"\"人民大会堂\"等", "law": "《商标法》（2026 修订版，2027.1.1 施行）第十五条第（二）项（中央国家机关的名称、标志、所在地特定地点的名称或者标志性建筑物的名称不得作为商标注册和使用）。", "note": "《商标法》（2026修订版，2027.1.1施行）第十五条　下列标志不得作为商标注册和使用：（二）同中华人民共和国的国家名称、国旗、国徽、国歌、军旗、军徽、军歌、勋章等相同或者近似的，以及同中央和国家机关的名称、标志、所在地特定地点的名称或者标志性建筑物的名称、图形相同的；", "kw": ["中央国家机关名称", "标志", "所在地特定地点"], "laws": ["《商标法》"]}, {"seq": 60, "row": 61, "category": "商标法", "sub": "不得作为商标使用的标志", "term": "外国国家名称、国旗、国徽（未经同意）", "desc": "商标法（2026 修订版）第十五条第（二）项", "law": "《商标法》（2026 修订版，2027.1.1 施行）第十五条第（三）项（外国的国家名称、国旗、国徽、军旗未经该国政府同意不得作为商标注册和使用）。", "note": "《商标法》（2026修订版，2027.1.1施行）第十五条　下列标志不得作为商标注册和使用：（三）同外国的国家名称、国旗、国徽、军旗等相同或者近似的，但经该国政府同意的除外；", "kw": ["外国国家名称", "国旗", "国徽（未经同意）"], "laws": ["《商标法》"]}, {"seq": 61, "row": 62, "category": "商标法", "sub": "不得作为商标使用的标志", "term": "政府间国际组织名称、旗帜、徽记", "desc": "如\"联合国\"\"WTO\"等", "law": "《商标法》（2026 修订版，2027.1.1 施行）第十五条第（四）项（政府间国际组织的名称、旗帜、徽记未经同意或者不易误导的不得作为商标注册和使用）。", "note": "《商标法》（2026修订版，2027.1.1施行）第十五条　下列标志不得作为商标注册和使用：（四）同政府间国际组织的名称、旗帜、徽记等相同或者近似的，但经该组织同意或者不易误导公众的除外；", "kw": ["政府间国际组织名称", "旗帜", "徽记"], "laws": ["《商标法》"]}, {"seq": 62, "row": 63, "category": "商标法", "sub": "不得作为商标使用的标志", "term": "官方标志、检验印记（未经授权）", "desc": "如\"3C\"标志等", "law": "《商标法》（2026 修订版，2027.1.1 施行）第十五条第（五）项（官方标志、检验印记未经授权不得作为商标注册和使用）。", "no 法》第五十九条：禁止向未成年人销售酒；难以判明是否是未成年人的，应当要求其出示身份证件。\n（向未成年人介绍/推荐酒类，另触《未成年人保护法》第五十九条及《广告法》第四十条）", "kw": ["向未成年人介绍", "推荐酒类"], "laws": ["《广告法》", "《未成年人保护法》", "《广告法》"]}, {"seq": 72, "row": 73, "category": "食品名称真实性", "sub": "食品名称真实性要求", "term": "名称体现畜禽肉原料", "desc": "该原料应为主要原料；仅体现一种的，所用原料全部来自该种；体现两种以上的，按添加量从高到低在名称中排序", "law": "《食品标识监督管理办法》第十六条 + GB 7718-2025：应标注反映食品真实属性的名称，不得欺骗误导消费者。", "note": "《食品标识监督管理办法》（第100号）第十六条：食品标识应当标注反映食品真实属性的名称，不得欺骗、误导消费者；以动物源性食品原料模拟其他动物源性食品原料的，应当在名称中冠以“仿”“素”等字样；仅使用香精调配出某种配料风味的，应当冠以“某味”“某风味”等字样。\n《食品安全国家标准 预包装食品标签通则》（GB 7718-2025）4.4.1.1：食品中的配料或者成分若在食品名称中提及，应当标示其相关配料或者成分的添加量或者在成品中的含量。\n（名称体现畜禽肉等原料的，该原料须为食品主要原料，并标示其含量。）", "kw": ["名称体现畜禽肉原料"], "laws": ["《食品标识监督管理办法》", "GB 7718-2025"]}, {"seq": 73, "row": 74, "category": "食品名称真实性", "sub": "食品名称真实性要求", "term": "植物原料模拟动物源性食品", "desc": "须在名称中冠以\"仿\"\"素\"或\"某植物\"等字样", "law": "《食品标识监督管理办法》第十六条 + GB 7718-2025：应标注反映食品真实属性的名称，不得欺骗误导消费者。", "note": "《食品标识监督管理办法》（第100号）第十六条：食品标识应当标注反映食品真实属性的名称，不得欺骗、误导消费者；以动物源性食品原料模拟其他动物源性食品原料的，应当在名称中冠以“仿”“素”等字样；仅使用香精调配出某种配料风味的，应当冠以“某味”“某风味”等字样。\n《食品安全国家标准 预包装食品标签通则》（GB 7718-2025）4.4.1.1：食品中的配料或者成分若在食品名称中提及，应当标示其相关配料或者成分的添加量或者在成品中的含量。\n（植物原料模拟动物源性食品，须冠“仿”“素”等字样。）", "kw": ["植物原料模拟动物源性食品"], "laws": ["《食品标识监督管理办法》", "GB 7718-2025"]}, {"seq": 74, "row": 75, "category": "食品名称真实性", "sub": "食品名称真实性要求", "term": "仅用香精调配出配料风味", "desc": "须在名称中冠以\"某味\"\"某风味\"等字样", "law": "《食品标识监督管理办法》第十六条 + GB 7718-2025：应标注反映食品真实属性的名称，不得欺骗误导消费者。", "note": "《食品标识监督管理办法》（第100号）第十六条：食品标识应当标注反映食品真实属性的名称，不得欺骗、误导消费者；以动物源性食品原料模拟其他动物源性食品原料的，应当在名称中冠以“仿”“素”等字样；仅使用香精调配出某种配料风味的，应当冠以“某味”“某风味”等字样。\n《食品安全国家标准 预包装食品标签通则》（GB 7718-2025）4.4.1.1：食品中的配料或者成分若在食品名称中提及，应当标示其相关配料或者成分的添加量或者在成品中的含量。\n（仅以香精调配出配料风味的，须冠“某味”“某风味”，不得误导为含真实配料。）", "kw": ["仅用香精调配出配料风味"], "laws": ["《食品标识监督管理办法》", "GB 7718-2025"]}, {"seq": 75, "row": 76, "category": "食品名称真实性", "sub": "食品名称真实性要求", "term": "食品名称提及某种配料/成分", "desc": "须在标签中标示该配料/成分的含量（定量标示）\n", "law": "《食品标识监督管理办法》第十六条 + GB 7718-2025：应标注反映食品真实属性的名称，不得欺骗误导消费者。\n", "note": "《食品标识监督管理办法》（第100号）第十六条：食品标识应当标 function parseNote(note){
  const s = note||'';
  const m1 = s.split('【合规改法】');
  if(m1.length<2) return {fix:'', remark:s};
  const after = m1[1];
  const m2 = after.split('【备注】');
  return {fix: m2[0].trim(), remark: m2.length>1 ? m2.slice(1).join('【备注】').trim() : ''};
}
function explainerHtml(r){
  const parsed = parseNote(r.note);
  const fixes = parsed.fix ? parsed.fix.split(/[;；]/).map(s=>s.trim()).filter(Boolean) : (r.desc ? [r.desc] : []);
  const terms = (r.term||'').split('/').map(s=>s.trim()).filter(Boolean);
  const banItems = terms.length ? terms.map(t=>'<div class="bad-item">'+escapeHtml(t)+'</div>').join('') : '<div class="bad-item">'+escapeHtml(r.term||'')+'</div>';
  const goodItems = fixes.length ? fixes.map(f=>'<div class="good-item">'+escapeHtml(f)+'</div>').join('') : '<div class="good-item">请按 GB 7718 等法规及品类标准如实标注。</div>';
  const remark = parsed.remark ? '<div class="ex-remark"><span class="k">💡 备注</span>'+hl(parsed.remark,'')+'</div>' : '';
  return '<div class="explainer">'
    + '<div class="ex-title">'+EX_ICO_WARN+'标识错误释义</div>'
    + '<div class="ex-grid">'
    +   '<div class="ex-bad"><div class="ex-h">'+EX_ICO_BAN+'禁用表述</div><div class="bad-list">'+banItems+'</div></div>'
    +   '<div class="ex-arrow">'+EX_ICO_ARROW+'</div>'
    +   '<div class="ex-good"><div class="ex-h">'+EX_ICO_OK+'合规改法</div><div class="good-list">'+goodItems+'</div></div>'
    + '</div>'
    + '<div class="ex-law"><span class="k">📜 法律依据</span>'+hl(r.law,'')+'</div>'
    + remark
    + '</div>';
}
const META = {
  label: { title:'🏷️ 食品标签禁用词', desc:'预包装食品标签常见禁用词与违规表述 · 输入即可调出对应法规条款' },
  cater: { title:'🍽️ 餐饮宣传违禁词', desc:'餐饮门店宣传 / 广告常见违禁词 · 输入即可调出法规条款与合规改法' },
};

function switchScope(t){
  cur = t; browse = false;
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.toggle('active', i.dataset.scope===t));
  document.getElementById('pageTitle').textContent = META[t].title;
  document.getElementById('pageDesc').textContent = META[t].desc;
  const q=document.getElementById('q'); q.value=''; document.getElementById('clr').style.display='none';
  render('');
}
function browseAll(){ browse=true; document.getElementById('q').value=''; document.getElementById('clr').style.display='none'; render(''); }
function clearQ(){ browse=false; document.getElementById('q').value=''; onInput(); }

function norm(s){
  return (s||'').toLowerCase().replace(/[\s　，,。.、；;：:！!？?（）()【】\[\]""''‘’·\-_/／|]/g,'');
}
function tokens(term){
  return (term||'').split(/[、/／,， ]/).map(t=>norm(t)).filter(Boolean);
}
function dice(a,b){
  if(!a||!b) return 0;
  if(a.includes(b)||b.includes(a)) return 1;
  if(a.length<2||b.length<2) return 0;
  const bg=s=>{const r=[];for(let i=0;i<s.length-1;i++)r.push(s.substr(i,2));return r;};
  const A=bg(a),B=bg(b),sb=new Set(B);let inter=0;
  for(const g of A) if(sb.has(g)) inter++;
  return 2*inter/(A.length+B.length);
}
function scoreRec(rec, q){
  const nq = norm(q);
  if(!nq) return {strong:false, score:1, matched:''};
  const toks = tokens(rec.term).concat((rec.kw||[]).map(norm));
  let strong=false, matched='';
  for(const t of toks){
    if(!t) continue;
    if(t===nq || (nq.length>=2 && t.length>=2 && (nq.includes(t)||t.includes(nq)))){
      strong=true; matched=t; break;
    }
  }
  let best=0;
  const cands = [norm(rec.term), norm(rec.sub), norm(rec.category), norm(rec.desc)].concat((rec.kw||[]).map(norm));
  for(const c of cands){ const d=dice(nq,c); if(d>best) best=d; }
  if(strong) best=1;
  return {strong, score:best, matched};
}
function escapeRe(s){return (s||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function escapeHtml(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hl(text, q){
  if(!text) return '';
  const nq=norm(q);
  if(!nq) return escapeHtml(text);
  const t=norm(text);
  let frag = t.includes(nq) ? q : (nq.length>=2 && t.length>=2 && nq.includes(t) ? text : '');
  if(frag){
    return escapeHtml(text).split(escapeHtml(frag)).join('<mark>'+escapeHtml(frag)+'</mark>');
  }
  return escapeHtml(text);
}

function onInput(){
  const q=document.getElementById('q').value;
  document.getElementById('clr').style.display = q? 'block':'none';
  render(q);
}
function render(q){
  const list = DATA[cur];
  const out = document.getElementById('list');
  const cnt = document.getElementById('cnt');
  const nq = norm(q);
  if(!nq && !browse){
    cnt.textContent = '共 '+list.length+' 条基础词条';
    out.innerHTML = hintHtml(list.length);
    return;
  }
  let items, bad=0, rel=0;
  if(nq){
    items = list.map(r=>({r, ...scoreRec(r,q)})).filter(x=>x.strong || x.score>=0.18);
    items.sort((a,b)=>(b.strong-a.strong)||(b.score-a.score)||(a.r.seq-b.r.seq));
    bad = items.filter(x=>x.strong).length;
    rel = items.filter(x=>!x.strong && x.score>=0.3).length;
    cnt.innerHTML = '命中 <b>'+items.length+'</b> 条 · <span style="color:var(--c-bad)">违规 '+bad+'</span> · <span style="color:var(--c-warn)">可能相关 '+rel+'</span>';
  } else {
    items = list.map(r=>({r, strong:false, score:1, matched:''}));
    cnt.textContent = '全部 '+list.length+' 条';
  }
  const explainer = (items.length && items[0].strong) ? explainerHtml(items[0].r) : '';
  out.innerHTML = explainer + (items.length ? items.slice(0,80).map(x=>cardHtml(x.r,q)).join('') : '<div class="hint">未命中任何词条，但请仍结合具体标注语境综合判断。</div>');
}
function hintHtml(n){
  return '<div class="hint">'
    + '<div class="big">输入禁用词 / 表述，立即查看是否违规</div>'
    + '<div class="sub">并调出对应的法规条款与原文 · 当前范围共 '+n+' 条</div>'
    + STEPS_HTML
    + '<div class="browse-btn" onclick="browseAll()">浏览全部 '+n+' 条</div></div>';
}
function cardHtml(r, q){
  let cls='', badge='<span class="badge b-brow">'+ICON_BROW+'参考词条</span>';
  if(q){
    const sc=scoreRec(r,q);
    if(sc.strong){ cls='bad'; badge='<span class="badge b-bad">'+ICON_BAD+'违规命中</span>'; }
    else if(sc.score>=0.3){ cls='warn'; badge='<span class="badge b-warn">'+ICON_WARN+'可能相关</span>'; }
  }
  const note = r.note ? '<div class="note">'+hl(r.note,q)+'</div>' : '';
  return '<div class="card '+cls+'">'
    + '<div class="card-head">'+badge+'<span class="seq">#'+(r.seq)+'</span></div>'
    + '<div class="term">'+hl(r.term,q)+'</div>'
    + '<div class="tags"><span class="tag">'+escapeHtml(r.category)+'</span><span class="tag">'+escapeHtml(r.sub)+'</span></div>'
    + '<div class="law"><span class="k">法律依据</span>'+hl(r.law,q)+'</div>'
    + note
    + '</div>';
}
