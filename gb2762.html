<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GB 2762-2025 食品中污染物限量查询 · jianyu</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231a365d'/><text x='32' y='40' font-family='Arial,sans-serif' font-size='18' font-weight='600' fill='white' text-anchor='middle'>污染物</text></svg>">
<meta name="theme-color" content="#1a365d">
<style>
:root {
  --c-bg: #f6f8fb;
  --c-surface: #ffffff;
  --c-border: #e6ebf1;
  --c-border-strong: #d0d7e0;
  --c-text-1: #1a2332;
  --c-text-2: #5d6d7e;
  --c-text-3: #95a5a6;
  --c-primary: #1a365d;
  --c-primary-2: #2c5282;
  --c-primary-soft: #ebf2fa;
  --c-accent: #8e44ad;
  --c-accent-soft: #f5edf7;
  --c-high: #c62828;
  --c-high-soft: #ffebee;
  --c-mid: #e65100;
  --c-mid-soft: #fff3e0;
  --c-warn: #f57f17;
  --c-warn-soft: #fffde7;
  --c-ok: #2e7d32;
  --c-ok-soft: #e8f5e9;
  --c-tree-sel: #f4faf6;
  --c-tree-sel-border: #6fb580;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --shadow-soft: 0 1px 2px rgba(20, 30, 50, 0.04), 0 0 1px rgba(20, 30, 50, 0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--c-bg); }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; color: var(--c-text-1); padding: 24px 16px; line-height: 1.6; font-size: 14px; -webkit-font-smoothing: antialiased; }
.container { max-width: 1180px; margin: 0 auto; }

header.brand { display: flex; align-items: center; gap: 14px; padding: 6px 4px 20px; border-bottom: 1px solid var(--c-border); margin-bottom: 18px; }
header.brand .logo { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--c-primary-2), var(--c-primary)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 14px; letter-spacing: -0.5px; box-shadow: var(--shadow-soft); flex-shrink: 0; }
header.brand .brand-text { flex: 1; min-width: 0; }
header.brand .brand-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
header.brand .brand-title .zh { font-size: 18px; font-weight: 600; color: var(--c-text-1); letter-spacing: 0.3px; }
header.brand .brand-title .en { font-size: 13px; color: var(--c-text-3); font-weight: 500; }
header.brand .subtitle { font-size: 12px; color: var(--c-text-2); margin-top: 6px; }
header.brand .ver { font-size: 11px; color: var(--c-text-2); padding: 5px 12px; background: var(--c-primary-soft); border-radius: 14px; font-weight: 500; letter-spacing: 0.3px; flex-shrink: 0; }
header.brand .back { font-size: 12px; color: var(--c-text-2); padding: 5px 12px; border: 1px solid var(--c-border-strong); border-radius: 14px; text-decoration: none; }
header.brand .back:hover { background: var(--c-primary-soft); border-color: var(--c-primary-2); color: var(--c-primary); }

/* ============= 顶部污染物 tab 行(sticky) ============= */
.contam-section {
  position: sticky;
  top: 0;
  z-index: 10;
  background: linear-gradient(180deg, var(--c-bg) 0%, var(--c-bg) 90%, transparent 100%);
  border-bottom: 1px solid var(--c-border);
  border-radius: 0;
  box-shadow: none;
}

/* ============= 通用 section ============= */
.section { background: var(--c-surface); border-radius: var(--r-md); padding: 18px 22px; margin-bottom: 14px; border: 1px solid var(--c-border); box-shadow: var(--shadow-soft); }
.section-title { font-size: 13px; font-weight: 600; color: var(--c-text-1); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.section-title .hint { font-size: 12px; color: var(--c-text-3); font-weight: normal; }

input[type="text"] { width: 100%; padding: 12px 14px; border: 1px solid var(--c-border-strong); border-radius: var(--r-sm); font-size: 14px; outline: none; transition: border-color 0.15s, box-shadow 0.15s; background: #fafbfc; color: var(--c-text-1); }
input[type="text"]:focus { border-color: var(--c-primary-2); background: white; box-shadow: 0 0 0 3px rgba(44, 82, 130, 0.1); }
.input-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.input-row input { flex: 1; min-width: 220px; }
button { background: white; border: 1px solid var(--c-border-strong); border-radius: var(--r-sm); padding: 9px 16px; font-size: 13px; cursor: pointer; color: var(--c-text-2); transition: all 0.15s; font-family: inherit; }
button:hover { background: var(--c-primary-soft); border-color: var(--c-primary-2); color: var(--c-primary); }
button.primary { background: var(--c-primary-2); color: white; border-color: var(--c-primary-2); }
button.primary:hover { background: var(--c-primary); border-color: var(--c-primary); }
button.export { background: var(--c-ok-soft); border-color: var(--c-ok); color: var(--c-ok); }
button.export:hover { background: #d9ebd9; }

/* ============= Chips 多选筛选(模式 C 顶部) ============= */
.filter-toggle {
  padding: 6px 14px; font-size: 12px; background: var(--c-surface);
  border: 1px solid var(--c-border-strong); color: var(--c-primary);
  border-radius: 6px; cursor: pointer; transition: all .15s;
}
.filter-toggle:hover { background: var(--c-primary-soft); border-color: var(--c-primary); }
.filter-toggle.active { background: var(--c-primary-soft); border-color: var(--c-primary); color: var(--c-primary); font-weight: 600; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--c-border); border-radius: 16px; background: var(--c-surface); font-size: 12.5px; color: var(--c-text-2); cursor: pointer; user-select: none; transition: all .15s; line-height: 1.4; }
.chip:hover { border-color: var(--c-primary); background: var(--c-primary-soft); color: var(--c-primary); }
.chip.selected { background: var(--c-primary); color: #fff; border-color: var(--c-primary); font-weight: 500; }
.chip.selected .chip-count { color: rgba(255,255,255,.85); }
.chip-count { font-size: 10.5px; color: var(--c-text-3); margin-left: 2px; }
.chip.sym { color: var(--c-text-3); font-size: 11px; font-weight: 400; }

/* tree toolbar 共用 .summary */
.summary { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 0; }

table.results { width: 100%; border-collapse: collapse; font-size: 13px; }
table.results th { background: #f4f7fa; padding: 10px 12px; text-align: left; font-weight: 600; color: var(--c-text-1); border-bottom: 1px solid var(--c-border-strong); position: sticky; top: 0; font-size: 12px; }
table.results td { padding: 9px 12px; border-bottom: 1px solid var(--c-border); color: var(--c-text-1); }
table.results tr:hover td { background: #fafbfc; }
table.results td.contaminant { font-weight: 600; color: var(--c-primary); white-space: nowrap; }
table.results td.category { color: var(--c-text-2); font-size: 12px; white-space: nowrap; }
table.results td.food { color: var(--c-text-1); }
table.results td.limit { font-weight: 600; color: var(--c-high); white-space: nowrap; font-family: "SF Mono", Consolas, monospace; }
table.results td.unit { font-size: 11px; color: var(--c-text-3); white-space: nowrap; }
table.results td.remark { font-size: 12px; color: var(--c-text-2); font-style: italic; }

.empty-tip { color: var(--c-text-3); font-size: 13px; padding: 24px 0; text-align: center; }
.empty-tip .emoji { font-size: 36px; display: block; margin-bottom: 6px; opacity: 0.4; }

.footnote-block { background: #fffbea; border: 1px solid #f7e4a8; border-radius: var(--r-sm); padding: 10px 14px; margin-top: 12px; font-size: 12px; color: var(--c-text-2); }
.footnote-block .fn-title { font-weight: 600; color: var(--c-warn); margin-bottom: 6px; font-size: 12px; }
.footnote-block .fn-item { padding: 2px 0; }
.footnote-block .fn-mark { display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center; background: var(--c-warn); color: white; border-radius: 50%; font-size: 11px; margin-right: 6px; font-weight: 600; }
/* 内联脚注 badge（表格 备注 列） */
.fn-mark.inline { display: inline-block; min-width: 18px; height: 18px; line-height: 18px; padding: 0 5px; text-align: center; background: var(--c-warn); color: white; border-radius: 9px; font-size: 11px; margin-right: 4px; font-weight: 600; vertical-align: middle; cursor: help; }
.remark-cell .remark-text { color: var(--c-text-2); font-size: 11.5px; }

.method-block { background: var(--c-primary-soft); border: 1px solid #d3dfee; border-radius: var(--r-sm); padding: 10px 14px; margin-top: 10px; font-size: 12px; color: var(--c-text-2); }
.method-block .m-title { font-weight: 600; color: var(--c-primary); margin-bottom: 4px; }

/* ============= 树形浏览模式 ============= */
.tree-view { display: grid; grid-template-columns: 280px 1fr; gap: 14px; align-items: flex-start; }

/* ============= 按污染物查询模式(顶部 chips 多选) ============= */
.contam-toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.contam-toolbar input { flex: 1; min-width: 200px; padding: 7px 11px; border: 1px solid var(--c-border); border-radius: 6px; font-size: 13px; background: var(--c-bg); color: var(--c-text); font-family: inherit; }
.contam-toolbar input:focus { outline: none; border-color: var(--c-primary); }
.contam-toolbar button { padding: 7px 13px; border: 1px solid var(--c-border); border-radius: 6px; background: var(--c-surface); color: var(--c-text-2); font-size: 12px; cursor: pointer; font-family: inherit; }
.contam-toolbar button:hover { color: var(--c-primary); border-color: var(--c-primary); }

@media (max-width: 880px) { .tree-view { grid-template-columns: 1fr; } }

.tree-side {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  padding: 14px 12px;
  box-shadow: var(--shadow-soft);
  max-height: 78vh;
  overflow-y: auto;
  position: sticky;
  top: 8px;
}
.tree-side h3 {
  font-size: 16px; color: var(--c-text-1); font-weight: 700;
  margin-bottom: 6px; padding-bottom: 8px;
  border-bottom: 1px solid var(--c-border);
  display: flex; align-items: center; gap: 6px;
}
.tree-side .tree-subtitle {
  font-size: 11.5px; color: var(--c-text-3);
  margin-bottom: 10px; line-height: 1.5;
}
.tree-side h3 .tree-toggle {
  margin-left: auto;
  padding: 0 10px; height: 26px;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  border: 1px solid var(--c-border-strong); border-radius: 6px;
  background: var(--c-bg); color: var(--c-text-2);
  cursor: pointer; font-size: 12px; transition: all .15s; font-weight: 500;
}
.tree-side h3 .tree-toggle:hover { background: var(--c-primary-soft); border-color: var(--c-primary); color: var(--c-primary); }

.tree-toolbar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.tree-toolbar button {
  font-size: 11px; padding: 4px 9px; border-radius: 5px;
  background: var(--c-bg); border: 1px solid var(--c-border);
  color: var(--c-text-2); cursor: pointer; transition: all .12s;
}
.tree-toolbar button:hover { background: var(--c-primary-soft); color: var(--c-primary); border-color: var(--c-primary); }
.tree-toolbar .summary { font-size: 11px; color: var(--c-text-3); margin-left: auto; align-self: center; }

/* 折叠态:仅保留一个 36px 宽的窄条 */
.tree-view.side-collapsed { grid-template-columns: 36px 1fr; gap: 8px; }
.tree-side.collapsed { padding: 12px 4px; }
.tree-side.collapsed h3 { display: none; }
.tree-side.collapsed .tree-toolbar,
.tree-side.collapsed .tree-search,
.tree-side.collapsed #treeList { display: none; }
.tree-side.collapsed .tree-collapsed-rail {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.tree-collapsed-rail { display: none; }
.tree-collapsed-rail button {
  width: 30px; height: 30px; padding: 0;
  border: 1px solid var(--c-border-strong); border-radius: 6px;
  background: white; color: var(--c-primary);
  font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s; font-weight: 600;
}
.tree-collapsed-rail button:hover { background: var(--c-primary-soft); border-color: var(--c-primary); }
.tree-collapsed-rail .rail-icon { font-size: 16px; }
.tree-search { margin-bottom: 8px; position: relative; }
.tree-search input { padding: 7px 10px; font-size: 12px; }
.tree-search .clear-btn {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  border: none; background: transparent; color: var(--c-text-3);
  cursor: pointer; padding: 2px 6px; font-size: 14px;
}

.tree-node {
  display: flex; flex-direction: column; gap: 2px;
  padding: 9px 8px 9px 4px;
  border-radius: 7px;
  cursor: pointer; user-select: none;
  color: var(--c-text-1);
  transition: background .12s;
  border: 1px solid transparent;
}
.tree-node:hover { background: #f6f8fb; }
.tree-node.selected { background: var(--c-tree-sel); border-color: var(--c-tree-sel-border); }
.tree-node.selected .tn-row1 { font-weight: 600; }

.tn-row1 { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.tn-row2 { font-size: 11.5px; color: var(--c-text-3); padding-left: 22px; line-height: 1.4; }
.tn-row2 .dot { margin: 0 4px; opacity: 0.5; }
.tree-node.selected .tn-row2 { color: var(--c-text-2); }

.tn-arrow {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 50%;
  background: #eef2f6; color: var(--c-text-2); flex-shrink: 0;
  font-size: 16px; line-height: 1; font-weight: 700;
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", monospace;
  transition: all .15s;
}
.tn-arrow.has { cursor: pointer; background: #e6eef5; color: var(--c-primary); }
.tn-arrow.has:hover { background: var(--c-primary); color: white; }
.tn-arrow.empty { cursor: default; opacity: 0.7; }

.tn-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 层级颜色/缩进 */
.tree-node.depth-1 { margin-top: 6px; }
.tree-node.depth-1:first-child { margin-top: 0; }
.tree-node.depth-1 .tn-row1 { font-weight: 700; color: var(--c-text-1); }
.tree-node.depth-2 .tn-row1 { font-weight: 600; }
.tree-node.depth-3 .tn-row1 { font-weight: 500; color: var(--c-text-2); }
.tree-node.depth-4 .tn-row1 { font-weight: 400; color: var(--c-text-2); font-size: 13px; }

.tree-detail { min-width: 0; }
.breadcrumb { font-size: 12px; color: var(--c-text-2); margin-bottom: 12px; }
.breadcrumb a { color: var(--c-primary); cursor: pointer; text-decoration: none; }
.breadcrumb a:hover { text-decoration: underline; }
.breadcrumb .sep { margin: 0 4px; color: var(--c-text-3); }
.breadcrumb .current { color: var(--c-text-1); font-weight: 600; }

.food-card {
  background: linear-gradient(135deg, var(--c-primary-soft), #f5faff);
  border: 1px solid var(--c-primary-2);
  border-radius: var(--r-md);
  padding: 14px 18px;
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 14px;
}
.food-card .icon {
  width: 44px; height: 44px; border-radius: 10px;
  background: white; border: 1px solid var(--c-border);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}
.food-card .name-cn { font-size: 18px; font-weight: 600; color: var(--c-primary); }
.food-card .name-en { font-size: 12px; color: var(--c-text-2); margin-top: 2px; }
.food-card .meta { margin-left: auto; display: flex; gap: 10px; }
.food-card .meta-card {
  background: white; border: 1px solid var(--c-border);
  border-radius: var(--r-sm); padding: 6px 12px; text-align: center; min-width: 70px;
}
.food-card .meta-card .label { font-size: 10px; color: var(--c-text-3); }
.food-card .meta-card .num { font-size: 16px; font-weight: 600; color: var(--c-primary); }

.level-block {
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  margin-bottom: 14px;
  overflow: hidden;
  box-shadow: var(--shadow-soft);
}
.level-block.self-level { border-color: var(--c-tree-sel-border); border-left: 3px solid var(--c-tree-sel-border); }
.level-header {
  background: #f4f7fa;
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--c-text-1);
  border-bottom: 1px solid var(--c-border);
  display: flex; align-items: center; gap: 8px;
}
.level-block.self-level .level-header { background: var(--c-tree-sel); color: var(--c-text-1); }
.level-header .level-tag { font-size: 10px; padding: 2px 8px; border-radius: 8px; background: var(--c-primary-soft); color: var(--c-primary); font-weight: 400; }
.level-block.self-level .level-tag { background: var(--c-tree-sel-border); color: white; }
.level-header .count-tag { margin-left: auto; font-size: 11px; color: var(--c-text-3); font-weight: 400; }

table.lvl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.lvl th { background: #fafbfc; padding: 8px 12px; text-align: left; font-weight: 600; color: var(--c-text-2); border-bottom: 1px solid var(--c-border); font-size: 11.5px; }
table.lvl td { padding: 8px 12px; border-bottom: 1px solid var(--c-border); color: var(--c-text-1); }
table.lvl tr:last-child td { border-bottom: none; }
table.lvl tr:hover td { background: #fafbfc; }
table.lvl td.contaminant-cell { font-weight: 600; color: var(--c-primary); white-space: nowrap; }
table.lvl td.symbol { color: var(--c-text-3); font-size: 11px; }
table.lvl td.food-cell { color: var(--c-text-2); font-size: 12px; }
table.lvl td.limit-cell { font-weight: 600; color: var(--c-high); white-space: nowrap; font-family: "SF Mono", Consolas, monospace; }
table.lvl td.limit-cell .limit-label { font-size: 10px; color: var(--c-text-3); font-weight: 400; display: block; }
table.lvl td.limit-cell .limit-main { font-weight: 600; color: var(--c-high); }
table.lvl td.unit-cell { font-size: 11px; color: var(--c-text-3); white-space: nowrap; }
table.lvl td.method-cell { font-size: 11.5px; color: var(--c-text-2); }
table.lvl td.remark-cell { font-size: 11.5px; color: var(--c-text-2); font-style: italic; }

.tree-empty { color: var(--c-text-3); font-size: 13px; padding: 60px 20px; text-align: center; }
.tree-empty .emoji { font-size: 48px; display: block; margin-bottom: 8px; opacity: 0.4; }
.tree-empty .hint-text { font-size: 12px; color: var(--c-text-3); margin-top: 8px; }

.tree-actions { display: flex; gap: 8px; align-items: center; padding: 0 0 12px; }
.tree-actions .hint { font-size: 12px; color: var(--c-text-3); margin-left: auto; }

@media (max-width: 720px) {
  .container { padding: 0 4px; }
  .section { padding: 14px 14px; }
  table.results { font-size: 12px; }
  table.results th, table.results td { padding: 7px 8px; }
  .input-row input { min-width: 100%; }
  header.brand { flex-wrap: wrap; }
  .tree-view { grid-template-columns: 1fr; }
  .tree-side { position: static; max-height: 50vh; }
  .food-card { flex-direction: column; align-items: flex-start; }
  .food-card .meta { margin-left: 0; }
}
/* ============= 模式 C 单 tab 单表设计 ============= */
.contam-breadcrumb { background: var(--c-primary); color: #fff; padding: 10px 16px; font-size: 14px; font-weight: 500; border-radius: var(--r-sm); margin-bottom: 12px; }
.contam-breadcrumb .bc-cur { color: #fff; font-weight: 700; }

.contam-tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0; }
.ctab { padding: 7px 12px; border-radius: 16px; border: 1px solid var(--c-border); background: var(--c-surface); cursor: pointer; font-size: 12.5px; color: var(--c-text-2); transition: all 0.15s; user-select: none; display: flex; align-items: center; gap: 4px; }
.ctab:hover { border-color: var(--c-primary); color: var(--c-primary); background: var(--c-primary-soft); }
.ctab.selected { background: var(--c-primary); color: #fff; border-color: var(--c-primary); font-weight: 600; }
.ctab.selected .ctab-sym { color: rgba(255,255,255,.85); }
.ctab .ctab-sym { color: var(--c-text-3); font-size: 11px; }
.ctab .ctab-count { font-size: 10.5px; opacity: 0.7; margin-left: 2px; background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 8px; }
.ctab.selected .ctab-count { background: rgba(255,255,255,0.2); opacity: 1; }

.contam-detail { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 8px; overflow: hidden; }
.contam-detail-header { padding: 14px 18px; border-bottom: 1px solid var(--c-border); background: var(--c-primary-soft); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.contam-detail-name { font-size: 18px; font-weight: 600; color: var(--c-primary); }
.contam-detail-meta { font-size: 12px; color: var(--c-text-3); }

table.ctable { width: 100%; border-collapse: collapse; font-size: 13px; }

<body>
<div class="container">

<header class="brand">
  <div class="logo">污染物</div>
  <div class="brand-text">
    <div class="brand-title"><span class="zh">GB 2762-2025 食品中污染物限量查询</span><span class="en" id="standardEn">Contaminant Limits in Food</span></div>
    <div class="subtitle" id="subtitle">加载中…</div>
  </div>
  <a class="back" href="./toolbox.html">← 返回工具箱</a>
  <div class="ver" id="verTag">v1.0</div>
</header>

<!-- ============== 统一单页面:污染物 tab + 食品分类树 + 详情 ============== -->
<div id="pageRoot">

<!-- 顶部污染物 tab 行 -->
<section class="section contam-section" style="padding: 12px 16px; margin-bottom: 0;">
  <div class="contam-tabs" id="contamTabs">
    <!-- JS 渲染:15 个污染物 tab(表1铅 / 表2镉 / 表3总汞 / 表3甲基汞 / 表4总砷 / 表4无机砷 / 表5锡 / ...) -->
  </div>
</section>

<!-- 食品分类树 + 详情视图 -->
<div class="tree-view" id="treeView">
  <aside class="tree-side" id="treeSide">
    <h3>
      <span>食品分类目录</span>
      <span class="tree-toggle" id="treeToggle" title="折叠左侧目录" onclick="toggleSidePanel()"><span class="arrow">◀</span><span class="label">折叠</span></span>
    </h3>
    <div class="tree-subtitle">点击分类或具体食品名称即可查看对应限量</div>
    <div class="tree-toolbar" id="treeToolbar">
      <button onclick="expandAllTree()" title="展开所有 24 个大类">⇕ 全部展开</button>
      <button onclick="collapseAllTree()" title="只保留 24 个大类(折叠所有子节点)">⇕ 全部收起</button>
      <span class="summary" id="treeSummary">—</span>
    </div>
    <div class="tree-search">
      <input type="text" id="treeSearchInput" placeholder="搜索食品名,例如 玉米、稻谷" autocomplete="off">
    </div>
    <div id="treeList"></div>
    <div class="tree-collapsed-rail">
      <button onclick="toggleSidePanel()" title="展开目录">▶</button>
      <button onclick="expandAllTree()" title="全部展开">⇕</button>
    </div>
  </aside>
  <div class="tree-detail">
    <div class="breadcrumb" id="breadcrumb">— 请在左侧选择食品 —</div>
    <div id="treeContent">
      <div class="tree-empty">
        <span class="emoji">🌽</span>
        <div>请在左侧树形目录中点击任意食品,<br>或在上方选择污染物开始查询</div>
        <div class="hint-text">支持双向查询:按食品查所有污染物,或按污染物查所有食品,<br>两者都选可查看交叉结果</div>
      </div>
    </div>
    <div id="treeFootnotes"></div>
  </div>
</div>

<footer style="text-align:center; color:var(--c-text-3); font-size:11px; padding: 20px 0 10px;">
  数据源:GB 2762-2025《食品安全国家标准 食品中污染物限量》
  <br>本工具仅供食品行业风险评估参考,不替代官方标准全文
</footer>

</div>

<script>
const DATA_URL = './data/gb2762/gb2762_2025.json?t=' + Date.now();
let DATA = null;
let currentMode = null;

// ========== 工具(必须在最前面,供模式 C 等后续函数引用) ==========
function escapeHTML(s) {
  if (s === undefined || s === null) return '';
  return String(s).replace(/[<>&"']/g, c => ({ '<':'<', '>':'>', '&':'&', '"':'"', "'":'&#39;' }[c]));
}
function escapeAttr(s) {
  return String(s).replace(/'/g, "\\'").replace(/"/g, '&quot;');
}


// 模式 C:按污染物查询 (单 tab 切换) - 单选当前污染物
// selectedContam 格式: 'table_no' (普通) 或 'table_no-sub' (双列: 甲基汞/无机砷/硝酸盐)
let selectedContam = null;

// 树形浏览模式状态
let treeSelected = null; // {path: [name1, name2, ...]}  当前选中节点的全路径
let expandedPaths = new Set(); // 已展开的节点路径(序列化字符串)
let sideCollapsed = false;     // 左侧面板是否折叠

function toggleSidePanel() {
  sideCollapsed = !sideCollapsed;
  const side = document.getElementById('treeSide');
  const view = document.getElementById('treeView');
  const toggle = document.getElementById('treeToggle');
  if (sideCollapsed) {
    side.classList.add('collapsed');
    view.classList.add('side-collapsed');
    toggle.innerHTML = '<span class="arrow">▶</span><span class="label">展开</span>';
    toggle.title = '展开左侧目录';
  } else {
    side.classList.remove('collapsed');
    view.classList.remove('side-collapsed');
    toggle.innerHTML = '<span class="arrow">◀</span><span class="label">折叠</span>';
    toggle.title = '折叠左侧目录';
  }
  try { localStorage.setItem('jianyu_sideCollapsed', sideCollapsed ? '1' : '0'); } catch (e) {}
}

function expandAllTree() {
  const tree = (DATA.appendix_a1 && DATA.appendix_a1.tree) || [];
  function walk(nodes) {
    nodes.forEach(n => {
      expandedPaths.add(pathKey(n.path));
      if (n.children && n.children.length) walk(n.children);
    });
  }
  walk(tree);
  renderTree(document.getElementById('treeSearchInput').value);
}

function collapseAllTree() {
  // 只保留 L1(24 大类)处于展开状态,其余收起
  const tree = (DATA.appendix_a1 && DATA.appendix_a1.tree) || [];
  expandedPaths = new Set();
  tree.forEach(n => expandedPaths.add(pathKey(n.path)));
  renderTree(document.getElementById('treeSearchInput').value);
}

function refreshTreeSummary() {
  const tree = (DATA.appendix_a1 && DATA.appendix_a1.tree) || [];
  const flat = flattenTree(tree);
  const total = flat.length;
  const l1Count = tree.length;
  const sum = document.getElementById('treeSummary');
  if (sum) sum.textContent = `共 ${l1Count} 大类 / ${total} 项`;
}

// ========== 数据加载 ==========
const DATA_URLS = [
  // 本地服务器/同源(优先,速度快)
  './data/gb2762/gb2762_2025.json',
  // GitHub Pages 兜底(任何环境都能访问,只要有网)
  'https://5678hub.github.io/jianyu/data/gb2762/gb2762_2025.json',
];
async function loadData() {
  const tried = [];
  // 每个 URL 8 秒超时(fetch 没有内置超时,卡死会无限等)
  for (const url of DATA_URLS) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    try {
      const res = await fetch(url + '?t=' + Date.now(), { signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) { tried.push(`${url} → HTTP ${res.status}`); continue; }
      DATA = await res.json();
      DATA._dataSource = url;
      updateSubtitle();
      renderTree();
      renderContamTabs();
      refreshTreeSummary();
      renderDetail();
      return;
    } catch (e) {
      clearTimeout(timer);
      const msg = (e && e.name === 'AbortError') ? 'timeout 8s' : (e.message || e);
      tried.push(`${url} → ${msg}`);
    }
  }
  document.getElementById('subtitle').innerHTML =
    '❌ 加载失败:所有数据源均不可访问<br>' +
    '<span style="font-size:11px;color:var(--c-text-3);font-weight:normal;">' +
    tried.join('<br>') + '</span>';
  console.error('All data sources failed:', tried);
}

// 恢复左侧面板折叠状态
try {
  if (localStorage.getItem('jianyu_sideCollapsed') === '1') {
    sideCollapsed = true;
    const side = document.getElementById('treeSide');
    const view = document.getElementById('treeView');
    const toggle = document.getElementById('treeToggle');
    if (side && view && toggle) {
      side.classList.add('collapsed');
      view.classList.add('side-collapsed');
      toggle.innerHTML = '<span class="arrow">▶</span><span class="label">展开</span>';
      toggle.title = '展开左侧目录';
    }
  }
} catch (e) {}

function updateSubtitle() {
  const std = DATA.standard;
  // v8: 统计按 has_limit/sub_has_limit 过滤（与渲染一致，"—" 项不计入）
  const total = DATA.contaminants.reduce((s, c) => {
    return s + (c.items || []).filter(it => {
      const ml = (it.limit_value || '').toString().trim();
      const sl = (it.sub_value  || '').toString().trim();
      const hm = (it.has_limit === true) || (ml && ml !== '—' && it.has_limit === undefined);
      const hs = (it.sub_has_limit === true) || (sl && sl !== '—' && it.sub_has_limit === undefined);
      return hm || hs;
    }).length;
  }, 0);
  const bigCount = (DATA.appendix_a1.tree || []).length;
  const src = DATA._dataSource || '';
  const srcLabel = src.startsWith('http') ? 'GitHub' : '本地';
  document.getElementById('subtitle').innerHTML =
    `${std.code} · 发布 ${std.publish_date} · 实施 ${std.implement_date} · 12 种污染物 · ${total} 条限量 · 附录 A.1 含 ${bigCount} 大类 ` +
    `<span style="color:var(--c-text-3);font-size:11px;">[${srcLabel}]</span>`;
  document.getElementById('verTag').textContent = `${total} 条`;
}

// ========== 模式切换 ==========
// ========== 模式 A:按食品类别浏览 ==========

// 食物 emoji 映射(浅趣味)
const FOOD_EMOJI = {
  '谷物': '🌾', '稻谷': '🌾', '玉米': '🌽', '小麦': '🌾', '大麦': '🌾',
  '水果': '🍎', '蔬菜': '🥬', '食用菌': '🍄', '豆类': '🫘', '坚果': '🥜',
  '肉类': '🥩', '水产': '🐟', '乳': '🥛', '蛋': '🥚', '油脂': '🛢️',
  '调味料': '🧂', '饮料': '🥤', '酒': '🍶', '食糖': '🍬', '淀粉': '🥔',
  '焙烤': '🍞', '糖果': '🍫', '茶叶': '🍵', '咖啡': '☕',
  '特殊膳食用食品': '🍼', '婴幼儿配方食品': '🍼',
};

// 树工具:把 path 数组序列化用于 Set/Map key / data-attr
function pathKey(path) {
  // v9: 归一化 - 去掉括号、冒号、逗号、空白的半全角差异
  // (A.1 校对表录入时偶有半角标点 vs JSON 全角标点,统一归一后才能匹配)
  const norm = (s) => (s || '')
    .replace(/[()（）\[\]【】]/g, '')   // 所有括号
    .replace(/:/g, '：')              // 半角冒号 → 全角
    .replace(/,/g, '，')              // 半角逗号 → 全角
    .replace(/\s+/g, '')              // 空白
    .replace(/\|/g, '||');            // 转义分隔符
  return path.map(norm).join('|');
}
function pathAttr(path) { return path.map(s => s.replace(/"/g, '&quot;').replace(/'/g, '&#39;')).join(' › '); }

// JSON 用于 HTML 双引号属性时,必须把内部的 " 转义成 &quot;
// 否则浏览器解析属性时会被提前关闭,onclick 直接 SyntaxError
function jsonInAttr(obj) {
  return JSON.stringify(obj).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
}

// 索引: path-key → {items: [], depth: n}
let itemIndex = null;
function buildItemIndex() {
  if (itemIndex) return itemIndex;
  itemIndex = new Map();
  // 先建好树节点全集(所有叶子节点的 path)
  const tree = (DATA.appendix_a1 && DATA.appendix_a1.tree) || [];

  // 用 uniqueKey 在每条 path 内去重(不是全局去重):同一 (table_no, food, limit, sub,
  // remark, note) 在同一个 path 内只保留首次出现。但跨 path 的同 key 保留——例如
  // 汞表 5 个 L2 都用合并 food 字段"生乳、巴氏杀菌乳、...,发酵乳",但 a1_l2 不同,
  // 它们应该各自注册到自己的 idx["乳及乳制品 > 生乳"] / idx["乳及乳制品 > 发酵乳"]。
  // 全局去重会错误跳过 4 条,导致发酵乳看不到汞 0.01、铅 0.04 等。
  DATA.contaminants.forEach(c => {
    c.items.forEach(it => {
      const enriched = { ...it,
        _contaminant: c.contaminant, _symbol: c.symbol, _unit: c.unit,
        _table_no: c.table_no, _footnotes: c.footnotes,
        _inspection_method: c.inspection_method, _rules: c.inspection_method_rules
      };
      const paths = matchItemToPaths(it, tree);
      paths.forEach(pk => {
        if (!itemIndex.has(pk)) itemIndex.set(pk, []);
        const arr = itemIndex.get(pk);
        // path 内 dedup
        const dupKey = [c.table_no, it.food || '', it.limit_value || '', it.sub_value || '',
                        it.main_remark || '', it.sub_remark || '', it.note || ''].join('\x01');
        if (arr.some(x => x._dupKey === dupKey)) return;
        enriched._dupKey = dupKey;
        arr.push(enriched);
      });
    });
  });
  return itemIndex;
}

// 把一个 item 关联到 A.1 树的某些节点路径
// 优先用 v6.1 的 a1_l1/l2/l3/l4 精确路径(由 gen_xlsx_full.py 渲染时填充)
function matchItemToPaths(item, tree) {
  // v9: 归一化 - 去掉所有括号(包括方括号【】)、冒号、逗号、空白半全角差异
  // (A.1 校对表 vs JSON vs PDF 三方标点不一致,统一归一后才能匹配)
  const norm = (s) => (s || '')
    .replace(/[()（）\[\]【】]/g, '')
    .replace(/:/g, '：')
    .replace(/,/g, '，')
    .replace(/\s+/g, '')
    .toLowerCase();

  // 1) 优先用 item.a1_l1/l2/l3/l4 精确路径
  const a1Path = [item.a1_l1, item.a1_l2, item.a1_l3, item.a1_l4]
    .filter(Boolean)
    .filter((v, i, arr) => i === 0 || v !== arr[i - 1]); // 去掉连续重复

  // v11: 只注册到 a1_path 最深一层(不递归祖先)
  //   选 L1 只看 L1 专属 items;L2/L3 子节点限量在各子节点查看
  //   这与"树状浏览"的直觉一致,也避免选 L1 时混入子级数据
  const matchedPaths = [];

  if (a1Path.length > 0) {
    function walkExact(nodes, path, idx) {
      if (idx >= a1Path.length) return;
      const target = norm(a1Path[idx]);
      let matchedHere = false;
      for (const n of nodes) {
        if (norm(n.name) === target) {
          matchedHere = true;
          const curPath = path.concat([n.name]);
          if (idx < a1Path.length - 1 && n.children) {
            walkExact(n.children, curPath, idx + 1);
          } else {
            // 到达 a1_path 最深一层 → 注册到这里
            matchedPaths.push(pathKey(curPath));
          }
        }
      }
      // Fallback: 走到 a1Path 末层(深层层)但当前节点 children 为空/没有匹配的子节点
      //   例: A.1 tree 里"花粉" children=[] 但 item.a1_l3="油菜花粉"——tree 没列子节点
      //   此时应注册到当前 path(走的最远一层),而不是丢失
      if (!matchedHere && idx === a1Path.length - 1 && path.length > 0) {
        matchedPaths.push(pathKey(path));
      }
    }
    walkExact(tree, [], 0);
  }

  // 2) 兜底:用 category_a1 找 L1 节点(老字段,兼容)
  if (matchedPaths.length === 0) {
    const catA1 = item.category_a1 || item.category || '';
    const catNorm = norm(catA1);
    if (catNorm) {
      for (const n of tree) {
        if (norm(n.name) === catNorm) {
          matchedPaths.push(pathKey([n.name]));
          break;
        }
      }
    }
  }

  // 3) 都不行:关联到 food 匹配最深的节点(L1 兜底)
  if (matchedPaths.length === 0) {
    function fallback(nodes, path) {
      for (const n of nodes) {
        const curPath = path.concat([n.name]);
        if (path.length === 0 && norm(n.name) === norm(a1Path[0] || '')) {
          matchedPaths.push(pathKey(curPath));
          return true;
        }
        if (n.children && fallback(n.children, curPath)) return true;
      }
      return false;
    }
    fallback(tree, []);
  }
  return matchedPaths;
}

// 聚合 path 下所有 L2+L3+L4 子节点的 items(用于 L1 无直接 idx 命中时)
//   用 (food, limit_value, sub_value, main_remark, sub_remark, note, table_no) 作 key 去重
function aggregateDescendants(path) {
  const idx = buildItemIndex();
  // 在 tree 中找到 path 对应节点
  const tree = (DATA.appendix_a1 && DATA.appendix_a1.tree) || [];
  function findNode(nodes, p) {
    if (p.length === 0) return null;
    const [head, ...rest] = p;
    for (const n of nodes) {
      if (n.name === head) {
        if (rest.length === 0) return n;
        if (n.children) return findNode(n.children, rest);
      }
    }
    return null;
  }
  const node = findNode(tree, path);
  if (!node) return [];

  // 递归遍历 node 的所有 descendants,收集所有 idx[deepest_path] 的 items
  const seen = new Set();
  const out = [];
  function visit(n, curPath) {
    const curPk = pathKey(curPath);
    const items = idx.get(curPk);
    if (items) {
      items.forEach(it => {
        const k = (it.food || '') + '\x01' + (it.limit_value || '') + '\x01' +
                  (it.sub_value || '') + '\x01' + (it.main_remark || '') + '\x01' +
                  (it.sub_remark || '') + '\x01' + (it.note || '') + '\x01' +
                  (it._table_no || '');
        if (!seen.has(k)) {
          seen.add(k);
          out.push({ ...it, _viaSub: curPath[curPath.length - 1] });
        }
      });
    }
    if (n.children) {
      n.children.forEach(c => visit(c, curPath.concat([c.name])));
    }
  }
  // 先访问 node 自己(包括 node 自身的 idx 命中,例如 L1 "食品" 直接挂载的锡表 item)
  visit(node, path);
  // 再访问 children
  if (node.children) {
    node.children.forEach(c => visit(c, path.concat([c.name])));
  }
  return out;
}

// 统计某个 path 节点(及其子树)的 item 总数
function countForPath(path) {
  const s = statsForPath(path);
  return s.limits;
}

// 返回 {items, limits}:items = 节点(含子树)下不同 item 数,limits = 限量条数总和
// v11: statsForPath 自动累加所有子树(选 L1 时可见子级限量统计)
//     但渲染时只显示当前节点的 items(不递归展开)
function statsForPath(path) {
  const idx = buildItemIndex();
  const targetKey = pathKey(path);
  let list = idx.get(targetKey) || [];
  // 无 direct items(典型 L1: 豆类/蔬菜/水果/藻类/坚果/食糖/淀粉/可可/特殊膳/其他类)
  // 自动 fallback 到子级聚合,与详情页保持一致
  if (list.length === 0 && path.length === 1) {
    list = aggregateDescendants(path);
  }
  let limits = 0;
  for (const it of list) {
    const ml = (it.limit_value || '').toString().trim();
    const sl = (it.sub_value  || '').toString().trim();
    const hm = (it.has_limit === true) || (ml && ml !== '—' && it.has_limit === undefined);
    const hs = (it.sub_has_limit === true) || (sl && sl !== '—' && it.sub_has_limit === undefined);
    limits += (hm ? 1 : 0) + (hs ? 1 : 0);
  }
  // 食品项数 = unique food 数量(聚合后按完整 food 字段去重)
  const foodCount = new Set(list.map(it => it.food || '')).size;
  return { items: foodCount, limits };
}

// 递归展平树节点
function flattenTree(tree) {
  const out = [];
  function walk(nodes, path, depth) {
    nodes.forEach(n => {
      const p = path.concat([n.name]);
      out.push({ name: n.name, path: p, depth, hasChildren: !!(n.children && n.children.length) });
      if (n.children) walk(n.children, p, depth + 1);
    });
  }
  walk(tree, [], 1);
  return out;
}

function renderTree(filterKw) {
  const tree = (DATA.appendix_a1 && DATA.appendix_a1.tree) || [];
  const wrap = document.getElementById('treeList');
  const kw = (filterKw || '').trim().toLowerCase();

  let nodes = flattenTree(tree);
  if (kw) {
    // 同时匹配自身 + 任一祖先含 kw
    const ancestors = new Map(); // name → set of ancestors' names
    function buildAncestors(nodes, parents) {
      nodes.forEach(n => {
        ancestors.set(n.name, new Set(parents));
        if (n.children) buildAncestors(n.children, parents.concat([n.name]));
      });
    }
    buildAncestors(tree, []);
    nodes = nodes.filter(n => {
      if (n.name.toLowerCase().includes(kw)) return true;
      const ans = ancestors.get(n.name) || new Set();
      for (const a of ans) if (a.toLowerCase().includes(kw)) return true;
      return false;
    });
  }

  if (nodes.length === 0) {
    wrap.innerHTML = '<div style="font-size:12px;color:var(--c-text-3);padding:14px 8px;text-align:center;">无匹配食品</div>';
    return;
  }

  // 渲染:默认只显示已展开父节点的子节点;过滤模式下强制显示命中节点链
  const showAll = !!kw;
  // 展开的 pk 集合(用于决定子节点是否显示)
  const openKeys = new Set();
  if (showAll) {
    // 过滤模式:把所有命中节点的祖先链加入 openKeys
    nodes.forEach(n => {
      for (let i = 1; i <= n.path.length; i++) {
        openKeys.add(pathKey(n.path.slice(0, i)));
      }
    });
  } else {
    expandedPaths.forEach(pk => openKeys.add(pk));
  }
  let html = '';
  nodes.forEach(n => {
    const pk = pathKey(n.path);
    // 决定是否渲染:默认渲染所有 L1;L2+ 必须父链全部展开
    const parentPath = n.path.slice(0, -1);
    const parentOpen = parentPath.length === 0 || openKeys.has(pathKey(parentPath));
    if (!showAll && !parentOpen) return; // 父节点未展开,不渲染
    const isOpen = showAll || expandedPaths.has(pk);
    const isSelected = treeSelected && pathKey(treeSelected.path) === pk;
    const stats = statsForPath(n.path);
    const isLeaf = !n.hasChildren;
    const arrowCls = n.hasChildren ? 'has' : 'empty';
    const arrowCh = n.hasChildren ? (isOpen ? '−' : '+') : '·';
    const arrowOnClick = n.hasChildren
      ? `event.stopPropagation(); toggleTreeNode(${jsonInAttr(n.path)});`
      : '';
    const indent = (n.depth - 1) * 14;
    // 格式化数字:加千分位
    const fmt = (n) => (n || 0).toLocaleString('en-US');
    const statsLine = isLeaf
      ? `<div class="tn-row2">${fmt(stats.limits)} 条限量</div>`
      : `<div class="tn-row2">${fmt(stats.items)} 个食品项 <span class="dot">·</span> ${fmt(stats.limits)} 条限量</div>`;
    html += `<div class="tree-node depth-${Math.min(n.depth,4)}${isSelected ? ' selected' : ''}"
              style="padding-left:${4 + indent}px;"
              data-pk="${escapeAttr(pk)}"
              onclick="selectTreeNode(${jsonInAttr(n.path)})">
      <div class="tn-row1">
        <span class="tn-arrow ${arrowCls}" onclick="${arrowOnClick}">${arrowCh}</span>
        <span class="tn-name" title="${escapeAttr(n.name)}">${escapeHTML(n.name)}</span>
      </div>
      ${statsLine}
    </div>`;
  });
  wrap.innerHTML = html;
}

function toggleTreeNode(path) {
  const pk = pathKey(path);
  if (expandedPaths.has(pk)) expandedPaths.delete(pk);
  else expandedPaths.add(pk);
  renderTree(document.getElementById('treeSearchInput').value);
}

function selectTreeNode(path) {
  // 再点当前选中的节点 → 取消选中(toggle 行为)
  if (treeSelected && pathKey(treeSelected.path) === pathKey(path)) {
    treeSelected = null;
  } else {
    treeSelected = { path: path.slice() };
    // 自动展开所有祖先
    for (let i = 1; i <= path.length; i++) {
      expandedPaths.add(pathKey(path.slice(0, i)));
    }
  }
  renderTree(document.getElementById('treeSearchInput').value);
  renderDetail();
}

function renderTreeDetail() {
  const idx = buildItemIndex();
  const bc = document.getElementById('breadcrumb');
  const tc = document.getElementById('treeContent');
  const fn = document.getElementById('treeFootnotes');

  if (!treeSelected) {
    bc.innerHTML = '— 请在左侧选择食品 —';
    tc.innerHTML = `<div class="tree-empty"><span class="emoji">🌽</span><div>请在左侧树形目录中点击任意食品</div><div class="hint-text">将显示该食品的所有污染物限量,<br>以及上级 / 上上级分类的限量要求</div></div>`;
    fn.innerHTML = '';
    return;
  }

  const path = treeSelected.path;
  const nodeName = path[path.length - 1];
  const bigName = path[0]; // L1

  // 面包屑
  let bcHtml = `<a onclick="treeSelected=null;renderTree();renderTreeDetail();">食品类别</a>`;
  path.forEach((p, i) => {
    const pPath = path.slice(0, i + 1);
    if (i === path.length - 1) {
      bcHtml += `<span class="sep">›</span><span class="current">${escapeHTML(p)}</span>`;
    } else {
      bcHtml += `<span class="sep">›</span><a onclick="selectTreeNode(${jsonInAttr(pPath)})">${escapeHTML(p)}</a>`;
    }
  });
  bc.innerHTML = bcHtml;

  // 找节点对应的 items
  const pk = pathKey(path);

  // === 本级 / 最近有数据的上一级 ===
  // 沿 path 向上找第一个 idx 命中的节点(优先自身,其次父、祖父…)
  let primaryKey = pk, primaryName = nodeName, primaryLevel = '本级';
  let primaryItems = null;
  if (idx.has(pk)) {
    // 本级有命中,直接取
    primaryItems = (idx.get(pk) || []).map(x => ({ ...x, _viaSub: primaryName }));
  } else if (path.length > 1) {
    // 沿 path 向上找第一个 idx 命中的节点
    for (let i = path.length - 2; i >= 0; i--) {
      const pkUp = pathKey(path.slice(0, i + 1));
      if (idx.has(pkUp)) {
        primaryKey = pkUp;
        primaryName = path[i];
        primaryLevel = '上一级';
        break;
      }
    }
    if (primaryKey !== pk) {
      primaryItems = (idx.get(primaryKey) || []).map(x => ({ ...x, _viaSub: primaryName }));
    }
  }

  // === L1 节点无 idx 命中时的子级聚合 ===
  // 10 个 L1(水果/蔬菜/豆类/藻类/坚果/食糖/淀粉/可可/特殊膳/其他类)没有直接挂载 items
  // v11 idx 只注册到 deepest,L1 没注册;展示时聚合其下所有 L2+L3+L4 的 items
  if (primaryItems === null) {
    primaryName = nodeName;
    primaryLevel = '本级聚合';
    primaryItems = aggregateDescendants(path);
  }

  // === 二级分类:path 倒数第二层(二级分类)下所有命中 items(扣除 primaryItems) ===
  // 选中三级或更深时,展示其所属的二级分类(如:选"芸薹类蔬菜"→ 展示"新鲜蔬菜"下的其他限量)
  // 选中 L1/L2 时,path 没有"倒数第二层",这块跳过
  let bigOther = [];
  let secondName = null; // 二级分类名(L2),仅用于本块标题
  if (path.length >= 3) {
    secondName = path[path.length - 2];
    const l2Key = pathKey(path.slice(0, path.length - 1));
    if (idx.has(l2Key)) {
      idx.get(l2Key).forEach(it => bigOther.push({ ...it, _viaSub: secondName }));
    }
  }
  function itemKey(it) {
    return (it._table_no || '') + '|' + (it.food || '') + '|' + ((it.limits && it.limits[0] && it.limits[0].value) || it.limit || '') + '|' + (it._viaSub || '');
  }
  const primKey = new Set(primaryItems.map(itemKey));
  bigOther = bigOther.filter(it => !primKey.has(itemKey(it)));

  // 卡片
  const emoji = pickEmoji(nodeName);
  let html = `<div class="food-card">
    <div class="icon">${emoji}</div>
    <div>
      <div class="name-cn">${escapeHTML(nodeName)}</div>
      <div class="name-en">GB 2762-2025 · ${escapeHTML(bigName)} · 第 ${path.length} 级</div>
    </div>
    <div class="meta">
      <div class="meta-card"><div class="label">适用污染物</div><div class="num">${primaryItems.length}</div></div>
      <div class="meta-card"><div class="label">所属大类</div><div class="num" style="font-size:13px;">${escapeHTML(bigName)}</div></div>
    </div>
  </div>`;

  const levels = [];
  if (primaryItems.length > 0) {
    levels.push({ tag: primaryLevel, label: `${primaryName} 的污染物限量要求`, isSelf: primaryLevel === '本级', items: primaryItems });
  }
  if (bigOther.length > 0 && secondName) {
    levels.push({ tag: '二级分类', label: `${secondName} 的其他限量`, isSelf: false, items: bigOther });
  }

  if (levels.length === 0) {
    html += `<div class="tree-empty"><span class="emoji">📭</span><div>该食品暂无污染物限量记录</div><div class="hint-text">可能未在 GB 2762-2025 中单独规定<br>适用 GB 2762 通用原则</div></div>`;
  } else {
    levels.forEach(lv => {
      const cls = lv.isSelf ? 'level-block self-level' : 'level-block';
      html += `<div class="${cls}">
        <div class="level-header">
          <span>${escapeHTML(lv.label)}</span>
          <span class="level-tag">${lv.tag}</span>
          <span class="count-tag">${lv.items.length} 条</span>
        </div>
        ${renderLimitTable(lv.items, lv.isSelf, nodeName, bigName)}
      </div>`;
    });
  }

  tc.innerHTML = html;
  fn.innerHTML = renderFootnotesFor(primaryItems, primaryName, bigName);
}

function pickEmoji(name) {
  for (const k of Object.keys(FOOD_EMOJI)) {
    if (name.includes(k)) return FOOD_EMOJI[k];
  }
  return '🥗';
}

function pickMethod(rules, currentFood, currentBig) {
  if (!rules || rules.length === 0) return null;
  // 先匹配 non-default rules:食品名或大类名命中 apply
  for (const r of rules) {
    if (r.is_default) continue;
    if (currentFood && currentFood.includes(r.apply)) return r.method;
    if (currentBig && currentBig.includes(r.apply)) return r.method;
  }
  // fallback 到 default
  const def = rules.find(r => r.is_default);
  return def ? def.method : (rules[0] && rules[0].method);
}

function renderLimitTable(items, isSelf, nodeName, bigName) {
  let html = '<table class="lvl"><thead><tr>';
  html += '<th>污染物中文名称</th><th>元素符号</th><th>食品中文名称</th><th>限量要求</th><th>单位</th><th>检验方法</th><th>备注</th>';
  html += '</tr></thead><tbody>';
  // v8: 把每个 item 拆成 0~2 行（main + sub 限量各自独立成行）
  // 表8 亚硝酸盐/硝酸盐双行、表4 总砷/无机砷双行都走这里
  // 用 JSON 的 has_limit / sub_has_limit 字段精确判断：limit_value="—" 直接跳过（用户视角不显示未制定项）
  const expanded = [];
  items.forEach(it => {
    const mainVal = (it.limit_value || '').toString().trim();
    const subVal  = (it.sub_value  || '').toString().trim();
    // 脚注字母优先级：main_remark > sub_remark > note（兼容不同表结构）
    const mainLetter = (it.main_remark || '').toString().trim();
    const subLetter  = (it.sub_remark  || '').toString().trim();
    const simpleLetter = (it.note || '').toString().trim();
    const noteLetter = mainLetter || subLetter || simpleLetter;
    it._noteLetter = noteLetter; // 缓存供渲染备注列
    // v8: 优先用 JSON has_limit 字段（兼容老数据时回退到 limit_value !== '—' 判断）
    const hasMain = (it.has_limit === true) || (mainVal && mainVal !== '—' && it.has_limit === undefined);
    const hasSub  = (it.sub_has_limit === true) || (subVal && subVal !== '—' && it.sub_has_limit === undefined);
    if (hasMain) {
      expanded.push({
        ...it,
        _rowName: it.main_label || it._contaminant,
        _rowLimit: mainVal,
        _rowMod:   it.limit_modifier || '',
        _rowRemark: it.main_remark || '',
        _rowSymbol: it._symbol || ''
      });
    }
    if (hasSub) {
      expanded.push({
        ...it,
        _rowName: it.sub_label || it._contaminant,
        _rowLimit: subVal,
        _rowMod:   it.sub_modifier || '',
        _rowRemark: it.sub_remark || '',
        _rowSymbol: it._symbol || ''
      });
    }
    // 双"—" 的项（主副均未制定限量）直接跳过，不显示 — 行
    // 旧逻辑会显示"—"行（通类母项），v8 改为：未制定的不出现
  });

  expanded.forEach(it => {
    const ctxFood = isSelf ? (nodeName || it.food || '') : (it._viaSub || nodeName || it.food || '');
    const ctxBig = bigName || '';
    const method = pickMethod(it._rules, ctxFood, ctxBig) || it._inspection_method || '';
    // 限量值 = 数字 + 修饰(若有)
    const limitText = it._rowMod ? `${it._rowLimit} ${it._rowMod}` : (it._rowLimit === '—' ? '—' : `${it._rowLimit} mg/kg`);
    // 备注 = 修饰脚注（_rowRemark 来自 main_remark/sub_remark；note 兼容 simple 表）
    const remarkText = it._rowRemark || '';
    // 脚注字母 badge：优先 _noteLetter（main_remark/sub_remark/note 兼容）
    const noteLetter = (it._noteLetter || '').toString().trim();
    let remarkHtml = '';
    if (noteLetter) {
      remarkHtml += `<span class="fn-mark inline" title="脚注 ${escapeAttr(noteLetter)}">${escapeHTML(noteLetter)}</span>`;
    }
    if (remarkText) {
      remarkHtml += `<span class="remark-text">${escapeHTML(remarkText)}</span>`;
    }

    html += '<tr>';
    html += `<td class="contaminant-cell">${escapeHTML(it._rowName)}</td>`;
    html += `<td class="symbol">${escapeHTML(it._rowSymbol)}</td>`;
    const foodName = isSelf ? (it.food || nodeName) : (it._viaSub ? `${it._viaSub}:` + (it.food || '') : (it.food || ''));
    html += `<td class="food-cell">${escapeHTML(foodName)}</td>`;
    html += `<td class="limit-cell"><span class="limit-main">${escapeHTML(limitText)}</span></td>`;
    html += `<td class="unit-cell">${escapeHTML(it._unit || '')}</td>`;
    html += `<td class="method-cell">${escapeHTML(method)}</td>`;
    html += `<td class="remark-cell">${remarkHtml}</td>`;
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

function renderFootnotesFor(items, nodeName, bigName) {
  // 脚注块：仅展示当前 items 引用过的脚注（避免堆太多不相关的）
  const seenFn = new Map();
  const referenced = new Set();
  items.forEach(it => {
    const letter = (it._noteLetter || it.note || '').toString().trim();
    if (letter) referenced.add(letter);
    if (it._footnotes) it._footnotes.forEach(f => {
      // 兼容 {label, text} 和 {mark, text} 两种字段命名
      const k = f.label || f.mark;
      if (k && f.text && !seenFn.has(k + '|' + f.text)) seenFn.set(k + '|' + f.text, { key: k, text: f.text });
    });
  });
  let html = '';
  if (seenFn.size > 0 && referenced.size > 0) {
    html += '<div class="footnote-block"><div class="fn-title">脚注说明</div>';
    seenFn.forEach(f => {
      if (referenced.has(f.key)) {
        html += `<div class="fn-item"><span class="fn-mark">${f.key}</span>${escapeHTML(f.text)}</div>`;
      }
    });
    html += '</div>';
  }
  // 检验方法块:智能匹配当前食品的适用方法
  const methodSet = new Set();
  items.forEach(it => {
    const m = pickMethod(it._rules, nodeName, bigName) || it._inspection_method;
    if (m) methodSet.add(m);
  });
  if (methodSet.size > 0) {
    html += '<div class="method-block"><div class="m-title">📋 检验方法</div>';
    methodSet.forEach(m => {
      const ctxLabel = nodeName || bigName;
      html += `<div style="margin: 4px 0;"><span style="font-size:10px;color:var(--c-text-3);">适用:</span> ${escapeHTML(ctxLabel)} → ${escapeHTML(m)}</div>`;
    });
    html += '</div>';
  }
  return html;
}

function jumpToBig(big) {
  // 直接跳到 L1 节点
  selectTreeNode([big]);
}

// ========== 模式 C:按污染物查询(单 tab 单表) ==========

  { key: "1",     table_no: 1,  label: "铅",            sym: "Pb",     sub: null },
  { key: "2",     table_no: 2,  label: "镉",            sym: "Cd",     sub: null },
  { key: "3",     table_no: 3,  label: "总汞",          sym: "Hg",     sub: null },
  { key: "3-sub", table_no: 3,  label: "甲基汞",        sym: "Hg",     sub: "甲基汞" },
  { key: "4",     table_no: 4,  label: "总砷",          sym: "As",     sub: null },
  { key: "4-sub", table_no: 4,  label: "无机砷",        sym: "As",     sub: "无机砷" },
  { key: "5",     table_no: 5,  label: "锡",            sym: "Sn",     sub: null },
  { key: "6",     table_no: 6,  label: "镍",            sym: "Ni",     sub: null },
  { key: "7",     table_no: 7,  label: "铬",            sym: "Cr",     sub: null },
  { key: "8",     table_no: 8,  label: "亚硝酸盐",      sym: "NO2-",   sub: null },
  { key: "8-sub", table_no: 8,  label: "硝酸盐",        sym: "NO3-",   sub: "硝酸盐" },
  { key: "9",     table_no: 9,  label: "苯并[a]芘",     sym: "BaP",    sub: null },
  { key: "10",    table_no: 10, label: "N-二甲基亚硝胺", sym: "NDMA",  sub: null },
  { key: "11",    table_no: 11, label: "多氯联苯",      sym: "PCBs",   sub: null },
  { key: "12",    table_no: 12, label: "3-氯-1,2-丙二醇", sym: "3-MCPD", sub: null },
];

// 按污染物 + sub 取 items(主列 或 子列)
// 去重:JSON 把路径树展平成多条,但 PDF 原表中同一食品类别(名称)只对应一条限量,
//     按 (food, limit_value, sub_value) 三键去重可消除因路径展开产生的重复行
function dedupByFoodKey(items) {
  const seen = new Set();
  return items.filter(it => {
    const key = (it.food || '').trim() + '\x01' + (it.limit_value || '') + '\x01' + (it.sub_value || '');
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function getContamItems(tab) {
  if (!DATA || !DATA.contaminants) return [];
  const c = DATA.contaminants.find(x => x.table_no === tab.table_no);
  if (!c) return [];
  const all = c.items || [];
  if (!tab.sub) {
    // 主列(limit_value + has_limit)且不为空
    // 表 3 汞: 必须 pollutant === "总汞"(否则甲基汞项会被误算进来)
    if (tab.table_no === 3) {
      const filtered = all.filter(it => {
        const p = (it.pollutant || '');
        if (!(p === "总汞" || p.indexOf("总汞") === 0)) return false;
        const ml = (it.limit_value || '').toString().trim();
        return it.has_limit === true || ((ml && ml !== '—') && it.has_limit === undefined);
      });
      return dedupByFoodKey(filtered);
    }
    const filtered = all.filter(it => {
      const ml = (it.limit_value || '').toString().trim();
      const has = it.has_limit === true || (ml && ml !== '—' && it.has_limit === undefined);
      return has;
    });
    return dedupByFoodKey(filtered);
  }
  // 子列(注:JSON 字段值带 ' a' 后缀表示带脚注,需 startsWith 匹配)
  const filtered = all.filter(it => {
    if (tab.sub === "甲基汞") {
      const p = (it.pollutant || '');
      if (!(p === "甲基汞" || p.indexOf("甲基汞") === 0)) return false;
      const ml = (it.limit_value || '').toString().trim();
      return it.has_limit === true || ((ml && ml !== '—') && it.has_limit === undefined);
    }
    if (tab.sub === "无机砷") {
      const sl = (it.sub_value || '').toString().trim();
      const lab = (it.sub_label || '');
      const matchLabel = lab === "无机砷" || lab.indexOf("无机砷") === 0;
      const hasVal = it.sub_has_limit === true || ((sl && sl !== '—') && it.sub_has_limit === undefined);
      return matchLabel && hasVal;
    }
    if (tab.sub === "硝酸盐") {
      const sl = (it.sub_value || '').toString().trim();
      const lab = (it.sub_label || '');
      const matchLabel = lab === "硝酸盐" || lab.indexOf("硝酸盐") === 0;
      const hasVal = it.sub_has_limit === true || ((sl && sl !== '—') && it.sub_has_limit === undefined);
      return matchLabel && hasVal;
    }
    return false;
  });
  return dedupByFoodKey(filtered);
}

function renderContamTabs() {
  const wrap = document.getElementById('contamTabs');
  if (!wrap || !DATA) return;
  wrap.innerHTML = CONTAM_TABS.map(t => {
    const cnt = getContamItems(t).length;
    const sel = (t.key === selectedContam) ? ' selected' : '';
    return '<div class="ctab' + sel + '" data-key="' + t.key + '" onclick="selectContam(' + "'" + t.key + "'" + ')">' +
      '<span class="ctab-name">' + escapeHTML(t.label) + '</span>' +
      '<span class="ctab-sym">' + escapeHTML(t.sym) + '</span>' +
      '<span class="ctab-count">' + cnt + '</span>' +
    '</div>';
  }).join('');
}

function selectContam(key) {
  // 再点选中的 tab → 取消选中
  selectedContam = (selectedContam === key) ? null : key;
  renderContamTabs();
  renderDetail();
}

// ========== 统一渲染入口 ==========
// state = { treeSelected, contamSelected } 四种 case:
//   1) 都空 → 空状态
//   2) 只 tree → 食品视图(renderTreeDetail 已修 L1 聚合)
//   3) 只 contam → 污染物视图(全食品)
//   4) 都选 → 交叉过滤(只显示该食品该污染物)
function renderDetail() {
  const bc = document.getElementById('breadcrumb');
  const tc = document.getElementById('treeContent');
  const fn = document.getElementById('treeFootnotes');

  // 共同状态:清空污染物视图用过的元素(避免污染)
  const cTable = document.getElementById('contamTableWrap');
  if (cTable) cTable.innerHTML = '';
  const cDetail = document.querySelector('.contam-detail');
  if (cDetail) cDetail.style.display = 'none';

  // === 状态 1: 都空 → 空状态 ===
  if (!treeSelected && !selectedContam) {
    bc.innerHTML = '— 请选择食品或污染物开始查询 —';
    tc.innerHTML = '<div class="tree-empty"><span class="emoji">🔍</span><div>请在左侧树形目录中点击食品,<br>或在上方选择污染物开始查询</div><div class="hint-text">支持双向查询:按食品查所有污染物,<br>或按污染物查所有食品,两者都选可查看交叉结果</div></div>';
    fn.innerHTML = '';
    return;
  }

  // === 状态 2: 只选食品 → renderTreeDetail ===
  if (treeSelected && !selectedContam) {
    // 直接复用原 renderTreeDetail(它已经处理 breadcrumb + treeContent + treeFootnotes)
    renderTreeDetail();
    return;
  }

  // === 状态 3 / 4: 选了污染物(可能也选了食品) → 污染物视图 ===
  const tab = CONTAM_TABS.find(t => t.key === selectedContam);
  if (!tab) return;
  const c = DATA.contaminants.find(x => x.table_no === tab.table_no);
  if (!c) return;
  let items = getContamItems(tab);

  // 状态 4: 同时选了食品 → 交叉过滤
  let crossFilter = null;
  if (treeSelected && items.length) {
    crossFilter = treeSelected;
    // 从 idx 中取该食品的全部 items,过滤出属于当前污染物 sub 的项
    const idx = buildItemIndex();
    const pk = pathKey(treeSelected.path);
    let foodItems = idx.get(pk);
    if (!foodItems) {
      // 向上回退 / 聚合子级
      let found = false;
      for (let i = treeSelected.path.length - 2; i >= 0; i--) {
        const upk = pathKey(treeSelected.path.slice(0, i + 1));
        if (idx.has(upk)) { foodItems = idx.get(upk); found = true; break; }
      }
      if (!found) foodItems = aggregateDescendants(treeSelected.path);
    }
    // foodItems 的 contaminant 是 c.contaminant(可能含 " a" 后缀等),先按 _table_no 过滤
    const filtered = (foodItems || []).filter(it => it._table_no === c.table_no);
    // 再按 tab.sub 过滤(总汞/甲基汞、总砷/无机砷、亚硝酸盐/硝酸盐)
    if (tab.sub === '甲基汞') {
      items = filtered.filter(it => (it.pollutant || '').startsWith('甲基汞') || it.pollutant === '甲基汞');
    } else if (tab.sub === '无机砷') {
      items = filtered.filter(it => {
        const lab = it.sub_label || '';
        return (lab === '无机砷' || lab.indexOf('无机砷') === 0) &&
               ((it.sub_value || '').toString().trim() !== '' && it.sub_value !== '—');
      });
    } else if (tab.sub === '硝酸盐') {
      items = filtered.filter(it => {
        const lab = it.sub_label || '';
        return (lab === '硝酸盐' || lab.indexOf('硝酸盐') === 0) &&
               ((it.sub_value || '').toString().trim() !== '' && it.sub_value !== '—');
      });
    } else if (tab.table_no === 3) {
      // 总汞(主列):pollutant 以"总汞"开头
      items = filtered.filter(it => (it.pollutant || '').startsWith('总汞'));
    } else if (tab.table_no === 4) {
      // 总砷(主列):pollutant 是"总砷"或不含"无机砷"的
      items = filtered.filter(it => {
        const p = it.pollutant || '';
        return (p === '总砷' || p.indexOf('总砷') === 0);
      });
    } else if (tab.table_no === 8) {
      // 亚硝酸盐(主列):sub_label 是亚硝酸盐或主限量是亚硝酸盐
      items = filtered.filter(it => {
        const lab = it.sub_label || it.main_label || '';
        return lab.indexOf('亚硝酸盐') >= 0;
      });
    } else {
      items = filtered;
    }
    // 还要 dedup
    const seen = new Set();
    items = items.filter(it => {
      const k = (it.food || '') + '\x01' + (it.limit_value || '') + '\x01' + (it.sub_value || '');
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }

  // 面包屑:显示食品分类(若有)+ 污染物
  const crumbParts = ['<a onclick="treeSelected=null;selectedContam=null;renderTree();renderContamTabs();renderDetail();">查询</a>'];
  if (treeSelected) {
    const p = treeSelected.path;
    p.forEach((seg, i) => {
      const pPath = p.slice(0, i + 1);
      crumbParts.push('<span class="sep">›</span><a onclick="selectTreeNode(' + jsonInAttr(pPath) + ')">' + escapeHTML(seg) + '</a>');
    });
  }
  crumbParts.push('<span class="sep">›</span><span class="current">' + escapeHTML(tab.label) + '</span>');
  bc.innerHTML = crumbParts.join('');

  // 渲染到 treeContent
  renderContamDetail(tab, items, tc);
}

function renderContamDetail(tab, items, targetEl) {
  if (!tab || !DATA || !targetEl) return;
  const c = DATA.contaminants.find(x => x.table_no === tab.table_no);
  if (!c) return;

  // 标题卡
  const emoji = '☢️';
  let html = '<div class="food-card contam-card">' +
    '<div class="icon">' + emoji + '</div>' +
    '<div>' +
      '<div class="name-cn">' + escapeHTML(tab.label) + '</div>' +
      '<div class="name-en">GB 2762-2025 · 表 ' + tab.table_no + ' · ' + escapeHTML(c.full_name || tab.label) + '</div>' +
    '</div>' +
    '<div class="meta">' +
      '<div class="meta-card"><div class="label">限量条数</div><div class="num">' + items.length + '</div></div>' +
      '<div class="meta-card"><div class="label">元素符号</div><div class="num" style="font-size:13px;">' + escapeHTML(tab.sym) + '</div></div>' +
    '</div>' +
  '</div>';

  if (!items.length) {
    html += '<div style="padding:40px;text-align:center;color:var(--c-text-3);">该污染物暂无食品限量数据</div>';
    targetEl.innerHTML = html;
    const fnE0 = document.getElementById('treeFootnotes');
    if (fnE0) fnE0.innerHTML = '';
    return;
  }

  // 准备脚注字典(用于展开备注列)
  const footnoteDict = {};
  (c.footnotes || []).forEach(fn => { if (fn && fn.label) footnoteDict[fn.label] = fn.text || ''; });

  html += '<div class="level-block self-level">' +
    '<div class="level-header">' +
      '<span>' + escapeHTML(tab.label) + ' 的所有食品限量要求</span>' +
      '<span class="level-tag">本级</span>' +
      '<span class="count-tag">' + items.length + ' 条</span>' +
    '</div>' +
    '<table class="ctable"><thead><tr>' +
      '<th class="col-food">食品中文名称</th>' +
      '<th class="col-limit">限量要求</th>' +
      '<th class="col-method">检验方法</th>' +
      '<th class="col-note">备注</th>' +
    '</tr></thead><tbody>';
  items.forEach(it => {
    const foodName = it.food || '';
    const a1Path = [it.a1_l1, it.a1_l2, it.a1_l3, it.a1_l4].filter(x => x && String(x).trim());
    const path = a1Path.join(' › ');

    let limitVal = '', limitModif = '', limitUnit = it.unit || c.unit || '';
    let noteKey = '';

    if (tab.sub === '甲基汞') {
      limitVal = (it.limit_value || '').toString();
      limitModif = it.modif || '';
      noteKey = it.note || '';
    } else if (tab.sub) {
      limitVal = (it.sub_value || '').toString();
      limitModif = it.sub_modif || '';
      noteKey = it.sub_remark || it.remark || '';
    } else {
      limitVal = (it.limit_value || '').toString();
      limitModif = it.limit_modifier || '';
      noteKey = it.note || it.main_remark || '';
    }

    const limitDisp = limitVal
      ? (limitModif || (limitVal !== '—' ? '≤' : '')) + limitVal + (limitVal !== '—' && limitUnit ? limitUnit : '')
      : '—';

    let method = c.inspection_method || it.inspection_method || '—';

    const noteList = [];
    noteKey.split(/[,，]/).forEach(k => {
      const trimmed = k.trim();
      if (!trimmed) return;
      const txt = footnoteDict[trimmed];
      if (txt) noteList.push('[' + trimmed + '] ' + txt);
      else noteList.push(trimmed);
    });
    const noteDisp = noteList.length ? noteList.join('<br>') : '—';
    const noteDispForTitle = noteList.length ? noteList.join(' | ') : '';

    html += '<tr>' +
      '<td class="col-food" title="' + escapeAttr(path) + '">' + escapeHTML(foodName || '—') + '</td>' +
      '<td class="col-limit">' + escapeHTML(limitDisp) + '</td>' +
      '<td class="col-method">' + escapeHTML(method) + '</td>' +
      '<td class="col-note" title="' + escapeAttr(noteDispForTitle) + '">' + noteDisp + '</td>' +
    '</tr>';
  });
  html += '</tbody></table></div>';

  targetEl.innerHTML = html;

  // 脚注(污染物全名 + 脚注)
  const fnEl = document.getElementById('treeFootnotes');
  if (fnEl) {
    const parts = [];
    if (c.full_name) parts.push('完整名:' + c.full_name);
    if (c.unit) parts.push('单位:' + c.unit);
    if (c.footnotes) parts.push('脚注:' + c.footnotes);
    if (parts.length) fnEl.innerHTML = '<div class="contam-foot">' + parts.map(escapeHTML).join(' · ') + '</div>';
    else fnEl.innerHTML = '';
  }
}

// 渲染单条 item 到单行(用于交叉过滤视图)
function renderContamRow(it, tab, c, footnoteDict) {
  let limitVal = '', limitModif = '', limitUnit = it.unit || c.unit || '';
  let noteKey = '';

  if (tab.sub === '甲基汞') {
    limitVal = (it.limit_value || '').toString();
    limitModif = it.modif || '';
    noteKey = it.note || '';
  } else if (tab.sub) {
    limitVal = (it.sub_value || '').toString();
    limitModif = it.sub_modif || '';
    noteKey = it.sub_remark || it.remark || '';
  } else {
    limitVal = (it.limit_value || '').toString();
    limitModif = it.limit_modifier || '';
    noteKey = it.note || it.main_remark || '';
  }

  const limitDisp = limitVal
    ? (limitModif || (limitVal !== '—' ? '≤' : '')) + limitVal + (limitVal !== '—' && limitUnit ? limitUnit : '')
    : '—';

  let method = c.inspection_method || it.inspection_method || '—';

  const noteList = [];
  noteKey.split(/[,，]/).forEach(k => {
    const trimmed = k.trim();
    if (!trimmed) return;
    const txt = footnoteDict[trimmed];
    if (txt) noteList.push('[' + trimmed + '] ' + txt);
    else noteList.push(trimmed);
  });
  const noteDisp = noteList.length ? noteList.join('<br>') : '—';
  const noteDispForTitle = noteList.length ? noteList.join(' | ') : '';

  return '<tr>' +
    '<td class="col-food" title="' + escapeAttr([it.a1_l1, it.a1_l2, it.a1_l3, it.a1_l4].filter(Boolean).join(' › ')) + '">' + escapeHTML(it.food || '—') + '</td>' +
    '<td class="col-limit">' + escapeHTML(limitDisp) + '</td>' +
    '<td class="col-method">' + escapeHTML(method) + '</td>' +
    '<td class="col-note" title="' + escapeAttr(noteDispForTitle) + '">' + noteDisp + '</td>' +
  '</tr>';
}



// ========== 启动 ==========
document.addEventListener('DOMContentLoaded', () => {
  loadData();
  document.getElementById('treeSearchInput').addEventListener('input', e => {
    renderTree(e.target.value);
  });
});
</script>
