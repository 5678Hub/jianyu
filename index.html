<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>jianyu · 食品抽检风险查询</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231a365d'/><text x='32' y='44' font-family='Arial,sans-serif' font-size='30' font-weight='600' fill='white' text-anchor='middle'>JY</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a365d">
<style>
:root {
  --c-bg: #f6f8fb;
  --c-surface: #ffffff;
  --c-border: #e6ebf1;
  --c-border-strong: #d0d7e0;
  --c-text-1: #1a2332;
  --c-text-2: #5d6d7e;
  --c-text-3: #95a5a6;
  --c-primary: #1a365d;
  --c-primary-2: #2c5282;
  --c-primary-soft: #ebf2fa;
  --c-accent: #8e44ad;
  --c-accent-soft: #f5edf7;
  --c-high: #c62828;
  --c-high-soft: #ffebee;
  --c-mid: #e65100;
  --c-mid-soft: #fff3e0;
  --c-warn: #f57f17;
  --c-warn-soft: #fffde7;
  --c-ok: #2e7d32;
  --c-ok-soft: #e8f5e9;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --shadow-soft: 0 1px 2px rgba(20, 30, 50, 0.04), 0 0 1px rgba(20, 30, 50, 0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--c-bg); }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; color: var(--c-text-1); padding: 24px 16px; line-height: 1.6; font-size: 14px; -webkit-font-smoothing: antialiased; }
.container { max-width: 980px; margin: 0 auto; }

header.brand { display: flex; align-items: center; gap: 14px; padding: 6px 4px 20px; border-bottom: 1px solid var(--c-border); margin-bottom: 22px; }
header.brand .logo { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--c-primary-2), var(--c-primary)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 18px; letter-spacing: -0.5px; box-shadow: var(--shadow-soft); flex-shrink: 0; }
header.brand .brand-text { flex: 1; min-width: 0; }
header.brand .brand-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
header.brand .brand-title .zh { font-size: 18px; font-weight: 600; color: var(--c-text-1); letter-spacing: 0.3px; }
header.brand .subtitle { font-size: 12px; color: var(--c-text-2); margin-top: 6px; }
header.brand .ver { font-size: 11px; color: var(--c-text-2); padding: 5px 12px; background: var(--c-primary-soft); border-radius: 14px; font-weight: 500; letter-spacing: 0.3px; flex-shrink: 0; }

.section { background: var(--c-surface); border-radius: var(--r-md); padding: 18px 22px; margin-bottom: 14px; border: 1px solid var(--c-border); box-shadow: var(--shadow-soft); }
.section-title { font-size: 13px; font-weight: 600; color: var(--c-text-1); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.section-title .hint { font-size: 12px; color: var(--c-text-3); font-weight: normal; }

input[type="text"] { width: 100%; padding: 10px 14px; border: 1px solid var(--c-border-strong); border-radius: var(--r-sm); font-size: 14px; outline: none; transition: border-color 0.15s, box-shadow 0.15s; background: #fafbfc; color: var(--c-text-1); }
input[type="text"]:focus { border-color: var(--c-primary-2); background: white; box-shadow: 0 0 0 3px rgba(44, 82, 130, 0.1); }
.input-row { display: flex; gap: 8px; align-items: center; }
.input-row input { flex: 1; }
button { background: white; border: 1px solid var(--c-border-strong); border-radius: var(--r-sm); padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--c-text-2); transition: all 0.15s; font-family: inherit; }
button:hover { background: var(--c-primary-soft); border-color: var(--c-primary-2); color: var(--c-primary); }
button.primary { background: var(--c-primary-2); color: white; border-color: var(--c-primary-2); }
button.primary:hover { background: var(--c-primary); border-color: var(--c-primary); }

.cat-search { margin-bottom: 12px; }
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-height: 360px; overflow-y: auto; padding: 4px; }
.cat-card { padding: 10px 12px; background: #fafbfc; border: 1px solid var(--c-border); border-radius: var(--r-sm); cursor: pointer; transition: all 0.15s; font-size: 13px; line-height: 1.35; color: var(--c-text-1); }
.cat-card:hover { background: var(--c-primary-soft); border-color: var(--c-primary-2); transform: translateY(-1px); }
.cat-card.selected { background: var(--c-primary-soft); border-color: var(--c-primary-2); box-shadow: 0 0 0 2px rgba(44, 82, 130, 0.15); color: var(--c-primary); font-weight: 500; }
.cat-card.disabled { opacity: 0.4; cursor: not-allowed; background: #f5f5f5; }
.cat-card .cat-no { color: var(--c-text-3); font-size: 11px; margin-right: 4px; }
.cat-card.selected .cat-no { color: var(--c-primary-2); }

.empty-tip { color: var(--c-text-3); font-size: 12px; padding: 8px 0; }

.result-empty { background: var(--c-surface); border-radius: var(--r-md); padding: 32px 20px; text-align: center; color: var(--c-text-3); font-size: 14px; border: 1px solid var(--c-border); }
.result-empty .icon { font-size: 36px; margin-bottom: 10px; opacity: 0.4; }

.card { background: var(--c-surface); border-radius: var(--r-md); padding: 18px 22px; margin-bottom: 12px; border: 1px solid var(--c-border); box-shadow: var(--shadow-soft); }
.card-title { font-size: 13px; font-weight: 600; color: var(--c-text-1); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.card-title .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: auto; }

.risk-high { background: var(--c-high-soft); color: var(--c-high); }
.risk-mid-high { background: var(--c-mid-soft); color: var(--c-mid); }
.risk-mid { background: var(--c-warn-soft); color: var(--c-warn); }
.risk-low { background: #e3f2fd; color: #1565c0; }
.risk-none { background: var(--c-ok-soft); color: var(--c-ok); }
.risk-cat { background: var(--c-accent-soft); color: var(--c-accent); }

.risk-block { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: var(--r-md); margin-bottom: 14px; border-left: 4px solid transparent; }
.risk-block.risk-high, .card.risk-high-block { border-left-color: var(--c-high); }
.risk-block.risk-mid-high, .card.risk-mid-high-block { border-left-color: var(--c-mid); }
.risk-block.risk-mid, .card.risk-mid-block { border-left-color: var(--c-warn); }
.risk-block.risk-low, .card.risk-low-block { border-left-color: #1565c0; }
.risk-block.risk-none, .card.risk-none-block { border-left-color: var(--c-ok); }
.risk-block .emoji { font-size: 30px; }
.risk-block .label { font-size: 18px; font-weight: 600; }
.risk-block .score { font-size: 12px; opacity: 0.75; margin-top: 2px; }

.meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.meta-tag { background: #f0f3f6; padding: 4px 10px; border-radius: 14px; font-size: 12px; color: var(--c-text-2); }
.meta-tag strong { color: var(--c-text-1); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--c-border); }
th { background: #fafbfc; color: var(--c-text-2); font-weight: 600; font-size: 12px; }
tr.detail-row { background: #fafbfc; font-size: 12px; }
tr.detail-row td { padding: 6px 10px; color: var(--c-text-2); }
.bad { color: var(--c-high); font-weight: 600; }
.muted { color: var(--c-text-3); }

ul.checklist { list-style: none; }
ul.checklist li { padding: 6px 0; padding-left: 18px; position: relative; font-size: 13px; }
ul.checklist li::before { content: "□"; position: absolute; left: 0; color: var(--c-text-2); }
ul.checklist li.must::before { content: "⛔"; color: var(--c-high); }
ul.checklist li.warn::before { content: "⚠"; color: var(--c-mid); }
ul.checklist li strong { color: var(--c-high); }

.tip-source { font-size: 12px; color: var(--c-text-2); background: #f0f4f8; padding: 8px 12px; border-left: 3px solid #5d8aa8; border-radius: 4px; margin-bottom: 14px; line-height: 1.6; }
.tip-block { margin-bottom: 14px; padding: 10px 0; border-top: 1px dashed #e0e0e0; }
.tip-block:first-of-type { border-top: none; }
.tip-block-title { font-size: 13px; font-weight: 600; color: var(--c-text-1); margin-bottom: 8px; }
.tip-std-row { margin-top: 8px; font-size: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tip-std-label { color: var(--c-text-2); font-weight: 600; margin-right: 4px; }
.tip-freq { display: inline-block; margin-left: 8px; padding: 1px 6px; background: var(--c-mid-soft); color: var(--c-mid); border-radius: 3px; font-size: 11px; font-weight: 600; }
.tip-sev { display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 600; color: #fff; background: var(--c-high); }
ul.checklist li.warn .tip-sev { background: var(--c-mid); }

.cat-checkbox { display: inline-block; margin-right: 6px; font-size: 14px; vertical-align: middle; }

.risk-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
.risk-badge.risk-high { background: var(--c-high); color: #fff; }
.risk-badge.risk-mid-high { background: var(--c-mid); color: #fff; }
.risk-badge.risk-mid { background: var(--c-warn); color: #fff; }
.risk-badge.risk-low { background: var(--c-ok); color: #fff; }
.risk-badge.risk-none { background: #bdc3c7; color: #fff; }

.tip-cats { display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 3px; font-size: 10px; background: #ecf0f1; color: var(--c-text-2); }

.gb-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.gb-chip { background: var(--c-primary-soft); color: var(--c-primary); padding: 3px 8px; border-radius: 10px; font-size: 12px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.actions button { font-size: 12px; padding: 6px 12px; }

.summary-row { display: grid; grid-template-columns: 1.4fr 1.6fr 0.6fr 0.7fr 0.7fr 28px; align-items: center; gap: 10px; padding: 10px 12px; background: #fafbfc; border: 1px solid var(--c-border); border-radius: var(--r-sm); cursor: pointer; transition: all 0.15s; font-size: 13px; }
.summary-row:hover { background: var(--c-primary-soft); border-color: var(--c-primary-2); }
.summary-row.open { background: #fff; border-color: var(--c-primary-2); box-shadow: 0 0 0 2px rgba(44, 82, 130, 0.1); }
.summary-row .sev { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; text-align: center; }
.summary-row .sev.sev-high { background: var(--c-high-soft); color: var(--c-high); }
.summary-row .sev.sev-mid { background: var(--c-mid-soft); color: var(--c-mid); }
.summary-row .sev.sev-low { background: #e3f2fd; color: #1565c0; }
.summary-row .arrow { color: var(--c-text-2); font-size: 14px; text-align: right; transition: transform 0.15s; }
.summary-row.open .arrow { transform: rotate(90deg); color: var(--c-primary-2); }
.detail-block { margin-top: 6px; padding: 8px 12px 12px 24px; background: #fafbfc; border: 1px solid var(--c-border); border-top: none; border-radius: 0 0 var(--r-sm) var(--r-sm); }
.detail-block table { background: white; border-radius: 6px; }
.result-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; padding: 10px 14px; background: #f0f3f6; border-radius: var(--r-sm); font-size: 12px; color: var(--c-text-2); }
.result-toolbar .crumb { color: var(--c-text-1); font-weight: 600; }
.result-toolbar .crumb .key { color: var(--c-text-2); font-weight: normal; }

.dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.dashboard-cell { background: #fafbfc; padding: 12px 14px; border-radius: var(--r-sm); border-left: 3px solid var(--c-border-strong); font-size: 12px; transition: all 0.15s; }
.dashboard-cell:hover { background: white; border-left-color: var(--c-primary-2); transform: translateY(-1px); box-shadow: var(--shadow-soft); }
.dashboard-cell .cat-name { font-weight: 600; color: var(--c-text-1); font-size: 13px; margin-bottom: 4px; }
.dashboard-cell .cat-stats { color: var(--c-text-2); }
.dashboard-cell.has-data { border-left-color: var(--c-high); background: var(--c-high-soft); }
.dashboard-cell.has-data .cat-stats { color: var(--c-high); }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--c-text-1); color: white; padding: 10px 20px; border-radius: var(--r-sm); font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 999; box-shadow: 0 4px 12px rgba(20, 30, 50, 0.15); }
.toast.show { opacity: 0.95; }

footer.brand-foot { text-align: center; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--c-border); font-size: 11px; color: var(--c-text-3); }

@media (max-width: 600px) {
  body { padding: 14px 10px; }
  .section { padding: 14px 14px; }
  .cat-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .dashboard-grid { grid-template-columns: 1fr; }
  .risk-block { padding: 12px; }
  .risk-block .emoji { font-size: 26px; }
  .risk-block .label { font-size: 16px; }
  header.brand .ver { display: none; }
}
</style>
</head>
<body>
<div class="container">

<header class="brand">
  <div class="logo">JY</div>
  <div class="brand-text">
    <div class="brand-title"><span class="zh">食品抽检风险查询</span></div>
    <div class="subtitle" id="subtitle">加载中…</div>
  </div>
  <div class="ver">v3.4 · 2026</div>
</header>

<section class="section">
  <div class="section-title">
    食品名 <span class="hint">（可单独查，留空则按已选类别查）</span>
  </div>
  <div class="input-row">
    <input type="text" id="foodInput" placeholder="如：鸡蛋、桂圆、虾爬子、小笼包…（自由输入，无需从列表选）" autocomplete="off">
    <button onclick="clearFood()">清空</button>
  </div>
  <div class="input-row" style="margin-top:6px;">
    <input type="text" id="prodInput" placeholder="或按标称生产单位查（如：双汇、雨润、蒙牛、庆云县…）—— 可与食品名同时填写" autocomplete="off" style="border-color:#8e44ad;">
    <button onclick="clearProd()">清空</button>
  </div>
</section>

<section class="section">
  <div class="section-title">
    类别 <span class="hint" id="catHint">（可单独查，留空则按已输入食品名查）</span>
    <button onclick="toggleMultiMode()" id="multiModeBtn" style="margin-left:auto;font-size:12px;padding:4px 10px;border:1px solid #3498db;background:#fff;color:#3498db;border-radius:4px;cursor:pointer;">📌 多选对比</button>
    <button onclick="clearCategory()" style="margin-left:8px;font-size:12px;">清空已选</button>
  </div>
  <div id="multiHint" style="display:none;font-size:12px;color:#2980b9;background:#ebf5fb;padding:6px 12px;border-radius:4px;margin-bottom:8px;">
    ✨ 多选模式：勾选多个类别后 → 合并看综合风险 + 共同不合格项目 + 综合索证建议（适合横向比较同类目供应商）
  </div>
  <input type="text" id="catSearch" class="cat-search" placeholder="🔍 过滤 39 大类（输入关键字）" autocomplete="off">
  <div class="cat-grid" id="catGrid"></div>
</section>

<section class="section" id="subcatSection" style="display:none;">
  <div class="section-title">
    细类 <span class="hint" id="subcatHint">（按 2026 实施细则二级分类）</span>
    <button onclick="clearSubcategory()" id="clearSubBtn" style="margin-left:auto;font-size:12px;display:none;">清空细类</button>
  </div>
  <input type="text" id="subcatSearch" class="cat-search" placeholder="🔍 过滤细类" autocomplete="off" style="display:none;">
  <div class="cat-grid" id="subcatGrid"></div>
  <div class="empty-tip" id="noSubcatTip" style="display:none;">本大类在 2026 实施细则中不分细类</div>
</section>

<div id="result"></div>

<footer class="brand-foot">
  © 2026 jianyu · 食品抽检风险查询工作台 · 数据源：山东/辽宁/重庆抽检公告
</footer>

</div>

<div class="toast" id="toast"></div>

<script>
const DATA_BASE = 'data/';

let state = {
  foodName: '',
  prodName: '',          // 标称生产单位（可与食品名同时填写，AND 交集）
  category: '',
  subcategory: '',
  multiSelect: false,    // 多选模式开关
  selectedCats: [],      // 多选模式下的已选类别数组
  master: null,
  categoryMap: null,
  synonyms: null,
  gbChecklist: null,
  categories2026: null,
  categoriesFull: null,  // 旧版细类骨架
  subcatChecklist: null, // 2026 细则官方检验项目表（255 张）
  subcatAliases: null,   // 品名→官方细类映射
  gbAvailableCats: new Set(),
};

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ============ 数据加载 ============
async function loadData() {
  try {
    const [master, categoryMap, synonyms, gbChecklist, categories2026, subcatChecklist, subcatAliases] = await Promise.all([
      fetch(DATA_BASE + 'master.json').then(r => r.json()),
      fetch(DATA_BASE + 'category_map.json').then(r => r.json()),
      fetch(DATA_BASE + 'synonyms.json').then(r => r.json()),
      fetch(DATA_BASE + 'current_period/gb_checklist.json').then(r => r.json()),
      fetch(DATA_BASE + 'categories_2026.json').then(r => r.json()),
      fetch(DATA_BASE + 'current_period/gb_checklist_subcat.json').then(r => r.json()),
      fetch(DATA_BASE + 'subcat_to_items.json').then(r => r.json()),
    ]);
    state.master = master;
    state.categoryMap = categoryMap;
    state.synonyms = synonyms;
    state.gbChecklist = gbChecklist;
    state.categories2026 = categories2026;
    state.subcatChecklist = subcatChecklist;
    state.subcatAliases = subcatAliases;
    // ⚠️ schema v1.1：索引只存 record_id，需要 map 才能 lookup
    state.idToRecord = Object.fromEntries((master.records || []).map(r => [r.id, r]));
    state.gbAvailableCats = new Set(
      (categories2026.categories || []).filter(c => c.available).map(c => c.name)
    );
    document.getElementById('subtitle').textContent =
      `${master.records.length} 条不合格记录 · ${Object.keys(master.by_canonical || {}).length} 个规范食品名 · 数据源：2026 实施细则 + 山东/辽宁/重庆抽检公告`;
    renderCats();
    renderSubcats();
    render();
  } catch (e) {
    console.error('加载失败:', e);
    document.getElementById('subtitle').innerHTML = '<span style="color:#c62828">数据加载失败</span>';
  }
}

// ============ 多选模式切换 ============
function toggleMultiMode() {
  state.multiSelect = !state.multiSelect;
  const btn = document.getElementById('multiModeBtn');
  const hint = document.getElementById('multiHint');
  if (state.multiSelect) {
    // 进入多选：把当前单选（若有）转入 selectedCats
    if (state.category) state.selectedCats = [state.category];
    btn.textContent = '✕ 退出多选';
    btn.style.background = '#3498db';
    btn.style.color = '#fff';
    hint.style.display = 'block';
  } else {
    // 退出多选：保留第一个作单选
    state.category = state.selectedCats[0] || '';
    state.selectedCats = [];
    btn.textContent = '📌 多选对比';
    btn.style.background = '#fff';
    btn.style.color = '#3498db';
    hint.style.display = 'none';
  }
  renderCats();
  renderSubcats();
  render();
}

// ============ 类别网格渲染 ============
function renderCats() {
  const grid = document.getElementById('catGrid');
  const cats = state.categories2026?.categories || [];
  grid.innerHTML = cats.map(c => {
    const cls = c.available ? '' : 'disabled';
    // 多选 vs 单选 的选中状态判定
    const selected = state.multiSelect
      ? (state.selectedCats.includes(c.name) ? 'selected' : '')
      : (state.category === c.name ? 'selected' : '');
    const subCount = (state.subcatChecklist?.categories?.[c.name] || []).length;
    const subHint = subCount > 0 ? ` <span style="color:#3498db;font-size:11px;">(${subCount} 细类)</span>` : '';
    const checkBox = state.multiSelect ? `<span class="cat-checkbox">${selected ? '☑' : '☐'}</span>` : '';
    return `<div class="cat-card ${cls} ${selected}" data-cat="${c.name}">
      ${checkBox}<span class="cat-no">${c.no}</span>${c.name}${subHint}
    </div>`;
  }).join('');

// ============ 查询：自动归类（仅当没指定类别时辅助用） ============
function lookupCategory(foodName) {
  if (!foodName) return null;
  const cm = state.categoryMap || {};

  // 1. 同义词精确匹配
  const synExact = (state.synonyms?.rules || []).find(r => r.raw === foodName);
  if (synExact?.canonical) {
    for (const [cat, items] of Object.entries(cm)) {
      if (cat.startsWith('_')) continue;
      if (items.includes(synExact.canonical)) {
        // 截掉细类后缀（如 "糖果制品-果脯蜜饯" -> "糖果制品"）
        const bigCat = cat.split('-')[0];
        return { category: bigCat, fullCategory: cat, canonical: synExact.canonical };
      }
    }
  }

  // 2. category_map 精确匹配
  for (const [cat, items] of Object.entries(cm)) {
    if (cat.startsWith('_')) continue;
    if (items.includes(foodName)) {
      const bigCat = cat.split('-')[0];
      return { category: bigCat, fullCategory: cat, canonical: foodName };
    }
  }

  // ⚠️ 去掉了子串匹配兜底（避免"油"→"小油菜"误归类）
  return null;
}

function lookupOfficialSubcat(foodName) {
  if (!foodName || !state.subcatAliases?.aliases) return null;
  const aliases = state.subcatAliases.aliases;
  if (aliases[foodName]) return { ...aliases[foodName], alias: foodName };
  const candidates = Object.entries(aliases)
    .filter(([alias]) => alias.length >= 2 && foodName.includes(alias))
    .sort((a,b) => b[0].length - a[0].length);
  return candidates.length ? { ...candidates[0][1], alias: candidates[0][0] } : null;
}

function autoApplyOfficialSubcat(foodName) {
  if (state.multiSelect || state.category || !foodName) return;
  const hit = lookupOfficialSubcat(foodName);
  if (!hit) return;
  state.category = hit.big_category;
  state.subcategory = hit.subcategory;
  renderCats();
  renderSubcats();
}

function renderOfficialTable(cat, sub) {

  if (!all.length) return '';
  const selected = sub ? all.filter(x => x.name === sub) : all;

  return `
    <div class="card">

      <div class="tip-source">官方来源：《食品安全监督抽检实施细则（2026年版）》；这里显示的是法定抽检细类表，不是历史不合格项目。</div>
      ${selected.map(t => `

  } else if (prod) {
  } else if (!food && cats.length === 0) {

// 按生产单位查询的可展开行（独立于通用 summary-row）
function bindProdRows() {
  document.querySelectorAll('.history-summary-row[data-toggle^="prod-"]').forEach(row => {
    if (row._prodBound) return;
    row._prodBound = true;
    const targetId = row.getAttribute('data-toggle');
    row.addEventListener('click', () => {
      const detail = document.getElementById(targetId);
      if (!detail) return;
      const open = detail.style.display !== 'none';
      detail.style.display = open ? 'none' : 'block';
      row.classList.toggle('open', !open);
    });
  });
}

// 顶部工具条（结果页头部）
function renderToolbar(food, cat, sub, recordCount) {
  if (!food && !cat) return '';
  const parts = [];
  if (food) parts.push(`<span class="crumb"><span class="key">食品：</span>${food}</span>`);
  if (cat) parts.push(`<span class="crumb"><span class="key">类别：</span>${cat}</span>`);

  return `

      <span style="font-weight:600;color:#34495e;">📄 结果页</span>

}

// 可展开的汇总行：点击 → 展开 / 收起明细
function bindExpandableRows() {
  document.querySelectorAll('.summary-row').forEach(row => {
    if (row._bound) return;
    row._bound = true;
    row.setAttribute('aria-expanded', 'false');
    const toggle = () => {
      // 明细块紧跟在汇总行后面，按相邻节点查找，避免多个卡片都从 idx=0 开始时串联到错误明细。
      const detail = row.nextElementSibling && row.nextElementSibling.classList.contains('detail-block')
        ? row.nextElementSibling
        : null;
      if (!detail) return;
      const open = detail.style.display !== 'none';
      detail.style.display = open ? 'none' : 'block';
      row.classList.toggle('open', !open);
      row.setAttribute('aria-expanded', String(!open));
    };
    row.addEventListener('click', toggle);
    row.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggle();
      }
    });
  });
}

function renderProdOnly(result, prodName) {
  const master = state.master;

  const q = prodName.toLowerCase();

    const p = (r.prod_name || '').toLowerCase();
    return p && p.includes(q);
  });
  const n = records.length;

  // 聚合：按食品名/细类/项目 分组
  const byItem = {};   // 项目 → {count, items:[], foods:Set}
  const byFood = {};   // 食品名 → {count, items:Set, cats:Set}
  const byCat = {};    // 大类 → {count, foods:Set, items:Set}
  records.forEach(r => {
    (r.failed_items || []).forEach(fi => {
      const k = fi.item;
      if (!byItem[k]) byItem[k] = {item: k, count: 0, foods: new Set(), cats: new Set()};
      byItem[k].count++;
      byItem[k].foods.add(r.food_name_raw);
      byItem[k].cats.add(r.big_category || '');

    const fk = r.food_name_raw;
    if (!byFood[fk]) byFood[fk] = {food: fk, count: 0, items: new Set(), cats: new Set(), sampleUnits: new Set()};
    byFood[fk].count++;
    (r.failed_items || []).forEach(fi => byFood[fk].items.add(fi.item));
    if (r.big_category) byFood[fk].cats.add(r.big_category);
    if (r.sampler_name) byFood[fk].sampleUnits.add(r.sampler_name);
    const ck = r.big_category || '其他';
    if (!byCat[ck]) byCat[ck] = {cat: ck, count: 0, foods: new Set(), items: new Set()};
    byCat[ck].count++;
    byCat[ck].foods.add(r.food_name_raw);
    (r.failed_items || []).forEach(fi => byCat[ck].items.add(fi.item));
  });

  const itemRows = Object.values(byItem).sort((a, b) => b.count - a.count);
  const foodRows = Object.values(byFood).sort((a, b) => b.count - a.count);

        <span class="meta-tag" style="background:#f3e5f5;color:#6a1b9a;">综合风险 <strong style="color:${riskColor};">${riskLabel}</strong></span>
        <span class="meta-tag">匹配记录 <strong>${n}</strong> 条</span>
        <span class="meta-tag">涉及食品 <strong>${foodRows.length}</strong> 类</span>
        <span class="meta-tag">涉及大类 <strong>${catRows.length}</strong> 类</span>
      </div>
      <div class="tip-source" style="background:#f3e5f5;border-left-color:#8e44ad;">
        📊 数据来源：master.json（按 prod_name 模糊匹配）；本视图仅显示该标称生产单位的历史不合格记录（不含法定检验项目，法定项目按对应食品细类查）
      </div>
    </div>

    ${n === 0 ? `
      <div class="card">
        <div class="empty-tip">⚠️ 在 ${escapeHtml(prodName)} 中未找到匹配的不合格记录</div>
        <div class="empty-tip" style="font-size:13px;color:#5d6d7e;">
          提示：① 检查单位名是否有误（部分公告中标称是"种养殖者或供货者名称"）<br>
          ② 山东/辽宁的"标称生产企业名称"经常是"/"（食用农产品类），这种情况只能查到加工食品类
        </div>
      </div>
    ` : `
      <div class="card">
        <div class="card-title">📊 按不合格项目（${itemRows.length} 项 / ${n} 次）</div>

          ${itemRows.slice(0, 15).map(r => `
            <li class="warn">
              <strong>${escapeHtml(r.item)}</strong> · ${r.count} 次 · 涉及 ${r.foods.size} 食品 / ${r.cats.size} 大类

      byItem[k].foods.add(r.food_name_raw);
      byItem[k].cats.add(r.big_category || '');

    if (!byFood[fk]) byFood[fk] = {food: fk, count: 0, items: new Set()};

    (r.failed_items || []).forEach(fi => byFood[fk].items.add(fi.item));
  });

  const itemRows = Object.values(byItem).sort((a, b) => b.count - a.count);

  let riskLabel, riskColor;

// 把抽检细则中的细类表名（去掉编号前缀）映射到 master 中使用的 sub_category 后缀。
// 例：表 6-6「碳酸饮料（汽水）」→ 「饮料-碳酸饮料」；表 11-2「速冻调理肉制品」→ 「速冻食品-速冻调理肉制品」。
function buildSubcatKeyMap() {
  const map = {};  // { '饮料-碳酸饮料': '碳酸饮料', '饮料-碳酸饮料（汽水）': '碳酸饮料（汽水）', ... }
  const sc = state.subcatChecklist;
  if (!sc?.categories) return map;
  for (const [cat, tables] of Object.entries(sc.categories)) {
    for (const t of tables || []) {
      // 同一细类名对应一个 sub_category 命名：「{大类}-{细类名}」
      const key = `${cat}-${t.name}`;
      if (!map[key]) map[key] = [];
      map[key].push(t.name);
    }
  }
  return map;
}

// 把当前选中细类解析成可用于过滤 master.records.sub_category 的键集合（兼容旧「细类名 substring」兜底）
function resolveSubcatFilterKeys(cat, subName) {
  if (!cat || !subName) return null;
  const map = buildSubcatKeyMap();
  // 1) 精确：「大类-细类名」
  const directKey = `${cat}-${subName}`;
  if (map[directKey]) return [directKey];
  // 2) 包含关系：subName 中是否带括号包裹别名（如「碳酸饮料（汽水）」→「碳酸饮料」）
  //    解析表名：去掉前缀编号后，取括号内或前一段
  const inner = subName.match(/^([^（(]+)[（(]([^)）]+)[)）]\s*$/);
  if (inner) {
    const short = inner[1].trim();
    const candKey = `${cat}-${short}`;
    if (map[candKey]) return [candKey, ...(map[directKey] || [])];
  }
  // 3) 兜底：subName 作为 sub_category 后缀（例 「碳酸饮料」 匹配 「饮料-碳酸饮料」）
  const fallback = `${cat}-${subName.replace(/^[\d.\s、]+/, '').trim()}`;
  return [fallback];
}

// 规范化食品/细类文本，用于跨分类字段匹配。
function normalizeSubcatText(value) {
  return String(value || '')
    .replace(/[（(][^）)]*[）)]/g, '')
    .replace(/[\s·、\-—_/]+/g, '')
    .trim()
    .toLowerCase();
}

// 从 category_map 找到与 2026 细则大类对应的规范食品名集合。
// master 的 sub_category 有时只有「食用农产品-鲜蛋」这样的一级后缀，
// 不能直接拿「鲜蛋-鸡蛋」去比，需要再用食品名映射兜底。
function getCategoryFoodNames(cat) {
  const names = new Set();
  for (const [key, values] of Object.entries(state.categoryMap || {})) {
    if (key === cat || key.endsWith(`-${cat}`)) {
      (Array.isArray(values) ? values : []).forEach(v => names.add(String(v).trim()));
    }
  }
  return [...names];
}

function matchesSubcategoryByFoodName(record, cat, subName) {
  const recordNames = [record.food_name_raw, record.food_name_canonical]
    .map(normalizeSubcatText)
    .filter(Boolean);
  if (!recordNames.length) return false;

  const cleaned = String(subName || '').replace(/^[\d.\s、]+/, '').trim();
  const shortName = cleaned.replace(/[（(][^）)]*[）)]\s*$/, '').trim();
  const targets = [cleaned, shortName].map(normalizeSubcatText).filter(t => t.length >= 2);

  // 直接同名：如「鲜蛋 → 鸡蛋」。
  if (targets.some(target => recordNames.includes(target))) return true;

  // 通过 category_map 的规范食品名匹配细类表名。
  const categoryNames = getCategoryFoodNames(cat);
  const matchedNames = categoryNames
    .filter(name => {
      const normalized = normalizeSubcatText(name);
      return targets.some(target => normalized === target || normalized.includes(target) || target.includes(normalized));
    })
    .map(normalizeSubcatText);
  if (matchedNames.some(name => recordNames.includes(name))) return true;

  // 「其他禽蛋」不是一个具体食品名：匹配鸡蛋以外的禽蛋名称。
  if (cat === '鲜蛋' && /^其他禽蛋/.test(cleaned)) {
    return recordNames.some(name => /鸭蛋|鹅蛋|鹌鹑蛋|鸽蛋|火鸡蛋/.test(name));
  }
  return false;
}

// 细类过滤：优先按 sub_category 精确匹配；官方细类比 master 更细时，再按食品名映射兜底。
function filterRecordsBySubcategory(records, cat, subName) {
  if (!subName) return records;
  const keys = resolveSubcatFilterKeys(cat, subName) || [];
  if (!keys.length) return records;
  return records.filter(r => {
    const sc = (r.sub_category || r.category || '').split(/[-—]/).pop().trim();
    // 同时检查 sub_category 完整键和末尾段。
    const fullSc = r.sub_category || r.category || '';
    if (keys.some(k => k === fullSc)) return true;
    // 「碳酸饮料」+「饮料-碳酸饮料」。
    if (sc && keys.some(k => k.endsWith(`-${sc}`))) return true;
    // 「碳酸饮料（汽水）」→「碳酸饮料」尾巴。
    const subShort = subName.replace(/[（(][^）)]*[）)]\s*$/, '').trim();
    if (subShort && subShort === sc) return true;
    // 典型场景：master 只有「食用农产品-鲜蛋」，细则选择的是「鸡蛋」。
    return matchesSubcategoryByFoodName(r, cat, subName);
  });
}

// ============ 数据适配：从 master 记录抽取出"项目/标准/实测/单位" ============
// master 真实结构：records[i].failed_items = [{item, result, limit}]（数组）
// 旧代码 r.item / r.project / r.detected_value / r.multiple_of_limit 都是 undefined → 改用本适配层
// 从字符串中抽取第一个数字（带可选小数），用于解析 "0.0926g/kg" / "≤0.05g/kg" / "281mg/kg" / "100mg/kg"
function parseNum(s) {
  if (!s) return NaN;
  const m = String(s).match(/[\d.]+/);
  return m ? parseFloat(m[0]) : NaN;
}

// 归一化限值字符串：µ(U+00B5 微符号) 与 μ(U+03BC 希腊字母mu) 长得一样但编码不同，
// 会导致同样的"≤100µg/kg"被拆成两组。按"项目+限值"分组前统一成 µ(U+00B5)。
function normLimit(s) {
  if (!s) return '';
  return String(s).replace(/\u03BC/g, '\u00B5');
}

function extractFailed(records) {
  return records.map(r => {
    const fi = (r.failed_items && r.failed_items[0]) || {};
    const limitRaw = fi.limit || '';
    const limitNorm = normLimit(limitRaw);
    return {
      ...r,
      item: fi.item || '（未列明项目）',
      detected_value: fi.result || '',
      limit_value: limitNorm,
      // 解析后的数字（用于计算超标倍数）
      detected_num: parseNum(fi.result),
      limit_num: parseNum(limitNorm),
      // 国标限值是否包含"不得检出"字样 → 用于严重度标记
      banDetect: limitRaw.includes('不得检出'),
    };
  });
}

// ============ 风险评分 ============
function calcRisk(records) {
  if (!records || records.length === 0) {
    return { level: 'none', label: '未检出', emoji: '⚪', score: 0 };
  }

  // 抽出适配后字段（保证 r.item / r.detected_value 一定有值）
  const norm = extractFailed(records);
  const items = {};
  const provs = new Set();
  let maxMultiple = 1;

  norm.forEach(r => {
    items[r.item] = (items[r.item] || 0) + 1;
    if (r.source) provs.add(r.source);
    // 解析"0.0926g/kg"或"281mg/kg"——若超过限制倍数=实测/限制（粗算）
    if (!isNaN(r.detected_num) && !isNaN(r.limit_num) && r.limit_num > 0) {
      const mult = r.detected_num / r.limit_num;
      if (mult > maxMultiple) maxMultiple = mult;
    }
  });

  const totalItemCount = Object.values(items).reduce((a,b) => a+b, 0);
  const itemRepeat = Math.max(...Object.values(items));
  const crossProv = provs.size >= 2;

  let score = itemRepeat * 5 + totalItemCount + (crossProv ? 30 : 0) + (maxMultiple > 2 ? 25 : 0);

  let level, label, emoji;
  if (score >= 80 || itemRepeat >= 5) { level = 'high'; label = '高'; emoji = '🔴'; }
  else if (score >= 40) { level = 'mid-high'; label = '中-高'; emoji = '🟠'; }
  else if (score >= 15) { level = 'mid'; label = '中'; emoji = '🟡'; }
  else { level = 'low'; label = '低'; emoji = '🔵'; }

  return { level, label, emoji, score, itemRepeat, crossProv, totalItemCount, maxMultiple, provs: Array.from(provs) };
}

// ============ UI 组件 ============
function renderRiskBlock(risk, food, cat, recordCount, bigCat) {
  const bg = {
    'high': 'risk-high',
    'mid-high': 'risk-mid-high',
    'mid': 'risk-mid',
    'low': 'risk-low',
    'none': 'risk-low',
    'cat': 'risk-cat',
  }[risk.level === 'none' && cat ? 'cat' : risk.level];
  
  let title;
  if (food && cat) title = `${food} @ ${cat}`;
  else if (cat) title = cat;
  else if (food) title = food;
  else title = '';
  
  return `
    <div class="card">
      <div class="risk-block ${bg}">
        <div class="emoji">${risk.emoji}</div>
        <div style="flex:1">
          <div class="label">${risk.label}${cat ? '（类别风险）' : ''}</div>
          <div class="score">
            <strong>${title}</strong> · ${recordCount} 条不合格记录${risk.level !== 'none' ? ` · 得分 ${risk.score}` : ''}${risk.provs?.length ? ` · 涉及省份：${risk.provs.join('、')}` : ''}
          </div>
        </div>
      </div>
    </div>
  `;
}

// 类别结果中的历史不合格项目：按项目汇总，点击项目行展开全部原始记录
function renderHistoricalItemsCard(records, title) {
  const norm = extractFailed(records);
  if (!norm || norm.length === 0) return '';

  const agg = {};
  norm.forEach(r => {
    const key = r.item || '（未列明项目）';
    if (!agg[key]) {
      agg[key] = {
        item: key,
        count: 0,
        limits: new Set(),
        banDetect: false,
        maxMult: 1,
        sampleItems: [],
      };
    }
    const entry = agg[key];
    entry.count++;
    if (r.limit_value) entry.limits.add(r.limit_value);
    entry.banDetect = entry.banDetect || r.banDetect;
    if (!isNaN(r.detected_num) && !isNaN(r.limit_num) && r.limit_num > 0) {
      entry.maxMult = Math.max(entry.maxMult, r.detected_num / r.limit_num);
    }
    entry.sampleItems.push(r);
  });

  const rows = Object.values(agg).sort((a, b) => b.count - a.count || a.item.localeCompare(b.item));
  const severity = (r) => {
    if (r.banDetect) return { cls: 'sev-high', label: '不得检出' };
    if (r.maxMult >= 2) return { cls: 'sev-high', label: `${r.maxMult.toFixed(1)}× 超标` };
    if (r.count >= 5) return { cls: 'sev-high', label: '高频' };
    if (r.maxMult >= 1.2) return { cls: 'sev-mid', label: `${r.maxMult.toFixed(1)}× 超标` };
    return { cls: 'sev-low', label: '超限值' };
  };

  return `
    <div class="card history-card">
      <div class="card-title">🔥 ${title}</div>
      <div style="font-size:12px;color:#7f8c8d;margin:-4px 0 10px 0;">💡 点击任一不合格项目，可展开查看对应的抽检记录、实测值和限值。</div>
      <div class="result-list">
        ${rows.map((r, idx) => {
          const s = severity(r);
          const limits = [...r.limits].join(' / ') || '限值未列明';
          const foodCount = new Set(r.sampleItems.map(x => x.food_name_raw || x.food_name_canonical)).size;
          return `
            <div class="summary-row history-summary-row" data-idx="${idx}" role="button" tabindex="0" aria-expanded="false">
              <div><strong>${r.item}</strong></div>
              <div class="muted" style="font-size:12px;">${limits}</div>
              <div class="bad" style="font-weight:700;">${r.count} 次</div>
              <div class="muted" style="font-size:12px;">涉及 ${foodCount} 个食品</div>
              <div><span class="sev ${s.cls}">${s.label}</span></div>
              <div class="arrow">▶</div>
            </div>
            <div class="detail-block" data-detail="${idx}" style="display:none;">
              ${renderItemDetail(r.sampleItems, r.item, limits)}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function renderItemsTable(records, title) {
  // 先做数据适配（保证 r.item / r.detected_value / r.limit_value 都有值）
  const norm = extractFailed(records);
  if (!norm || norm.length === 0) {
    return `<div class="card"><div class="empty-tip">📭 ${title}：无记录</div></div>`;
  }

  // 按"项目 + 限值"聚合（限值经 normLimit 兜底归一化 µ/μ）
  const agg = {};
  norm.forEach(r => {
    const k = `${r.item}|${normLimit(r.limit_value)}`;
    if (!agg[k]) {
      agg[k] = {
        item: r.item,
        limit: r.limit_value || '',
        count: 0,
        banDetect: r.banDetect,
        maxMult: 1,
        sampleItems: [],
      };
    }
    agg[k].count++;
    if (!isNaN(r.detected_num) && !isNaN(r.limit_num) && r.limit_num > 0) {
      const mult = r.detected_num / r.limit_num;
      if (mult > agg[k].maxMult) agg[k].maxMult = mult;
    }
    agg[k].sampleItems.push(r);
  });

  const rows = Object.values(agg).sort((a, b) => b.count - a.count);

  const sev = (r) => {
    if (r.banDetect) return { cls: 'sev-high', label: '不得检出' };
    if (r.maxMult >= 2) return { cls: 'sev-high', label: `${r.maxMult.toFixed(1)}×` };
    if (r.count >= 5) return { cls: 'sev-high', label: '高频' };
    if (r.maxMult >= 1.2) return { cls: 'sev-mid', label: `${r.maxMult.toFixed(1)}×` };
    return { cls: 'sev-low', label: '轻微' };
  };

  return `
    <div class="card">
      <div class="card-title">📋 ${title}（按不合格项目汇总 · 共 ${rows.length} 项 · ${norm.length} 条记录）</div>
      <div style="font-size:12px;color:#7f8c8d;margin:-4px 0 10px 0;">💡 点击任一行可展开 · 查看该项目所有不合格明细（食品/抽样单位/生产日期/实测值等）</div>
      <div class="result-list">
        ${rows.map((r, idx) => {
          const s = sev(r);
          return `
            <div class="summary-row" data-idx="${idx}">
              <div><strong>${r.item}</strong></div>
              <div class="muted" style="font-size:12px;">${r.limit || '—'}</div>
              <div class="bad" style="font-weight:700;">${r.count} 次</div>
              <div class="muted" style="font-size:12px;">涉及 ${new Set(r.sampleItems.map(x => x.food_name_raw || x.food_name_canonical)).size} 个食品</div>
              <div><span class="sev ${s.cls}">${s.label}</span></div>
              <div class="arrow">▶</div>
            </div>
            <div class="detail-block" data-detail="${idx}" style="display:none;">
              ${renderItemDetail(r.sampleItems, r.item, r.limit)}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

// 展开后的明细表（每条原始记录）
function renderItemDetail(records, itemName, limit) {
  if (!records.length) return '<div class="empty-tip">无明细</div>';
  const sorted = [...records].sort((a, b) => {
    const k = (a.source || '') + '|' + (a.food_name_raw || a.food_name_canonical || '') + '|' + (a.prod_date || '');
    const j = (b.source || '') + '|' + (b.food_name_raw || b.food_name_canonical || '') + '|' + (b.prod_date || '');
    return k.localeCompare(j);
  });
  return `
    <div style="font-size:12px;color:#5d6d7e;margin-bottom:6px;">
      <strong>${itemName}</strong> · 国标限值：<code>${limit || '—'}</code>
    </div>
    <table>
      <thead><tr>
        <th>来源</th>
        <th>食品名</th>
        <th>抽样单位</th>
        <th>生产/购进日期</th>
        <th>实测值</th>
        <th>限值</th>
        <th>超标</th>
      </tr></thead>
      <tbody>
        ${sorted.map(r => {
          let mult = '';
          if (!isNaN(r.detected_num) && !isNaN(r.limit_num) && r.limit_num > 0) {
            mult = (r.detected_num / r.limit_num).toFixed(2) + '×';
          }
          return `
            <tr>
              <td><span class="meta-tag">${r.source || '—'}</span></td>
              <td>${r.food_name_raw || r.food_name_canonical || '—'}</td>
              <td class="muted" style="font-size:12px;">${r.sampler_name || '—'}</td>
              <td class="muted" style="font-size:12px;">${r.prod_date || '—'}</td>
              <td class="bad">${r.detected_value || '—'}</td>
              <td class="muted">${r.limit_value || '—'}</td>
              <td>${mult ? `<span class="bad">${mult}</span>` : '—'}</td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;
}

function renderTips(cat, options = {}) {
  if (!cat) return '';
  const includeHistory = options.includeHistory !== false;

  // 历史不合格项目：来自 master.json 中此大类的所有记录，按项目聚合
  const histRecords = state.master.records.filter(r => r.big_category === cat);
  const normHist = extractFailed(histRecords);
  const histAgg = {};
  normHist.forEach(r => {
    const k = r.item;
    if (!histAgg[k]) histAgg[k] = { item: r.item, count: 0, banDetect: r.banDetect, maxMult: 1, limits: new Set(), sampleItems: [] };
    histAgg[k].count++;
    histAgg[k].sampleItems.push(r);
    if (r.limit_value) histAgg[k].limits.add(r.limit_value);
    if (!isNaN(r.detected_num) && !isNaN(r.limit_num) && r.limit_num > 0) {
      const mult = r.detected_num / r.limit_num;
      if (mult > histAgg[k].maxMult) histAgg[k].maxMult = mult;
    }
  });
  const histRows = Object.values(histAgg).sort((a, b) => b.count - a.count).slice(0, 6);

  // 基础资质清单（任何类别都必备）
  const baseDocs = [
    { text: 'SC 证 / 营业执照（生产、销售资质）', src: '《食品生产许可管理办法》' },
    { text: '每批出厂检验报告（厂家自检）', src: '《食品安全法》§52 出厂检验记录' },
    { text: '近 6 个月第三方全项报告（重点核查下方项目）', src: '第三方 CMA 资质机构出具' },
  ];

  return `
    <div class="card">
      <div class="card-title">🛡️ 向供应商索证索票建议（按大类 ${cat}）</div>

      ${includeHistory ? (histRows.length > 0 ? `
        <div class="tip-block">
          <div class="tip-block-title">🔥 历史不合格项目（向供应商索取全项报告时重点核查，已发生过 ${histRecords.length} 次）</div>
          <div style="font-size:12px;color:#7f8c8d;margin:-4px 0 10px 0;">💡 点击任一项目行可展开，查看对应的食品、抽样单位、日期、实测值和限值。</div>
          <div class="result-list">
            ${histRows.map((r, idx) => {
              // 严重度：不得检出 / 高倍数(≥2×) / 中倍数(1.2-2×) / 低倍数
              let sev, cls;
              if (r.banDetect) {
                sev = '不得检出';
                cls = 'sev-high';
              } else if (r.maxMult >= 2) {
                sev = `${r.maxMult.toFixed(1)}× 超标`;
                cls = 'sev-high';
              } else if (r.maxMult >= 1.2) {
                sev = `${r.maxMult.toFixed(1)}× 超标`;
                cls = 'sev-mid';
              } else {
                sev = '超限值';
                cls = 'sev-low';
              }
              const limitTxt = [...r.limits].join(' / ') || '限值未列明';
              const foodCount = new Set(r.sampleItems.map(x => x.food_name_raw || x.food_name_canonical)).size;
              return `
                <div class="summary-row history-summary-row" data-idx="${idx}" role="button" tabindex="0" aria-expanded="false">
                  <div><strong>${r.item}</strong></div>
                  <div class="muted" style="font-size:12px;">${limitTxt}</div>
                  <div class="bad" style="font-weight:700;">${r.count} 次</div>
                  <div class="muted" style="font-size:12px;">涉及 ${foodCount} 个食品</div>
                  <div><span class="sev ${cls}">${sev}</span></div>
                  <div class="arrow">▶</div>
                </div>
                <div class="detail-block" data-detail="${idx}" style="display:none;">
                  ${renderItemDetail(r.sampleItems, r.item, limitTxt)}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      ` : `
        <div class="tip-block">
          <div class="tip-block-title">🔥 历史不合格项目</div>
          <div class="empty-tip">✓ 该类别暂无历史不合格记录，相对风险较低</div>
        </div>
      `) : ''}

      <div class="tip-block">
        <div class="tip-block-title">📑 基础资质清单（任何类别均需）</div>
        <ul class="checklist">
          ${baseDocs.map(d => `<li><strong>${d.text}</strong><br><span class="muted" style="font-size:11px;">依据：${d.src}</span></li>`).join('')}
        </ul>
      </div>
    </div>
  `;
}

// ============ 多选品类对比 ============
function renderMultiCategoryOnly(result, cats) {
  const master = state.master;

  // 1. 合并所有类别的记录
  const allRecords = master.records.filter(r => cats.includes(r.big_category));

  // 2. 各类别独立统计
  const catStats = cats.map(cat => {
    const catRecs = allRecords.filter(r => r.big_category === cat);
    const risk = calcRisk(catRecs);
    const norm = extractFailed(catRecs);
    const itemCounts = {};
    norm.forEach(r => {
      itemCounts[r.item] = (itemCounts[r.item] || 0) + 1;
    });
    const topItem = Object.entries(itemCounts).sort((a,b) => b[1]-a[1])[0];
    return {
      name: cat,
      count: catRecs.length,
      risk,
      topItem: topItem ? `${topItem[0]} (${topItem[1]}次)` : '—',
    };
  });

  // 3. 合并风险 = 取最高
  const maxRisk = catStats.reduce((max, c) =>
    c.risk.level > max.level ? c.risk : max, { level: 0 });

  // 4. 多类别结果直接展示历史不合格明细。

  result.innerHTML = `
    ${renderRiskBlock(maxRisk, '', cats.join(' + '), allRecords.length, cats.join(' + '))}

    <div class="card">
      <div class="card-title">📊 多类别对比（${cats.length} 个类别 · 共 ${allRecords.length} 条不合格记录）</div>
      <div class="meta-row">
        <span class="meta-tag">综合风险 <strong>${maxRisk.label}</strong></span>
        <span class="meta-tag">历史不合格记录 <strong>${allRecords.length}</strong> 条</span>
      </div>
      <table>
        <thead><tr><th>类别</th><th>记录数</th><th>风险</th><th>高频不合格项目</th></tr></thead>
        <tbody>
          ${catStats.map(s => `
            <tr>
              <td><strong>${s.name}</strong></td>
              <td class="bad">${s.count}</td>
              <td><span class="risk-badge risk-${s.risk.cls}">${s.risk.label}</span></td>
              <td>${s.topItem}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>

    ${renderItemsTable(allRecords, `合并不合格明细（${cats.length} 类聚合）`)}

    ${renderMultiTips(cats)}
  `;
}

// ============ 食品 + 多选类别 ============
function renderFoodMultiCategory(result, food, cats) {
  const master = state.master;
  // 食品名精确匹配 + 大类在 cats 内
  let records = master.records.filter(r => cats.includes(r.big_category));
  records = records.filter(r =>
    r.food_name_raw.includes(food) ||
    (r.food_name_canonical && r.food_name_canonical.includes(food))
  );

  // 按类别聚合 + 共同不合格项目
  const catStats = cats.map(cat => {
    const catRecs = records.filter(r => r.big_category === cat);
    return { name: cat, count: catRecs.length };
  });

  // 共同不合格项目
  const itemCounts = {};
  extractFailed(records).forEach(r => {
    itemCounts[r.item] = (itemCounts[r.item] || 0) + 1;
  });
  const topItems = Object.entries(itemCounts).sort((a,b) => b[1]-a[1]).slice(0, 8);

  // 综合风险
  const risk = calcRisk(records);
  const catsNotMatched = catStats.filter(s => s.count === 0);

  result.innerHTML = `
    ${renderRiskBlock(risk, food, cats.join(' + '), records.length, cats.join(' + '))}

    ${catsNotMatched.length > 0 ? `
      <div class="card" style="background:#fff8e1;border-left:4px solid #ffa000;">
        <div style="font-size:13px;color:#5d4037;">
          ⚠️ 「${food}」在以下类别中无匹配记录：<strong>${catsNotMatched.map(s=>s.name).join('、')}</strong>（仅显示有记录的 ${cats.length - catsNotMatched.length} 个类别）
        </div>
      </div>
    ` : ''}

    ${records.length > 0 ? `
      <div class="card">
        <div class="card-title">📊 食品「${food}」按类别分布（${records.length} 条记录）</div>
        <table>
          <thead><tr><th>类别</th><th>记录数</th></tr></thead>
          <tbody>
            ${catStats.filter(s => s.count > 0).map(s => `<tr><td>${s.name}</td><td class="bad">${s.count}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>

      ${renderItemsTable(records, `「${food}」跨 ${cats.length} 类别不合格明细`)}

      ${topItems.length > 0 ? `
        <div class="card">
          <div class="card-title">🔥 跨类别共同不合格项目</div>
          <ul class="checklist">
            ${topItems.map(([item, count]) => `<li class="must">${item} <span class="tip-freq">${count} 次</span></li>`).join('')}
          </ul>
        </div>
      ` : ''}
    ` : `
      <div class="card">
        <div class="empty-tip">⚠️ 「${food}」在所选 ${cats.length} 个类别中无不合格记录</div>
      </div>
    `}
  `;
}

// ============ 多选版 索证索票建议 ============

  // 合并所有类别的历史不合格项目
  const master = state.master;
  const allHistRecs = master.records.filter(r => cats.includes(r.big_category));
  const normHist = extractFailed(allHistRecs);
  const histAgg = {};
  normHist.forEach(r => {
    if (!histAgg[r.item]) histAgg[r.item] = { item: r.item, count: 0, banDetect: r.banDetect, maxMult: 1, cats: new Set(), sampleItems: [] };
    histAgg[r.item].count++;
    histAgg[r.item].sampleItems.push(r);
    if (!isNaN(r.detected_num) && !isNaN(r.limit_num) && r.limit_num > 0) {
      const mult = r.detected_num / r.limit_num;
      if (mult > histAgg[r.item].maxMult) histAgg[r.item].maxMult = mult;
    }
    histAgg[r.item].cats.add(r.big_category);
  });
  const histRows = Object.values(histAgg).sort((a, b) => b.count - a.count).slice(0, 10);

  const baseDocs = [

  return `
    <div class="card">
      <div class="card-title">🛡️ 向供应商索证索票建议（${cats.length} 类别合并 · ${cats.join(' + ')}）</div>


      ${histRows.length > 0 ? `
        <div class="tip-block">
          <div class="tip-block-title">🔥 跨类别历史不合格项目（共 ${histRows.length} 项）</div>
          <div style="font-size:12px;color:#7f8c8d;margin:-4px 0 10px 0;">💡 点击任一项目行可展开，查看对应的食品、抽样单位、日期、实测值和限值。</div>
          <div class="result-list">
            ${histRows.map((r, idx) => {
              let sev, cls;
              if (r.banDetect) { sev = '不得检出'; cls = 'sev-high'; }
              else if (r.maxMult >= 2) { sev = `${r.maxMult.toFixed(1)}× 超标`; cls = 'sev-high'; }
              else if (r.maxMult >= 1.2) { sev = `${r.maxMult.toFixed(1)}× 超标`; cls = 'sev-mid'; }
              else { sev = '超限值'; cls = 'sev-low'; }
              return `
                <div class="summary-row history-summary-row" data-idx="${idx}" role="button" tabindex="0" aria-expanded="false">
                  <div><strong>${r.item}</strong></div>
                  <div class="muted" style="font-size:12px;">涉及 ${[...r.cats].join('·')}</div>
                  <div class="bad" style="font-weight:700;">${r.count} 次</div>
                  <div><span class="sev ${cls}">${sev}</span></div>
                  <div class="muted" style="font-size:12px;">${new Set(r.sampleItems.map(x => x.food_name_raw || x.food_name_canonical)).size} 个食品</div>
                  <div class="arrow">▶</div>
                </div>
                <div class="detail-block" data-detail="${idx}" style="display:none;">
                  ${renderItemDetail(r.sampleItems, r.item, '')}
                </div>
              `;
            }).join('')}
          </div>
        </div>
      ` : ''}

      <div class="tip-block">
        <div class="tip-block-title">📑 基础资质清单（任何类别均需）</div>
        <ul class="checklist">
          ${baseDocs.map(d => `<li>${d}</li>`).join('')}
        </ul>
      </div>
    </div>
  `;
}

  render();

function setupFoodInput() {
  const input = document.getElementById('foodInput');
  let debounce;
  input.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      state.foodName = input.value.trim();
      // 不再互斥：食品名和生产单位可同时填写（AND 交集筛选）
      render();
    }, 250);
  });
}

function setupProdInput() {
  const input = document.getElementById('prodInput');
  let debounce;
  input.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      state.prodName = input.value.trim();
      // 不再互斥：生产单位和食品名可同时填写（AND 交集筛选）
      render();
    }, 250);
  });
}

function clearProd() {
  state.prodName = '';
  const p = document.getElementById('prodInput');
  if (p) p.value = '';
  render();
}

function showToast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
