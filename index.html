<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>jianyu · 食品抽检风险查询</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231a365d'/><text x='32' y='44' font-family='Arial,sans-serif' font-size='30' font-weight='600' fill='white' text-anchor='middle'>JY</text></svg>">
<meta name="theme-color" content="#1a365d">
<style>
:root {
  --c-bg: #f6f8fb;
  --c-surface: #ffffff;
  --c-border: #e6ebf1;
  --c-border-strong: #d0d7e0;
  --c-text-1: #1a2332;
  --c-text-2: #5d6d7e;
  --c-text-3: #95a5a6;
  --c-primary: #1a365d;
  --c-primary-2: #2c5282;
  --c-primary-soft: #ebf2fa;
  --c-accent: #8e44ad;
  --c-accent-soft: #f5edf7;
  --c-high: #c62828;
  --c-high-soft: #ffebee;
  --c-mid: #e65100;
  --c-mid-soft: #fff3e0;
  --c-warn: #f57f17;
  --c-warn-soft: #fffde7;
  --c-ok: #2e7d32;
  --c-ok-soft: #e8f5e9;
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 16px;
  --shadow-soft: 0 1px 2px rgba(20, 30, 50, 0.04), 0 0 1px rgba(20, 30, 50, 0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--c-bg); }
body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; color: var(--c-text-1); padding: 24px 16px; line-height: 1.6; font-size: 14px; -webkit-font-smoothing: antialiased; }
.container { max-width: 980px; margin: 0 auto; }

header.brand { display: flex; align-items: center; gap: 14px; padding: 6px 4px 20px; border-bottom: 1px solid var(--c-border); margin-bottom: 22px; }
header.brand .logo { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, var(--c-primary-2), var(--c-primary)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 18px; letter-spacing: -0.5px; box-shadow: var(--shadow-soft); flex-shrink: 0; }
header.brand .brand-text { flex: 1; min-width: 0; }
header.brand .brand-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
header.brand .brand-title .zh { font-size: 18px; font-weight: 600; color: var(--c-text-1); letter-spacing: 0.3px; }
header.brand .subtitle { font-size: 12px; color: var(--c-text-2); margin-top: 6px; }
header.brand .ver { font-size: 11px; color: var(--c-text-2); padding: 5px 12px; background: var(--c-primary-soft); border-radius: 14px; font-weight: 500; letter-spacing: 0.3px; flex-shrink: 0; }

.section { background: var(--c-surface); border-radius: var(--r-md); padding: 18px 22px; margin-bottom: 14px; border: 1px solid var(--c-border); box-shadow: var(--shadow-soft); }
.section-title { font-size: 13px; font-weight: 600; color: var(--c-text-1); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.section-title .hint { font-size: 12px; color: var(--c-text-3); font-weight: normal; }

input[type="text"] { width: 100%; padding: 12px 14px; border: 1px solid var(--c-border-strong); border-radius: var(--r-sm); font-size: 14px; outline: none; transition: border-color 0.15s, box-shadow 0.15s; background: #fafbfc; color: var(--c-text-1); }
input[type="text"]:focus { border-color: var(--c-primary-2); background: white; box-shadow: 0 0 0 3px rgba(44, 82, 130, 0.1); }
.input-row { display: flex; gap: 8px; align-items: center; }
.input-row input { flex: 1; }
button { background: white; border: 1px solid var(--c-border-strong); border-radius: var(--r-sm); padding: 8px 14px; font-size: 13px; cursor: pointer; color: var(--c-text-2); transition: all 0.15s; font-family: inherit; }
button:hover { background: var(--c-primary-soft); border-color: var(--c-primary-2); color: var(--c-primary); }
button.primary { background: var(--c-primary-2); color: white; border-color: var(--c-primary-2); }
button.primary:hover { background: var(--c-primary); border-color: var(--c-primary); }

.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; max-height: 360px; overflow-y: auto; padding: 4px; }
.cat-card { padding: 10px 12px; background: #fafbfc; border: 1px solid var(--c-border); border-radius: var(--r-sm); cursor: pointer; transition: all 0.15s; font-size: 13px; line-height: 1.35; color: var(--c-text-1); user-select: none; }
.cat-card:hover { background: var(--c-primary-soft); border-color: var(--c-primary-2); transform: translateY(-1px); }
.cat-card.selected { background: var(--c-primary-soft); border-color: var(--c-primary-2); box-shadow: 0 0 0 2px rgba(44, 82, 130, 0.15); color: var(--c-primary); font-weight: 500; }
.cat-card .cat-no { color: var(--c-text-3); font-size: 11px; margin-right: 4px; }
.cat-card.selected .cat-no { color: var(--c-primary-2); }

.empty-tip { color: var(--c-text-3); font-size: 12px; padding: 8px 0; }

.card { background: var(--c-surface); border-radius: var(--r-md); padding: 18px 22px; margin-bottom: 12px; border: 1px solid var(--c-border); box-shadow: var(--shadow-soft); }
.card-title { font-size: 13px; font-weight: 600; color: var(--c-text-1); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.card-title .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-left: auto; }

.risk-high { background: var(--c-high-soft); color: var(--c-high); }
.risk-mid-high { background: var(--c-mid-soft); color: var(--c-mid); }
.risk-mid { background: var(--c-warn-soft); color: var(--c-warn); }
.risk-low { background: #e3f2fd; color: #1565c0; }
.risk-none { background: var(--c-ok-soft); color: var(--c-ok); }
.risk-cat { background: var(--c-accent-soft); color: var(--c-accent); }

.risk-block { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-radius: var(--r-md); margin-bottom: 14px; border-left: 4px solid transparent; }
.risk-block.risk-high { border-left-color: var(--c-high); background: var(--c-high-soft); }
.risk-block.risk-mid-high { border-left-color: var(--c-mid); background: var(--c-mid-soft); }
.risk-block.risk-mid { border-left-color: var(--c-warn); background: var(--c-warn-soft); }
.risk-block.risk-low { border-left-color: #1565c0; background: #e3f2fd; }
.risk-block.risk-none { border-left-color: var(--c-ok); background: var(--c-ok-soft); }
.risk-block .emoji { font-size: 30px; }
.risk-block .label { font-size: 18px; font-weight: 600; }
.risk-block .score { font-size: 12px; opacity: 0.75; margin-top: 2px; }
.risk-block .desc { font-size: 12px; color: var(--c-text-2); margin-top: 4px; }

.meta-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.meta-tag { background: #f0f3f6; padding: 4px 10px; border-radius: 14px; font-size: 12px; color: var(--c-text-2); }
.meta-tag strong { color: var(--c-text-1); }
.meta-tag.must { background: var(--c-high-soft); color: var(--c-high); }
.meta-tag.warn { background: var(--c-mid-soft); color: var(--c-mid); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--c-border); }
th { background: #fafbfc; color: var(--c-text-2); font-weight: 600; font-size: 12px; }
.bad { color: var(--c-high); font-weight: 600; }
.muted { color: var(--c-text-3); }

ul.checklist { list-style: none; }
ul.checklist li { padding: 6px 0; padding-left: 22px; position: relative; font-size: 13px; }
ul.checklist li::before { content: "□"; position: absolute; left: 0; color: var(--c-text-2); }
ul.checklist li.must::before { content: "⛔"; color: var(--c-high); }
ul.checklist li.warn::before { content: "⚠"; color: var(--c-mid); }

.tip-source { font-size: 12px; color: var(--c-text-2); background: #f0f4f8; padding: 8px 12px; border-left: 3px solid #5d8aa8; border-radius: 4px; margin-bottom: 14px; line-height: 1.6; }
.tip-block { margin-bottom: 14px; padding: 10px 0; border-top: 1px dashed #e0e0e0; }
.tip-block:first-of-type { border-top: none; }
.tip-block-title { font-size: 13px; font-weight: 600; color: var(--c-text-1); margin-bottom: 8px; }
.tip-freq { display: inline-block; margin-left: 8px; padding: 1px 6px; background: var(--c-mid-soft); color: var(--c-mid); border-radius: 3px; font-size: 11px; font-weight: 600; }
.tip-sev { display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 3px; font-size: 11px; font-weight: 600; color: #fff; background: var(--c-high); }
ul.checklist li.warn .tip-sev { background: var(--c-mid); }

.gb-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.gb-chip { background: var(--c-primary-soft); color: var(--c-primary); padding: 3px 8px; border-radius: 10px; font-size: 12px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

.actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.actions button { font-size: 12px; padding: 6px 12px; }

.dashboard-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.dashboard-cell { background: #fafbfc; padding: 12px 14px; border-radius: var(--r-sm); border-left: 3px solid var(--c-border-strong); font-size: 12px; transition: all 0.15s; cursor: pointer; }
.dashboard-cell:hover { background: white; border-left-color: var(--c-primary-2); transform: translateY(-1px); box-shadow: var(--shadow-soft); }
.dashboard-cell .cat-name { font-weight: 600; color: var(--c-text-1); font-size: 13px; margin-bottom: 4px; }
.dashboard-cell .cat-stats { color: var(--c-text-2); }
.dashboard-cell.has-data { border-left-color: var(--c-high); background: var(--c-high-soft); }
.dashboard-cell.has-data .cat-stats { color: var(--c-high); }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--c-text-1); color: white; padding: 10px 20px; border-radius: var(--r-sm); font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 999; box-shadow: 0 4px 12px rgba(20, 30, 50, 0.15); }
.toast.show { opacity: 0.95; }

footer.brand-foot { text-align: center; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--c-border); font-size: 11px; color: var(--c-text-3); }

.record-row { display: grid; grid-template-columns: 1.4fr 1.2fr 0.6fr 0.6fr 0.7fr; align-items: center; gap: 8px; padding: 10px 12px; background: #fafbfc; border: 1px solid var(--c-border); border-radius: var(--r-sm); font-size: 13px; margin-bottom: 4px; }
.record-row .bad { color: var(--c-high); }
.record-row .sev { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; text-align: center; }
.record-row .sev.high { background: var(--c-high-soft); color: var(--c-high); }
.record-row .sev.mid { background: var(--c-mid-soft); color: var(--c-mid); }
.record-row .sev.low { background: #e3f2fd; color: #1565c0; }

.summary-block { background: #fafbfc; padding: 8px 12px; margin-bottom: 4px; border-left: 3px solid var(--c-border-strong); font-size: 12px; }
.summary-block.high { border-left-color: var(--c-high); background: var(--c-high-soft); }
.summary-block.mid { border-left-color: var(--c-mid); background: var(--c-mid-soft); }
.summary-block .sum-title { font-weight: 600; color: var(--c-text-1); }
.summary-block .sum-detail { color: var(--c-text-2); font-size: 11px; margin-top: 2px; }

@media (max-width: 600px) {
  body { padding: 14px 10px; }
  .section { padding: 14px 14px; }
  .cat-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .dashboard-grid { grid-template-columns: 1fr; }
  .risk-block { padding: 12px; }
  .risk-block .emoji { font-size: 26px; }
  .risk-block .label { font-size: 16px; }
  header.brand .ver { display: none; }
  .record-row { grid-template-columns: 1.6fr 1fr 0.5fr; }
  .record-row .hide-on-mobile { display: none; }
}
</style>
</head>
<body>
<div class="container">

<header class="brand">
  <div class="logo">JY</div>
  <div class="brand-text">
    <div class="brand-title"><span class="zh">食品抽检风险查询</span></div>
    <div class="subtitle" id="subtitle">加载中…</div>
  </div>
  <div class="ver">v4.0 · 2026</div>
</header>

<!-- 主搜索框（核心：单输入框） -->
<section class="section">
  <div class="section-title">
    🔍 输入食品名查询 <span class="hint" style="margin-left:auto;">支持模糊匹配 · 输完无需操作，自动出结果</span>
  </div>
  <div class="input-row">
    <input type="text" id="qInput" placeholder="例如：鸡蛋、桂圆、虾爬子、铁棍山药、饼干…（自由输入）" autocomplete="off" autofocus>
    <button class="primary" onclick="forceSearch()">查询</button>
    <button onclick="clearSearch()">清空</button>
  </div>
  <div class="empty-tip" style="margin-top:8px;">💡 <strong>模糊匹配：</strong>输入"山药"可命中"铁棍山药"；输入"饼干"可命中所有饼干类。如需更精确，可点选下方类别卡片缩窄范围。</div>
</section>

<!-- 类别（可选筛选，不强制） -->
<section class="section">
  <div class="section-title">
    📂 类别筛选 <span class="hint" style="margin-left:auto;">（可选 · 不选也能查）</span>
    <button onclick="clearCategory()" style="margin-left:8px;font-size:12px;">清空已选</button>
  </div>
  <div class="cat-grid" id="catGrid"></div>
</section>

<!-- 结果区 -->
<section id="result"></section>

<footer class="brand-foot">
  数据源：山东 / 辽宁 / 重庆 抽检公告 + GB 2763/2762/2716/29921 + 2026 实施细则 39 大类
</footer>

</div>

<div class="toast" id="toast"></div>

<script>
// ============ v4.0.0 最终版 · 核心目标：输入名称直接出结果 ============
// 状态：去除所有复杂状态机
// 流程：1) 加载数据 → 2) 输入即查 → 3) 模糊匹配 records → 4) 渲染风险等级 + 明细 + 自检项目

const state = {
  records: [],
  categoryMap: {},      // {大细类: [aliases]}  用于 lookupCategory
  subcatToItems: {},    // {aliases: {食品名: {big_category, subcategory}}}
  subcatChecklist: {},  // {categories: {大类: [{name, items: [...]}]}}
  categories: [],       // [{no, name}]  39 大类
  q: '',                // 当前查询词
  selectedCategory: '', // 用户主动点选的类别（可选）
};

// ============ 数据加载 ============
async function loadData() {
  try {
    const [master, cm, subcatItems, subcatChecklist, categories] = await Promise.all([
      fetch('data/master.json').then(r => r.json()),
      fetch('data/category_map.json').then(r => r.json()),
      fetch('data/subcat_to_items.json').then(r => r.json()),
      fetch('data/current_period/gb_checklist_subcat.json').then(r => r.json()),
      fetch('data/categories_2026.json').then(r => r.json()),
    ]);
    state.records = master.records || [];
    state.categoryMap = cm || {};
    state.subcatToItems = (subcatItems && subcatItems.aliases) || {};
    state.subcatChecklist = subcatChecklist || {};
    state.categories = (categories && categories.categories) || [];
    console.log('[v4.0] 数据加载完成', {
      records: state.records.length,
      categories: state.categories.length,
      subcats: Object.keys(state.subcatToItems).length,
    });
    document.getElementById('subtitle').textContent =
      `${state.records.length} 条不合格记录 · 39 大类 · 山东/辽宁/重庆抽检公告 + 2026 实施细则`;
    renderCategoryGrid();
    renderDashboard();
  } catch (e) {
    console.error('[v4.0] 数据加载失败', e);
    document.getElementById('result').innerHTML = `
      <div class="card" style="border-left:4px solid var(--c-high);background:var(--c-high-soft);">
        <div class="card-title">⚠️ 数据加载失败</div>
        <div style="color:var(--c-text-2);font-size:13px;">${e.message}<br><br>
        请检查网络 / GitHub Pages 部署 / 浏览器控制台报错。</div>
      </div>
    `;
  }
}

// ============ 类别网格 ============
function renderCategoryGrid() {
  const grid = document.getElementById('catGrid');
  grid.innerHTML = state.categories.map(c => `
    <div class="cat-card" data-cat="${c.name}" onclick="selectCategory('${c.name}')">
      <span class="cat-no">${c.no || ''}</span>${c.name}
    </div>
  `).join('');
}

function selectCategory(cat) {
  state.selectedCategory = state.selectedCategory === cat ? '' : cat;
  document.querySelectorAll('.cat-card').forEach(el => {
    el.classList.toggle('selected', el.dataset.cat === state.selectedCategory);
  });
  search();
}

function clearCategory() {
  state.selectedCategory = '';
  document.querySelectorAll('.cat-card').forEach(el => el.classList.remove('selected'));
  search();
}

// ============ 核心查询 ============
function search() {
  const q = state.q.trim();
  if (!q) {
    renderDashboard();
    return;
  }
  // 1. 模糊查所有 records（raw + canonical 都查）
  let hits = state.records.filter(r => {
    const raw = r.food_name_raw || '';
    const can = r.food_name_canonical || '';
    return (q && (raw.includes(q) || can.includes(q)));
  });
  // 2. 若用户主动选了大类，缩窄
  if (state.selectedCategory) {
    hits = hits.filter(r => r.big_category === state.selectedCategory);
  }
  renderResults(q, hits);
}

function forceSearch() {
  state.q = document.getElementById('qInput').value.trim();
  search();
}

function clearSearch() {
  document.getElementById('qInput').value = '';
  state.q = '';
  state.selectedCategory = '';
  document.querySelectorAll('.cat-card').forEach(el => el.classList.remove('selected'));
  search();
  document.getElementById('qInput').focus();
}

// ============ Dashboard（无输入时） ============
function renderDashboard() {
  const result = document.getElementById('result');
  // 按大类统计
  const byCat = {};
  for (const r of state.records) {
    const c = r.big_category || '未分类';
    byCat[c] = (byCat[c] || 0) + 1;
  }
  const sorted = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  result.innerHTML = `
    <div class="card" style="text-align:center;padding:24px;">
      <div style="font-size:15px;color:var(--c-text-1);font-weight:600;">📊 请在上方输入食品名开始查询</div>
      <div class="empty-tip" style="margin-top:8px;">支持模糊匹配 · 例：<code>鸡蛋</code> / <code>饼干</code> / <code>山药</code></div>
    </div>
    <div class="card">
      <div class="card-title">📂 各大类历史不合格分布（${state.records.length} 条 / ${sorted.length} 大类）<span class="badge" style="background:var(--c-primary-soft);color:var(--c-primary);">点击卡片自动填充该类别</span></div>
      <div class="dashboard-grid">
        ${sorted.map(([c, n]) => `
          <div class="dashboard-cell has-data" onclick="quickFill('${c}')">
            <div class="cat-name">${c}</div>
            <div class="cat-stats">不合格 <strong>${n}</strong> 条</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  // 绑定快速填充
  document.querySelectorAll('.dashboard-cell').forEach(el => {
    el.addEventListener('click', () => {
      const cat = el.querySelector('.cat-name').textContent.trim();
      state.selectedCategory = cat;
      document.querySelectorAll('.cat-card').forEach(c => {
        c.classList.toggle('selected', c.dataset.cat === cat);
      });
      document.getElementById('qInput').focus();
      showToast(`已选类别「${cat}」— 现在输入食品名查询`);
    });
  });
}

function quickFill(cat) {
  state.selectedCategory = cat;
  document.querySelectorAll('.cat-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.cat === cat);
  });
  document.getElementById('qInput').focus();
  showToast(`已选类别「${cat}」— 现在输入食品名查询`);
}

// ============ 结果渲染 ============
function renderResults(q, hits) {
  const result = document.getElementById('result');
  // 风险等级
  const risk = calcRisk(hits);
  // 命中大类分布
  const catsHit = {};
  for (const r of hits) {
    const c = r.big_category || '未分类';
    catsHit[c] = (catsHit[c] || 0) + 1;
  }
  // 自动归类提示（食品名→类别映射）
  const autoCat = lookupCategory(q);

  result.innerHTML = `
    ${renderRiskBlock(risk, q, hits.length)}
    ${autoCat ? `
      <div class="card" style="background:#fffde7;border-left:4px solid #f57f17;">
        <div style="font-size:13px;color:#5d4037;">
          💡 <strong>「${q}」按内置规则归类为：</strong>
          ${autoCat.fullCategory}（规范名：<code>${autoCat.canonical}</code>）
          ${state.selectedCategory && state.selectedCategory !== autoCat.category
            ? `<br><span class="muted">⚠ 你已手动选「${state.selectedCategory}」，结果已按此筛选；如需看全部命中，<a href="#" onclick="state.selectedCategory='';document.querySelectorAll('.cat-card').forEach(c=>c.classList.remove('selected'));search();return false;" style="color:#1a365d;">点此清空类别</a></span>`
            : ''}
        </div>
      </div>
    ` : `
      <div class="card" style="background:#fff8e1;border-left:4px solid #ffa000;">
        <div style="font-size:13px;color:#5d4037;">
          ⚠️ <strong>「${q}」未在已知分类表中找到</strong>。如结果不准，可<a href="#" onclick="document.getElementById('qInput').focus()" style="color:#1a365d;">换个名称</a>或<a href="#" onclick="document.querySelector('.cat-grid').scrollIntoView({behavior:'smooth'})" style="color:#1a365d;">点选类别</a>细化。
        </div>
      </div>
    `}
    ${renderSummaryBlocks(q, hits)}
    ${renderDetailTable(q, hits)}
    ${renderSelfCheck(q, autoCat, hits)}
  `;
}

// ============ 风险等级计算 ============
function calcRisk(records) {
  if (!records || !records.length) {
    return { level: 'none', label: '未检出', emoji: '⚪', score: 0, desc: '无历史不合格记录' };
  }
  const items = {};
  const provs = new Set();
  let maxMultiple = 1;
  let sampleFail = 0;
  records.forEach(r => {
    const fi = (r.failed_items || [])[0] || {};
    const it = fi.item || '（未列明项目）';
    items[it] = (items[it] || 0) + 1;
    if (r.source) provs.add(r.source);
    if (fi._sample_plan && fi._verdict === 'fail') sampleFail++;
    const det = parseNum(fi.result);
    const lim = parseNum(fi.limit);
    if (!isNaN(det) && !isNaN(lim) && lim > 0) {
      const m = det / lim;
      if (m > maxMultiple) maxMultiple = m;
    }
  });
  const totalItemCount = Object.values(items).reduce((a, b) => a + b, 0);
  const itemRepeat = Math.max(...Object.values(items));
  const crossProv = provs.size >= 2;

  const score = itemRepeat * 5 + totalItemCount + (crossProv ? 30 : 0) + (maxMultiple > 2 ? 25 : 0) + (sampleFail > 0 ? 20 : 0);

  let level, label, emoji, desc;
  if (score >= 80 || itemRepeat >= 5) { level = 'high'; label = '高风险'; emoji = '🔴'; desc = `高频不合格项目 ≥5 次`; }
  else if (score >= 40) { level = 'mid-high'; label = '中-高风险'; emoji = '🟠'; desc = '多次不合格 + 跨省份'; }
  else if (score >= 15) { level = 'mid'; label = '中风险'; emoji = '🟡'; desc = '有不合格记录'; }
  else { level = 'low'; label = '低风险'; emoji = '🔵'; desc = '仅个位数记录'; }

  return { level, label, emoji, score, desc, itemRepeat, crossProv, totalItemCount, maxMultiple, provs: Array.from(provs) };
}

function parseNum(s) {
  if (!s) return NaN;
  const m = String(s).match(/[\d.]+/);
  return m ? parseFloat(m[0]) : NaN;
}

function renderRiskBlock(risk, q, count) {
  return `
    <div class="risk-block risk-${risk.level}">
      <div class="emoji">${risk.emoji}</div>
      <div style="flex:1;">
        <div class="label">${risk.label} · ${count} 条历史不合格记录</div>
        <div class="score">查询词：<strong>${q}</strong>${risk.score ? ` · 评分 ${risk.score}` : ''}</div>
        <div class="desc">${risk.desc}${risk.provs && risk.provs.length ? ` · 涉及 ${risk.provs.join('、')}` : ''}</div>
      </div>
    </div>
  `;
}

// ============ 摘要块（按高频项目聚合） ============
function renderSummaryBlocks(q, hits) {
  if (!hits.length) return '';
  const itemCounts = {};
  hits.forEach(r => {
    const fi = (r.failed_items || [])[0] || {};
    const it = fi.item || '（未列明项目）';
    if (!itemCounts[it]) itemCounts[it] = { count: 0, examples: [] };
    itemCounts[it].count++;
    if (itemCounts[it].examples.length < 2) {
      itemCounts[it].examples.push({
        name: r.food_name_raw || r.food_name_canonical,
        prov: r.source,
        result: fi.result,
        limit: (fi.limit || '').replace(/\\u03bc/g, 'µ'),
      });
    }
  });
  const top = Object.entries(itemCounts).sort((a, b) => b[1].count - a[1].count).slice(0, 5);
  return `
    <div class="card">
      <div class="card-title">📌 不合格项目 Top 5${hits.length > 5 ? `（共 ${Object.keys(itemCounts).length} 类）` : ''}</div>
      ${top.map(([it, info]) => {
        const sev = info.count >= 5 ? 'high' : info.count >= 3 ? 'mid' : 'low';
        return `
          <div class="summary-block ${sev}">
            <div class="sum-title">⛔ ${it} <span class="tip-freq">${info.count} 次</span></div>
            <div class="sum-detail">
              典型案例：${info.examples.map(e => `${e.name}（${e.prov || '?'}：${e.result} 超标 / 限值 ${e.limit}）`).join('；')}
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// ============ 详细明细表（可展开） ============
function renderDetailTable(q, hits) {
  if (!hits.length) {
    return `
      <div class="card">
        <div class="card-title">📋 历史不合格明细</div>
        <div class="empty-tip">本查询范围内无历史不合格记录。</div>
      </div>
    `;
  }
  // 默认展示前 10 条
  const top = hits.slice(0, 10);
  const more = hits.length - top.length;
  return `
    <div class="card">
      <div class="card-title">📋 历史不合格明细（${hits.length} 条）
        ${more > 0 ? `<button onclick="document.getElementById('moreRecords').style.display='block';this.style.display='none';" style="margin-left:auto;font-size:12px;">展开剩余 ${more} 条</button>` : ''}
      </div>
      ${top.map(r => {
        const fi = (r.failed_items || [])[0] || {};
        return `
          <div class="record-row">
            <div><strong>${r.food_name_raw || r.food_name_canonical}</strong></div>
            <div class="hide-on-mobile">${fi.item || '—'}</div>
            <div class="bad hide-on-mobile">${fi.result || '—'}</div>
            <div class="hide-on-mobile">${(fi.limit || '—').replace(/\\u03bc/g, 'µ')}</div>
            <div>${r.source || '?'}</div>
          </div>
        `;
      }).join('')}
      ${more > 0 ? `
        <div id="moreRecords" style="display:none;">
          ${hits.slice(10).map(r => {
            const fi = (r.failed_items || [])[0] || {};
            return `
              <div class="record-row">
                <div><strong>${r.food_name_raw || r.food_name_canonical}</strong></div>
                <div class="hide-on-mobile">${fi.item || '—'}</div>
                <div class="bad hide-on-mobile">${fi.result || '—'}</div>
                <div class="hide-on-mobile">${(fi.limit || '—').replace(/\\u03bc/g, 'µ')}</div>
                <div>${r.source || '?'}</div>
              </div>
            `;
          }).join('')}
        </div>
      ` : ''}
    </div>
  `;
}

// ============ 自检项目建议 ============
function renderSelfCheck(q, autoCat, hits) {
  // 1) 食品名 → 细类 → 检验项目
  let selfCheckItems = [];
  const aliasHit = state.subcatToItems[q];
  if (aliasHit) {
    const big = aliasHit.big_category;
    const sub = aliasHit.subcategory;
    const tables = (state.subcatChecklist.categories || {})[big] || [];
    const target = tables.find(t => t.name === sub);
    if (target) {
      selfCheckItems.push({
        source: `${big} / ${sub}`,
        items: target.items || [],
      });
    }
  }
  // 2) autoCat 兜底
  if (!selfCheckItems.length && autoCat) {
    const big = autoCat.category;
    const tables = (state.subcatChecklist.categories || {})[big] || [];
    if (tables.length) {
      // 取第一个细类（或全表）
      selfCheckItems.push({
        source: `${big}（自动归类）`,
        items: tables.flatMap(t => t.items || []).slice(0, 30),
      });
    }
  }
  // 3) 高频不合格项目转自检
  const histItems = {};
  hits.forEach(r => {
    const fi = (r.failed_items || [])[0] || {};
    const it = fi.item || '';
    if (it) histItems[it] = (histItems[it] || 0) + 1;
  });
  const histTop = Object.entries(histItems).sort((a, b) => b[1] - a[1]).slice(0, 5);

  if (!selfCheckItems.length && !histTop.length) {
    return `
      <div class="card">
        <div class="card-title">🔬 自检项目建议</div>
        <div class="empty-tip">本查询未匹配到对应细类表，暂无标准自检项。如需看完整细则，请到「类别」区域选一个大类。</div>
      </div>
    `;
  }
  return `
    <div class="card">
      <div class="card-title">🔬 自检项目建议（向供应商索证时重点核查）</div>
      ${selfCheckItems.length ? `
        <div class="tip-block">
          <div class="tip-block-title">📘 2026 实施细则法定检验项目</div>
          <div class="tip-source">数据源：《食品安全监督抽检实施细则（2026 年版）》${selfCheckItems[0].source}</div>
          <ul class="checklist">
            ${selfCheckItems[0].items.slice(0, 30).map(it => `
              <li>
                <strong>${it.检验项目 || it.item || it.name || '?'}</strong>
                ${it.标准值 || it.limit || it.standard ? ` · <span class="muted">${it.标准值 || it.limit || it.standard}</span>` : ''}
              </li>
            `).join('')}
          </ul>
          ${selfCheckItems[0].items.length > 30 ? `<div class="empty-tip">… 还有 ${selfCheckItems[0].items.length - 30} 项</div>` : ''}
        </div>
      ` : ''}
      ${histTop.length ? `
        <div class="tip-block">
          <div class="tip-block-title">⚠ 历史高频不合格项（必查）</div>
          <ul class="checklist">
            ${histTop.map(([it, n]) => `
              <li class="must">
                <strong>${it}</strong>
                <span class="tip-freq">${n} 次</span>
                <span class="tip-sev">必检</span>
              </li>
            `).join('')}
          </ul>
        </div>
      ` : ''}
    </div>
  `;
}

// ============ lookup 辅助 ============
function lookupCategory(foodName) {
  if (!foodName) return null;
  const cm = state.categoryMap || {};
  // 1. 精确匹配
  for (const [cat, items] of Object.entries(cm)) {
    if (cat.startsWith('_')) continue;
    if (Array.isArray(items) && items.includes(foodName)) {
      const bigCat = cat.split('-')[0];
      return { category: bigCat, fullCategory: cat, canonical: foodName };
    }
  }
  // 2. 别名映射 (subcat_to_items)
  const sub = state.subcatToItems[foodName];
  if (sub) {
    return { category: sub.big_category, fullCategory: `${sub.big_category}-${sub.subcategory}`, canonical: sub.subcategory };
  }
  return null;
}

// ============ Toast ============
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

// ============ 启动 ============
let searchDebounce = null;
let isComposing = false;

document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('qInput');

  // IME 拼音防护
  input.addEventListener('compositionstart', () => { isComposing = true; });
  input.addEventListener('compositionend', () => {
    isComposing = false;
    state.q = input.value.trim();
    search();
  });
  // 实时查询（拼音过程中不查）
  input.addEventListener('input', () => {
    if (isComposing) return;
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => {
      state.q = input.value.trim();
      search();
    }, 200);
  });
  // Enter / blur 立刻查
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      state.q = input.value.trim();
      search();
    }
  });
  input.addEventListener('blur', () => {
    state.q = input.value.trim();
    search();
  });

  loadData();

  // 强制清理旧 Service Worker（v4.0 起不再注册新 SW）
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(regs => {
      regs.forEach(reg => reg.unregister());
    });
    if (window.caches) {
      caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
    }
  }
});
</script>
